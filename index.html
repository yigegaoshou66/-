<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 综合管理助手</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-orange: #FF9500;
            --ios-gray: #8E8E93;
            
            --text-primary: #1c1c1e;
            --text-secondary: rgba(60, 60, 67, 0.6);
            --text-tertiary: rgba(60, 60, 67, 0.35);
            
            --glass-light: rgba(255, 255, 255, 0.55);
            --glass-light-strong: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-highlight: rgba(255, 255, 255, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { margin: 0; padding: 0; min-height: 100vh; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; 
            padding: 16px; 
            color: var(--text-primary); 
            -webkit-font-smoothing: antialiased;
            background: #F2F4F8;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -100px;
            z-index: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(255, 150, 150, 0.6) 0%, transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(120, 180, 255, 0.6) 0%, transparent 32%),
                radial-gradient(circle at 70% 60%, rgba(150, 230, 180, 0.5) 0%, transparent 33%),
                radial-gradient(circle at 20% 75%, rgba(255, 220, 130, 0.55) 0%, transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(200, 160, 240, 0.55) 0%, transparent 33%);
            filter: blur(70px);
            opacity: 0.9;
            animation: blobsMove 25s ease-in-out infinite alternate;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
        }
        @keyframes blobsMove {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(1.05); }
        }

        .container { 
            position: relative;
            z-index: 1;
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }

        .top-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px; 
            gap: 12px;
        }
        .store-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 14px 20px;
            border-radius: 22px;
            background: var(--glass-light);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.5),
                0 4px 16px rgba(0, 0, 0, 0.05);
            overflow-x: auto; white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        .store-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .store-name { font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }

        .logout-btn button { 
            width: auto; padding: 14px 20px; font-size: 14px; font-weight: 600;
            background: var(--glass-light-strong);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            color: var(--ios-blue);
            border: 1px solid var(--glass-border); 
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.5),
                0 4px 12px rgba(0, 0, 0, 0.06);
            transition: all 0.15s;
            margin-bottom: 0;
            white-space: nowrap;
        }
        .logout-btn button:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.9); }

        .entry-links { display: flex; gap: 10px; margin-bottom: 16px; }
        .entry-links a { 
            flex: 1; text-align: center; text-decoration: none; padding: 18px 8px; 
            border-radius: 22px; 
            color: var(--text-primary); font-weight: 600; font-size: 14px; 
            background: var(--glass-light);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.5),
                0 4px 16px rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .entry-links a::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
        }
        .entry-links a:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.75); }
        .entry-order { color: #007AFF; }
        .entry-after { color: #FF9500; }
        .entry-kami { color: #6F42C1; }

        .top-bar { margin-bottom: 20px; }
        .top-bar button { 
            width: 100%; padding: 18px; font-size: 16px; font-weight: 600;
            background: linear-gradient(180deg, rgba(10, 132, 255, 0.95) 0%, rgba(0, 100, 220, 0.95) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1),
                0 8px 24px rgba(10, 132, 255, 0.3);
            transition: all 0.15s;
            letter-spacing: -0.2px;
            position: relative;
            overflow: hidden;
            margin-bottom: 0;
        }
        .top-bar button::before {
            content: "";
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
        }
        .top-bar button:active { transform: scale(0.98); }

        button { 
            padding: 10px 16px; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; 
            background: var(--ios-blue); 
            transition: transform 0.05s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.05s, box-shadow 0.05s; 
            width: 100%; margin-bottom: 10px;
        }
        button:active { transform: scale(0.92); opacity: 0.85; filter: brightness(0.9); }
        
        .btn-edit { background: var(--ios-orange); color: #fff; }
        .btn-save { background: var(--ios-green); width: auto; margin-bottom: 0; }
        
        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        
        tr { 
            display: flex; flex-wrap: wrap; 
            background: var(--glass-light);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 26px; 
            margin-bottom: 14px; padding: 20px; 
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.5),
                0 6px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        tr::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
            z-index: 2;
        }
        tr:active { background: rgba(255, 255, 255, 0.7); }
        
        td { 
            display: flex; align-items: center; 
            padding: 0; border: none; 
            font-size: 13px; text-align: left; color: var(--text-primary); 
            flex: 0 0 auto; margin-right: 12px; 
            position: relative;
            z-index: 1;
        }
        td::before { content: attr(data-label); font-weight: 500; color: var(--text-secondary); margin-right: 4px; flex-shrink: 0; }
        
        td[data-label="标题"], td[data-label="商品ID"], td[data-label="状态 / 操作"] { 
            flex: 0 0 100%; width: 100%; margin-right: 0;
        }
        
        td[data-label="标题"] { font-size: 16px; font-weight: 700; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid rgba(60,60,67,0.08); line-height: 1.35; }
        td[data-label="标题"]::before { display: none; }
        td[data-label="商品ID"] { font-size: 11px; color: var(--text-tertiary); padding-bottom: 6px; font-family: monospace; }
        td[data-label="商品ID"]::before { font-size: 11px; }
        
        td[data-label="价格"]::before { content: "价:"; color: var(--text-secondary); }
        td[data-label="库存"]::before { content: "库:"; color: var(--text-secondary); }
        
        td[data-label="状态 / 操作"] { 
            margin-top: 12px; padding-top: 14px; 
            border-top: 1px solid rgba(60,60,67,0.08); 
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-start;
        }
        td[data-label="状态 / 操作"]::before { display: none; }
        td[data-label="状态 / 操作"] button { padding: 10px 16px; font-size: 13px; margin: 0; border-radius: 100px; width: auto; font-weight: 600; }
        
        tr.sku-row {
            display: flex; flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 20px;
            margin-top: -8px; margin-bottom: 14px;
            margin-left: 10px; 
            padding: 14px; 
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--ios-blue);
            box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 12px rgba(0,0,0,0.04);
        }
        tr.sku-row td { font-size: 13px; padding: 0; margin-right: 0; border: none; }
        tr.sku-row td[data-label="SKU_ID"] { width: 100%; flex: 0 0 100%; font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; }
        tr.sku-row td[data-label="SKU_ID"]::before { display: none; }
        tr.sku-row td[data-label="规格"] { width: 100%; flex: 0 0 100%; font-weight: 600; margin-bottom: 8px; }
        tr.sku-row td[data-label="规格"]::before { display: none; }
        
        tr.sku-row td[data-label="价格"], 
        tr.sku-row td[data-label="库存"] { 
            flex: 1 1 0; 
            width: 0;
            display: flex; 
            align-items: center; 
            margin-right: 4px; 
            min-width: 0; 
        }
        tr.sku-row td[data-label="价格"]::before { content: "价"; margin-right: 2px; font-size: 12px; color: var(--text-secondary); }
        tr.sku-row td[data-label="库存"]::before { content: "库"; margin-right: 2px; font-size: 12px; color: var(--text-secondary); }
        
        tr.sku-row td[data-label="操作"] { 
            flex: 0 0 auto; 
            display: flex; 
            align-items: center; 
            justify-content: flex-end; 
            width: auto !important; 
            margin-top: 0 !important; 
            padding-top: 0 !important; 
            border-top: none !important; 
            margin-left: 2px;
        }
        
        tr.sku-row .input-box { 
            flex: 1; 
            width: 100%;
            min-width: 25px;
            padding: 6px 2px; 
            font-size: 13px; 
            text-align: center; 
            margin: 0; 
            border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 8px; 
            outline: none; 
            transition: all 0.2s;
            background: #fff;
        }
        tr.sku-row .input-box:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 2px rgba(0,122,255,0.15); }
        
        tr.sku-row td[data-label="操作"] .btn-save {
            padding: 6px 12px !important;
            font-size: 12px !important;
            white-space: nowrap;
            border-radius: 100px !important;
            margin: 0 !important;
        }

        .status-btn {
            display: inline-flex !important; align-items: center; gap: 4px;
            padding: 10px 16px !important; border-radius: 100px !important;
            font-size: 13px !important; font-weight: 600 !important;
            cursor: pointer !important; border: 1px solid rgba(255,255,255,0.5) !important;
            transition: transform 0.1s, opacity 0.1s, filter 0.1s !important;
        }
        .status-btn:active { transform: scale(0.9) !important; opacity: 0.75 !important; }
        .status-btn-on { background: var(--ios-green) !important; color: #fff !important; }
        .status-btn-off { background: var(--ios-red) !important; color: #fff !important; }
        .status-btn-sold { background: var(--ios-gray) !important; color: #fff !important; }
        .status-btn-unknown { background: var(--ios-orange) !important; color: #fff !important; }

        .status-msg { margin-top: 12px; color: var(--text-secondary); font-weight: 600; font-size: 13px; text-align: center; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-content { 
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 28px 28px 0 0; 
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
            width: 100%; max-height: 90vh; 
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            border: 1px solid var(--glass-border);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,1);
            animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-content h2 { margin-top: 0; border-bottom: 1px solid rgba(60,60,67,0.08); padding-bottom: 12px; font-size: 18px; font-weight: 700; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary); }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 14px; border: 1px solid rgba(0,0,0,0.08); 
            background: rgba(255,255,255,0.7); border-radius: 14px; 
            font-size: 16px; outline: none; box-sizing: border-box; transition: all 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--ios-blue); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }
        .form-group textarea { height: 110px; resize: vertical; }
        
        .modal-footer { text-align: right; margin-top: 20px; border-top: 1px solid rgba(60,60,67,0.08); padding-top: 16px; display: flex; gap: 12px; justify-content: flex-end; }
        .modal-footer button { width: auto; padding: 12px 24px; margin-bottom: 0; font-size: 14px; border-radius: 100px; }

        .sku-edit-section { margin-top: 20px; border-top: 1px dashed rgba(60,60,67,0.15); padding-top: 16px; }
        .sku-edit-section h3 { font-size: 14px; margin-bottom: 12px; color: var(--ios-blue); }
        .sku-edit-item { background: rgba(255,255,255,0.6); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--glass-border); border-left: 4px solid var(--ios-blue); }
        .sku-edit-item .sku-title { font-weight: 600; font-size: 13px; margin-bottom: 10px; color: var(--text-primary); }
        .sku-edit-item .sku-inputs { display: flex; gap: 10px; flex-wrap: wrap; }
        .sku-edit-item .sku-inputs input { 
            flex: 1; min-width: 0; width: 50%; padding: 12px; font-size: 16px; 
            border: 1px solid rgba(0,0,0,0.1); border-radius: 10px; 
            box-sizing: border-box; outline: none; transition: all 0.2s; background: #fff;
        }
        .sku-edit-item .sku-inputs input:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }

        @media (max-width: 768px) {
            button:active { transform: scale(0.9) !important; opacity: 0.7 !important; transition: transform 0.1s, opacity 0.1s; }
        }
        button:disabled { cursor: not-allowed !important; transform: none !important; opacity: 0.6 !important; }
        .btn-loading { pointer-events: none; opacity: 0.8; }
        .btn-loading::after {
            content: ""; display: inline-block; width: 14px; height: 14px;
            margin-left: 6px; vertical-align: middle; border: 2px solid currentColor;
            border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (min-width: 768px) {
            body { padding: 32px; }
            .container { padding: 0; max-width: 1200px; }
            
            .top-header { margin-bottom: 20px; }
            .store-bar { max-width: none; margin: 0; } 
            .logout-btn button { padding: 14px 28px; font-size: 15px; }

            .entry-links { flex-direction: row; gap: 12px; margin-bottom: 20px; }
            .entry-links a { padding: 16px; font-size: 15px; }

            .top-bar button { width: auto; margin-bottom: 0; padding: 12px 24px; font-size: 14px; float: right; }
            
            .table-wrapper { 
                overflow-x: auto; 
                clear: both;
                border-radius: 22px; 
                border: 1px solid var(--glass-border);
                background: var(--glass-light);
                backdrop-filter: blur(30px) saturate(180%);
                -webkit-backdrop-filter: blur(30px) saturate(180%);
                box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 16px rgba(0,0,0,0.05);
            }
            table { display: table !important; width: 100%; border-collapse: collapse; }
            thead { display: table-header-group !important; background: rgba(255, 255, 255, 0.4); }
            thead tr { display: table-row !important; background: none !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; }
            thead tr::before { display: none; }
            thead th { display: table-cell !important; padding: 18px !important; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid rgba(60,60,67,0.08); white-space: nowrap; font-size: 13px; }
            
            tbody tr { 
                display: table-row !important; 
                background: transparent !important; 
                border: none !important; 
                box-shadow: none !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                border-radius: 0 !important; 
                border-bottom: 1px solid rgba(60,60,67,0.06) !important;
                overflow: visible;
            }
            tbody tr::before { display: none; }
            tbody tr:hover { background: rgba(255, 255, 255, 0.4) !important; }
            tbody td { 
                display: table-cell !important; 
                padding: 18px !important; 
                text-align: left; 
                border: none !important; 
                vertical-align: middle; 
                width: auto !important; 
                margin: 0 !important; 
                font-size: 14px; 
                color: var(--text-primary) !important; 
            }
            tbody td::before { display: none !important; }
            
            tbody td[data-label="标题"] { min-width: 200px; font-weight: 600; font-size: 15px; border-bottom: none !important; padding-bottom: 18px !important; margin-bottom: 0 !important; }
            tbody td[data-label="商品ID"] { font-size: 12px; color: var(--text-tertiary); font-family: monospace; }
            tbody td[data-label="价格"], tbody td[data-label="库存"] { white-space: nowrap; font-weight: 600; }
            tbody td[data-label="状态 / 操作"] { white-space: nowrap; border-top: none !important; margin-top: 0 !important; padding-top: 18px !important; }
            tbody td[data-label="状态 / 操作"] button { display: inline-block !important; width: auto !important; margin: 0 8px 0 0 !important; padding: 8px 18px !important; font-size: 13px !important; }

            tr.sku-row { display: table-row !important; background: rgba(255,255,255,0.4) !important; border-radius: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; border-left: none !important; backdrop-filter: none; }
            tr.sku-row td { display: table-cell !important; padding: 18px !important; font-size: 14px !important; width: auto !important; margin: 0 !important; border-bottom: 1px solid rgba(60,60,67,0.06) !important; }
            tr.sku-row td[data-label="SKU_ID"], tr.sku-row td[data-label="规格"] { font-weight: normal !important; font-size: 14px !important; color: var(--text-primary) !important; }
            tr.sku-row .input-box { width: 80px !important; padding: 8px !important; font-size: 14px !important; border-radius: 8px !important; flex: none; }
            tr.sku-row td[data-label="操作"] { justify-content: flex-start !important; width: auto !important; margin: 0 !important; padding: 18px !important; border-top: none !important; }
            tr.sku-row td[data-label="价格"]::before { content: "价:"; margin-right: 4px; font-size: 14px; }
            tr.sku-row td[data-label="库存"]::before { content: "库:"; margin-right: 4px; font-size: 14px; }
            tr.sku-row td[data-label="价格"]::after { content: " 元"; }
            tr.sku-row td[data-label="库存"]::after { content: " 件"; }

            .modal-overlay { align-items: center; }
            .modal-content { 
                border-radius: 28px; 
                width: 90%; max-width: 600px; 
                margin: auto; max-height: 85vh; 
                animation: fadeIn 0.2s; 
                padding: 28px;
            }
            @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
            .sku-edit-item .sku-inputs input { font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <div class="store-bar">
            <span class="store-label">当前店铺：</span>
            <span class="store-name" id="userNameDisplay">叶刘军</span>
        </div>
        <div class="logout-btn"><button onclick="location.reload()">🔄 刷新</button></div>
    </div>

    <div class="entry-links">
        <a href="orders.html" class="entry-order">📋 订单</a>
        <a href="shouhou.html" class="entry-after">🛠️ 售后</a>
        <a href="kami.html" class="entry-kami">🎫 卡密</a>
    </div>

    <div id="product-page">
        <div class="top-bar">
            <button onclick="loadProducts()">刷新商品列表</button>
        </div>
        <div id="productStatusMsg" class="status-msg">正在加载商品列表...</div>

        <div class="table-wrapper">
            <table id="productTable">
                <thead><tr><th>商品ID</th><th>标题</th><th>价格(元)</th><th>库存</th><th>状态 / 操作</th></tr></thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="editProductModal" class="modal-overlay">
    <div class="modal-content">
        <h2>✏️ 编辑商品信息</h2>
        <input type="hidden" id="editProductId">
        <div class="form-group">
            <label>商品标题 <span style="color: red;">*</span></label>
            <input type="text" id="editTitle" placeholder="请输入商品标题">
        </div>
        <div class="form-group">
            <label>商品价格 (元) <span style="color: red;">*</span></label>
            <input type="number" step="0.01" id="editPrice" placeholder="例如：99.90">
        </div>
        <div class="form-group">
            <label>商品总库存 <span style="color: red;">*</span></label>
            <input type="number" id="editStock" placeholder="请输入总库存数量">
        </div>
        <div class="form-group">
            <label>商品描述 <span style="color: red;">*</span></label>
            <textarea id="editContent" placeholder="请输入商品描述，支持换行..."></textarea>
        </div>

        <div id="editSkuContainer" class="sku-edit-section" style="display: none;">
            <h3>📦 多规格 SKU 列表（可单独修改价格和库存）</h3>
            <div id="skuListWrapper"></div>
        </div>

        <div class="modal-footer">
            <button style="background: var(--ios-gray);" onclick="closeEditProductModal()">取消</button>
            <button style="background: var(--ios-blue);" onclick="submitEditProduct()">保存修改</button>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://api.1113630283.online";
    let isRequesting = false;
    let isNavigating = false;

    // ================= 🛡️ 全局按钮强反馈 =================
    document.addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        const link = e.target.closest('.entry-links a, .back-btn');

        if (!btn && !link) return;

        if (link) {
            if (isNavigating) { e.stopImmediatePropagation(); e.preventDefault(); return; }
            isNavigating = true;
            link.style.pointerEvents = 'none';
            link.style.opacity = '0.5';
            link.style.transform = 'scale(0.9)';
            link.style.transition = 'all 0.1s ease'; 
            setTimeout(() => {
                isNavigating = false;
                link.style.pointerEvents = '';
                link.style.opacity = '';
                link.style.transform = '';
            }, 2000);
            return;
        }

        if (btn) {
            if (btn.disabled) return;
            if (isRequesting) {
                e.stopImmediatePropagation();
                e.preventDefault();
                const originalText = btn.innerText;
                btn.innerText = '处理中...';
                btn.style.opacity = '0.5';
                setTimeout(() => { btn.innerText = originalText; btn.style.opacity = '1'; }, 500);
                return;
            }
            btn.dataset.originalText = btn.innerText;
            btn.innerText = '等待中...';
            btn.disabled = true;
            btn.classList.add('btn-loading');
            setTimeout(() => {
                if (!isRequesting && btn.classList.contains('btn-loading')) { restoreButton(btn); }
            }, 500);
        }
    }, true);

    function restoreButton(btn) {
        if (btn.classList.contains('btn-loading')) {
            btn.disabled = false;
            btn.innerText = btn.dataset.originalText || '刷新';
            btn.classList.remove('btn-loading');
            delete btn.dataset.originalText;
        }
    }

    // ================= 表单状态与遮罩层点击 =================
    let editFormDirty = false;

    const editInputs = document.querySelectorAll('#editProductModal input:not([type="hidden"]), #editProductModal textarea');
    editInputs.forEach(el => {
        el.addEventListener('input', () => editFormDirty = true);
        el.addEventListener('change', () => editFormDirty = true);
    });

    document.getElementById('editProductModal').addEventListener('mousedown', function(e) {
        if (e.target === this) {
            if (editFormDirty) {
                alert('您有未保存的内容，请点击取消或保存修改后再关闭。');
            } else {
                closeEditProductModal();
            }
        }
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.sku-row') && !e.target.closest('button[onclick^="toggleSkuList"]')) {
            const expandedRows = document.querySelectorAll('.sku-row');
            if (expandedRows.length > 0) {
                expandedRows.forEach(row => row.remove());
                document.querySelectorAll('#productTableBody button[data-expanded="true"]').forEach(btn => {
                    btn.innerText = '展开规格';
                    btn.setAttribute('data-expanded', 'false');
                });
            }
        }
    });

    // ================= 商品逻辑 =================
    const productTableBody = document.getElementById('productTableBody');
    const productStatusMsg = document.getElementById('productStatusMsg');
    const userNameDisplay = document.getElementById('userNameDisplay');
    let currentProductData = []; 

    async function loadProducts() {
        productStatusMsg.innerText = "正在加载商品列表...";
        productTableBody.innerHTML = "";
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/list", body: { page: 1, page_size: 10 } }) });
            const result = await response.json();
            if (result.code === 0) {
                productStatusMsg.innerText = "加载成功！";
                
                currentProductData = result.data.list || []; 

                currentProductData.sort((a, b) => {
                    const aWeight = (a.product_status === 22) ? 0 : 1;
                    const bWeight = (b.product_status === 22) ? 0 : 1;
                    return aWeight - bWeight; 
                });

                currentProductData.forEach(product => {
                    const priceYuan = product.price ? (product.price / 100).toFixed(2) : '-';
                    const stock = product.stock !== undefined ? product.stock : '-';
                    
                    let statusActionBtn = '';
                    if (product.product_status === 22) {
                        statusActionBtn = `<button class="status-btn status-btn-on" onclick="downShelfProduct(${product.product_id}, this)" title="点击下架">✅ 已上架</button>`;
                    } else if (product.product_status === 31) {
                        statusActionBtn = `<button class="status-btn status-btn-off" onclick="publishProduct(${product.product_id}, this)" title="点击重新上架">⛔ 已下架</button>`;
                    } else if (product.product_status === 23) {
                        statusActionBtn = `<button class="status-btn status-btn-sold" onclick="publishProduct(${product.product_id}, this)" title="点击重新上架">🏷️ 已售出</button>`;
                    } else {
                        statusActionBtn = `<button class="status-btn status-btn-unknown" onclick="publishProduct(${product.product_id}, this)" title="点击上架">❓ 未知(${product.product_status || '无'})</button>`;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td data-label="商品ID">${product.product_id}</td>
                        <td data-label="标题"><b>${product.title || '无标题'}</b></td>
                        <td data-label="价格">${priceYuan} 元</td>
                        <td data-label="库存">${stock}</td>
                        <td data-label="状态 / 操作" style="justify-content: flex-start; gap: 8px;">
                            ${statusActionBtn}
                            <button class="btn-edit" onclick="openEditProductModal(${product.product_id})" style="padding:10px 16px; font-size:13px; width:auto; border-radius:100px;">编辑</button>
                            <button onclick="toggleSkuList(event, ${product.product_id}, this)" data-expanded="false" style="padding:10px 16px; font-size:13px; width:auto; border-radius:100px;">展开规格</button>
                        </td>
                    `;
                    productTableBody.appendChild(tr);
                });
            } else { productStatusMsg.innerText = "加载失败：" + result.msg; }
        } catch (error) { productStatusMsg.innerText = "请求出错：" + error.message; }
    }

    async function openEditProductModal(productId) {
        const userName = userNameDisplay.textContent.trim();
        if (!userName) return alert("找不到当前店铺名称，请刷新页面！");

        const product = currentProductData.find(p => p.product_id === productId);
        document.getElementById('editProductId').value = productId;
        document.getElementById('editTitle').value = product ? (product.title || '') : '';
        document.getElementById('editPrice').value = product && product.price ? (product.price / 100).toFixed(2) : '';
        document.getElementById('editStock').value = product && product.stock !== undefined ? product.stock : '';
        document.getElementById('editContent').value = ''; 

        document.getElementById('editSkuContainer').style.display = 'none';
        document.getElementById('skuListWrapper').innerHTML = '正在加载规格信息...';
        
        editFormDirty = false;
        document.getElementById('editProductModal').style.display = 'flex';

        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } }) });
            const result = await response.json();
            if (result.code === 0 && result.data) {
                let content = result.data.content; 
                if (!content && result.data.publish_shop && result.data.publish_shop.length > 0) {
                    content = result.data.publish_shop[0].content; 
                }
                if (content) document.getElementById('editContent').value = content;

                if (result.data.sku_items && result.data.sku_items.length > 0) {
                    document.getElementById('editSkuContainer').style.display = 'block';
                    let skuHtml = '';
                    result.data.sku_items.forEach(sku => {
                        const priceYuan = (sku.price / 100).toFixed(2);
                        skuHtml += `
                            <div class="sku-edit-item" data-sku-text="${sku.sku_text}">
                                <div class="sku-title">🏷️ ${sku.sku_text}</div>
                                <div class="sku-inputs">
                                    <input type="number" step="0.01" class="sku-price-input" data-sku-id="${sku.sku_id}" value="${priceYuan}" placeholder="价格(元)">
                                    <input type="number" class="sku-stock-input" data-sku-id="${sku.sku_id}" value="${sku.stock}" placeholder="库存">
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('skuListWrapper').innerHTML = skuHtml;
                } else {
                    document.getElementById('editSkuContainer').style.display = 'none';
                }
            }
        } catch (error) {
            console.log("获取商品详情失败：", error);
            document.getElementById('skuListWrapper').innerHTML = '<span style="color:red;">加载规格失败</span>';
        }
    }

    function closeEditProductModal() {
        document.getElementById('editProductModal').style.display = 'none';
        editFormDirty = false;
    }

    async function submitEditProduct() {
        const productId = parseInt(document.getElementById('editProductId').value);
        const title = document.getElementById('editTitle').value.trim();
        const priceYuan = document.getElementById('editPrice').value;
        const stock = parseInt(document.getElementById('editStock').value);
        const content = document.getElementById('editContent').value.trim();
        const userName = userNameDisplay.textContent.trim(); 

        if (!title || !priceYuan || isNaN(stock) || !content) {
            return alert("请完整填写所有必填项！");
        }
        if (!userName) return alert("找不到当前店铺名称，请刷新页面！");

        const priceFen = Math.round(parseFloat(priceYuan) * 100); 

        const skuItems = [];
        const skuContainer = document.getElementById('skuListWrapper');
        if (document.getElementById('editSkuContainer').style.display !== 'none') {
            const skuItemsDom = skuContainer.querySelectorAll('.sku-edit-item');
            skuItemsDom.forEach(item => {
                const skuText = item.getAttribute('data-sku-text');
                const skuPrice = Math.round(parseFloat(item.querySelector('.sku-price-input').value) * 100);
                const skuStock = parseInt(item.querySelector('.sku-stock-input').value);
                skuItems.push({ sku_text: skuText, price: skuPrice, stock: skuStock });
            });
        }

        const requestBody = {
            product_id: productId,
            price: priceFen,
            stock: stock,
            publish_shop: [{ user_name: userName, title: title, content: content }]
        };
        if (skuItems.length > 0) requestBody.sku_items = skuItems;

        try {
            const response = await fetch(WORKER_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path: "/api/open/product/edit", body: requestBody }) 
            });
            const result = await response.json();
            
            if (result.code === 0) {
                alert("商品和 SKU 修改成功！");
                closeEditProductModal();
                loadProducts(); 
            } else {
                alert("修改失败：" + result.msg);
            }
        } catch (error) {
            alert("请求出错：" + error.message);
        }
    }

    // ================= 🚀 重点优化：SKU 展开逻辑（彻底解决卡死与速度慢） =================
    async function toggleSkuList(event, productId, btn) {
        // 阻止事件冒泡，防止全局按钮拦截器覆盖我们的状态
        if (event) event.stopPropagation();

        // 1. 强制重置按钮状态，移除一切可能的残留状态（解决卡死问题）
        btn.classList.remove('btn-loading');
        btn.disabled = false;

        const mainRow = btn.closest('tr');
        const isExpanded = btn.getAttribute('data-expanded') === 'true';

        // 2. 无论什么情况，先把当前行下方所有已存在的 SKU 行移除，确保状态干净
        let nextRow = mainRow.nextElementSibling;
        while (nextRow && nextRow.classList.contains('sku-row')) {
            let rowToDelete = nextRow;
            nextRow = nextRow.nextElementSibling;
            rowToDelete.remove();
        }

        // 3. 将按钮强制恢复为“展开规格”状态
        btn.innerText = "展开规格";
        btn.setAttribute('data-expanded', 'false');

        // 4. 如果是“收起”操作，到这里逻辑已经完成了（行已移除，文字已重置），直接结束
        if (isExpanded) {
            return;
        }

        // 5. 以下是“展开”逻辑
        btn.innerText = "加载中...";
        btn.disabled = true;
        btn.classList.add('btn-loading');

        // 清理其他已展开的行（保持界面整洁，同时只展开一个）
        document.querySelectorAll('#productTableBody button[data-expanded="true"]').forEach(otherBtn => {
            if (otherBtn !== btn) {
                otherBtn.innerText = "展开规格";
                otherBtn.setAttribute('data-expanded', 'false');
            }
        });
        document.querySelectorAll('.sku-row').forEach(row => row.remove());

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } })
            });
            const result = await response.json();

            if (result.code === 0 && result.data.sku_items) {
                // ⚡ 核心优化：使用 DocumentFragment 批量构建 DOM，极大提升渲染速度
                const fragment = document.createDocumentFragment();
                
                result.data.sku_items.forEach(sku => {
                    const skuTr = document.createElement('tr');
                    skuTr.className = 'sku-row';
                    const priceInYuan = (sku.price / 100).toFixed(2);
                    skuTr.innerHTML = `
                        <td data-label="SKU_ID">└─ ${sku.sku_id}</td>
                        <td data-label="规格" data-sku-text="${sku.sku_text}">${sku.sku_text}</td>
                        <td data-label="价格"><input type="number" step="0.01" class="input-box" id="price_${sku.sku_id}" value="${priceInYuan}"></td>
                        <td data-label="库存"><input type="number" class="input-box" id="stock_${sku.sku_id}" value="${sku.stock}"></td>
                        <td data-label="操作"><button class="btn-save" onclick="updateSkuData(${productId}, ${sku.sku_id})">保存</button></td>
                    `;
                    fragment.appendChild(skuTr);
                });

                // 检查是否真的生成了节点
                if (fragment.hasChildNodes()) {
                    mainRow.parentNode.insertBefore(fragment, mainRow.nextSibling);
                    btn.innerText = "收起规格";
                    btn.disabled = false;
                    btn.classList.remove('btn-loading');
                    btn.setAttribute('data-expanded', 'true');
                } else {
                    alert("该商品暂无规格数据");
                    btn.innerText = "展开规格";
                    btn.disabled = false;
                    btn.classList.remove('btn-loading');
                }
            } else {
                alert("获取规格失败：" + (result.msg || "未知错误"));
                btn.innerText = "展开规格";
                btn.disabled = false;
                btn.classList.remove('btn-loading');
            }
        } catch (error) {
            alert("网络错误：" + error.message);
            btn.innerText = "展开规格";
            btn.disabled = false;
            btn.classList.remove('btn-loading');
        }
    }

    async function updateSkuData(productId, skuId) {
        const stockInput = document.getElementById(`stock_${skuId}`);
        const priceInput = document.getElementById(`price_${skuId}`);
        const newStockStr = stockInput.value;
        const newPriceYuanStr = priceInput.value;
        if (newStockStr === '' || newPriceYuanStr === '') return alert("请输入价格和库存");
        
        const newPriceFen = Math.round(parseFloat(newPriceYuanStr) * 100);
        const newStock = parseInt(newStockStr);

        const saveBtn = stockInput.closest('tr').querySelector('.btn-save');
        if(saveBtn) { saveBtn.disabled = true; saveBtn.innerText = "保存中..."; }

        try {
            const detailResponse = await fetch(WORKER_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } }) 
            });
            const detailResult = await detailResponse.json();
            
            if (detailResult.code !== 0 || !detailResult.data.sku_items) {
                throw new Error("获取原规格失败，无法保存");
            }

            const updatedSkuItems = detailResult.data.sku_items.map(sku => {
                if (sku.sku_id === skuId) {
                    return { ...sku, price: newPriceFen, stock: newStock };
                }
                return sku;
            });

            const requestBody = {
                product_id: productId,
                sku_items: updatedSkuItems.map(sku => ({
                    sku_text: sku.sku_text,
                    price: sku.price,
                    stock: sku.stock
                }))
            };

            const response = await fetch(WORKER_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path: "/api/open/product/edit", body: requestBody }) 
            });
            const result = await response.json();
            
            if (result.code === 0) { alert("SKU 修改成功！"); } else { alert("修改失败：" + result.msg); }
        } catch (error) {
            alert("请求出错：" + error.message);
        } finally {
            if(saveBtn) { saveBtn.disabled = false; saveBtn.innerText = "保存"; }
        }
    }

    async function publishProduct(productId, btn) {
        const userName = userNameDisplay.textContent.trim();
        if (!userName) return alert("找不到当前店铺名称，请刷新页面！");
        if (!confirm(`确定将商品 ${productId} 上架？`)) return;
        btn.innerText = "上架中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/publish", body: { product_id: parseInt(productId), user_name: [userName] } }) });
            const result = await response.json();
            if (result.code === 0) { alert("上架指令发送成功！稍后刷新查看"); loadProducts(); } else { alert("上架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { btn.innerText = "上架"; btn.disabled = false; }
    }

    async function downShelfProduct(productId, btn) {
        if (!confirm(`确定将商品 ${productId} 下架？`)) return;
        btn.innerText = "下架中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/downShelf", body: { product_id: parseInt(productId) } }) });
            const result = await response.json();
            if (result.code === 0) { alert("下架指令发送成功！稍后刷新查看"); loadProducts(); } else { alert("下架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { btn.innerText = "下架"; btn.disabled = false; }
    }

    loadProducts();
</script>
</body>
</html>
