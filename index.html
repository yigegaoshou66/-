<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闲管家手机助手</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f9f9f9; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #0070f3; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:active { background: #005bb5; }
        .result { margin-top: 16px; padding: 12px; background: #fff; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>闲管家 · 手机助手</h2>
    
    <label>接口路径</label>
    <input id="path" value="/api/open/product/stock/update" placeholder="/api/open/...">
    
    <label>请求体（JSON）</label>
    <textarea id="body" rows="6" placeholder='{"product_id":"...","stock":10}'></textarea>
    
    <button onclick="send()">发送请求</button>
    <div class="result" id="result"></div>

    <script>
        // ⚠️ 把这里替换成你刚才部署出来的真实地址
        const WORKER_URL = 'https://xian-guanjia-worker.1113630283.workers.dev'; 

        async function send() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = '请求中...';
            try {
                const bodyText = document.getElementById('body').value;
                const body = bodyText ? JSON.parse(bodyText) : {};
                const resp = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        path: document.getElementById('path').value, 
                        body: body 
                    }),
                });
                const data = await resp.json();
                resultEl.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                resultEl.textContent = '错误: ' + e.message;
            }
        }
    </script>
</body>
</html>
