<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 综合管理助手</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 12px; 
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            background-attachment: fixed;
            margin: 0; color: #1c1c1e;
        }
        .container { 
            max-width: 1200px; margin: 0 auto; background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 20px; 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); padding: 15px;
        }
        h1 { color: #1c1c1e; text-align: center; margin-bottom: 15px; font-size: 20px; font-weight: 800; }

        /* 入口按钮 */
        .entry-links { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .entry-links a { 
            text-align: center; text-decoration: none; padding: 14px; border-radius: 14px; 
            color: #fff; font-weight: bold; font-size: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .entry-order { background: linear-gradient(135deg, #17a2b8, #0f6674); }
        .entry-kami { background: linear-gradient(135deg, #6f42c1, #462688); }

        /* 顶部 Tab */
        .nav-tabs { display: flex; background: rgba(255, 255, 255, 0.5); padding: 5px; border-radius: 14px; margin-bottom: 15px; }
        .nav-tabs button { flex: 1; background: none; border: none; color: #555; font-size: 14px; font-weight: bold; padding: 10px; border-radius: 10px; }
        .nav-tabs button.active { color: #007bff; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        .top-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; background: rgba(255, 255, 255, 0.4); padding: 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.6); }
        .top-bar label { font-weight: bold; color: #333; font-size: 13px; }
        .top-bar input, .top-bar select { padding: 10px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.9); border-radius: 10px; font-size: 16px; outline: none; width: 100%; }
        
        button { 
            padding: 12px 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; 
            background: #007bff; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2); transition: 0.2s; width: 100%; margin-bottom: 10px;
        }
        button:active { transform: scale(0.98); }
        .btn-publish { background: #17a2b8; }
        .btn-down { background: #dc3545; }
        .btn-save { background: #28a745; padding: 8px 12px; font-size: 12px; width: auto; margin-bottom: 0; }
        
        /* 表格卡片化布局 */
        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        tr { display: block; background: rgba(255, 255, 255, 0.8); border-radius: 16px; margin-bottom: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.9); }
        td { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px dashed rgba(0,0,0,0.05); font-size: 13px; text-align: right; color: #1c1c1e; }
        td:last-child { border-bottom: none; padding-bottom: 0; }
        td::before { content: attr(data-label); font-weight: bold; color: #666; text-align: left; margin-right: 10px; flex-shrink: 0; }
        
        .input-box { width: 80px; padding: 6px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 14px; text-align: center; }
        .status-msg { margin-top: 10px; color: #333; font-weight: bold; font-size: 13px; }
        
        /* 状态标签 */
        .badge-on { background: #28a745; color: white; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-off { background: #dc3545; color: white; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-sold { background: #6c757d; color: white; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-unknown { background: #ffc107; color: #333; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        
        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .status-11 { background: #fff3cd; color: #856404; }
        .status-12 { background: #cce5ff; color: #004085; }
        .status-21 { background: #d4edda; color: #155724; }
        .status-22 { background: #d1ecf1; color: #0c5460; }
        .status-23, .status-24 { background: #f8d7da; color: #721c24; }

        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .page-btn { background: #6c757d; padding: 8px 12px; font-size: 12px; width: auto; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>闲管家 · 综合管理助手</h1>

    <div class="entry-links">
        <a href="orders.html" class="entry-order">📋 独立订单页</a>
        <a href="kami.html" class="entry-kami">🎫 卡密管理页</a>
    </div>

    <div class="nav-tabs">
        <button id="tab-product" class="active" onclick="switchTab('product')">📦 商品管理</button>
        <button id="tab-order" onclick="switchTab('order')">📋 订单管理</button>
    </div>

    <!-- 商品管理 -->
    <div id="product-page">
        <div class="top-bar">
            <label>🏪 闲鱼会员名：</label>
            <input type="text" id="userNameInput" value="一个游戏高手" placeholder="请输入闲鱼会员名">
        </div>
        <button onclick="loadProducts()">刷新商品列表</button>
        <div id="productStatusMsg" class="status-msg">正在加载商品列表...</div>

        <div class="table-wrapper">
            <table id="productTable">
                <thead><tr><th>商品ID</th><th>标题</th><th>状态</th><th>价格(元)</th><th>库存</th><th>操作</th></tr></thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 订单管理 -->
    <div id="order-page" style="display: none;">
        <div class="top-bar">
            <label>📦 订单状态：</label>
            <select id="orderStatusFilter">
                <option value="">全部订单</option><option value="11">待付款</option><option value="12">待发货</option><option value="21">已发货</option><option value="22">已完成</option><option value="23">已退款</option><option value="24">已关闭</option>
            </select>
            <button onclick="loadOrders(1)">刷新订单</button>
        </div>
        <div id="orderStatusMsg" class="status-msg">正在加载订单列表...</div>
        <div class="table-wrapper">
            <table id="orderTable">
                <thead><tr><th>订单号</th><th>买家</th><th>商品/规格</th><th>金额(元)</th><th>状态</th><th>下单时间</th><th>操作</th></tr></thead>
                <tbody id="orderTableBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <span id="orderPageInfo" style="font-size: 12px; color:#333;"></span>
            <div>
                <button class="page-btn" id="orderPrevBtn" onclick="changeOrderPage(-1)">上一页</button>
                <button class="page-btn" id="orderNextBtn" onclick="changeOrderPage(1)">下一页</button>
            </div>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://xian-guanjia-worker.1113630283.workers.dev";
    const productTableBody = document.getElementById('productTableBody');
    const productStatusMsg = document.getElementById('productStatusMsg');
    const userNameInput = document.getElementById('userNameInput');
    const orderTableBody = document.getElementById('orderTableBody');
    const orderStatusMsg = document.getElementById('orderStatusMsg');
    const orderStatusFilter = document.getElementById('orderStatusFilter');
    const orderPageInfo = document.getElementById('orderPageInfo');
    const orderPrevBtn = document.getElementById('orderPrevBtn');
    const orderNextBtn = document.getElementById('orderNextBtn');
    let currentOrderPage = 1;
    const orderPageSize = 20;
    const orderStatusMap = { 11: "待付款", 12: "待发货", 21: "已发货", 22: "已完成", 23: "已退款", 24: "已关闭" };

    function switchTab(tabName) {
        document.getElementById('tab-product').classList.remove('active');
        document.getElementById('tab-order').classList.remove('active');
        document.getElementById('product-page').style.display = 'none';
        document.getElementById('order-page').style.display = 'none';
        if (tabName === 'product') { document.getElementById('tab-product').classList.add('active'); document.getElementById('product-page').style.display = 'block'; }
        else { document.getElementById('tab-order').classList.add('active'); document.getElementById('order-page').style.display = 'block'; loadOrders(1); }
    }

    async function loadProducts() {
        productStatusMsg.innerText = "正在加载商品列表...";
        productTableBody.innerHTML = "";
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/list", body: { page: 1, page_size: 10 } }) });
            const result = await response.json();
            if (result.code === 0) {
                productStatusMsg.innerText = "加载成功！点击【展开规格】修改价格和库存。";
                
                // 🟢 新增排序逻辑：将已上架（product_status === 22）的商品置顶
                result.data.list.sort((a, b) => {
                    const aWeight = (a.product_status === 22) ? 0 : 1;
                    const bWeight = (b.product_status === 22) ? 0 : 1;
                    return aWeight - bWeight; // 权重越小越靠前，已上架=0排在最前，其他=1排在后面
                });

                result.data.list.forEach(product => {
                    let statusBadge = `<span class="badge-unknown">未知(${product.product_status || '无'})</span>`;
                    if (product.product_status === 22) statusBadge = `<span class="badge-on">✅ 已上架</span>`;
                    else if (product.product_status === 31) statusBadge = `<span class="badge-off">⛔ 已下架</span>`;
                    else if (product.product_status === 23) statusBadge = `<span class="badge-sold">🏷️ 已售出</span>`;
                    const priceYuan = product.price ? (product.price / 100).toFixed(2) : '-';
                    const stock = product.stock !== undefined ? product.stock : '-';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td data-label="商品ID">${product.product_id}</td>
                        <td data-label="标题"><b>${product.title || '无标题'}</b></td>
                        <td data-label="状态">${statusBadge}</td>
                        <td data-label="价格">${priceYuan} 元</td>
                        <td data-label="库存">${stock}</td>
                        <td data-label="操作" style="justify-content: flex-start; gap: 5px;">
                            <button onclick="toggleSkuList(${product.product_id}, this)" data-expanded="false" style="padding:6px 10px; font-size:12px; width:auto;">展开规格</button>
                            <button class="btn-publish" onclick="publishProduct(${product.product_id}, this)" style="padding:6px 10px; font-size:12px; width:auto;">上架</button>
                            <button class="btn-down" onclick="downShelfProduct(${product.product_id}, this)" style="padding:6px 10px; font-size:12px; width:auto;">下架</button>
                        </td>
                    `;
                    productTableBody.appendChild(tr);
                });
            } else { productStatusMsg.innerText = "加载失败：" + result.msg; }
        } catch (error) { productStatusMsg.innerText = "请求出错：" + error.message; }
    }

    async function toggleSkuList(productId, btn) {
        const mainRow = btn.closest('tr');
        if (btn.dataset.expanded === 'true') {
            let nextRow = mainRow.nextElementSibling;
            while (nextRow && nextRow.classList.contains('sku-row')) { let rowToDelete = nextRow; nextRow = nextRow.nextElementSibling; rowToDelete.remove(); }
            btn.innerText = "展开规格"; btn.dataset.expanded = "false"; return; 
        }
        document.querySelectorAll('.sku-row').forEach(row => row.remove());
        document.querySelectorAll('#productTableBody button').forEach(otherBtn => {
            if (otherBtn.dataset.expanded === 'true') { otherBtn.innerText = "展开规格"; otherBtn.dataset.expanded = "false"; }
        });
        btn.innerText = "加载中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } }) });
            const result = await response.json();
            if (result.code === 0 && result.data.sku_items) {
                let lastInsertedRow = mainRow; 
                result.data.sku_items.forEach(sku => {
                    const skuTr = document.createElement('tr');
                    skuTr.className = 'sku-row';
                    const priceInYuan = (sku.price / 100).toFixed(2); 
                    skuTr.innerHTML = `
                        <td data-label="SKU_ID">└─ ${sku.sku_id}</td>
                        <td data-label="规格">${sku.sku_text}</td>
                        <td data-label="价格"><input type="number" step="0.01" class="input-box" id="price_${sku.sku_id}" value="${priceInYuan}"> 元</td>
                        <td data-label="库存"><input type="number" class="input-box" id="stock_${sku.sku_id}" value="${sku.stock}"> 件</td>
                        <td data-label="操作"><button class="btn-save" onclick="updateSkuData(${productId}, ${sku.sku_id})">保存</button></td>
                    `;
                    lastInsertedRow.parentNode.insertBefore(skuTr, lastInsertedRow.nextSibling);
                    lastInsertedRow = skuTr; 
                });
                btn.innerText = "收起规格"; btn.disabled = false; btn.dataset.expanded = "true"; 
            } else { alert("获取规格失败：" + (result.msg || "未知错误")); btn.innerText = "重试"; btn.disabled = false; }
        } catch (error) { alert("网络错误：" + error.message); btn.innerText = "重试"; btn.disabled = false; }
    }

    async function updateSkuData(productId, skuId) {
        const newStockStr = document.getElementById(`stock_${skuId}`).value;
        const newPriceYuanStr = document.getElementById(`price_${skuId}`).value;
        if (newStockStr === '' || newPriceYuanStr === '') return alert("请输入价格和库存");
        const newPriceFen = Math.round(parseFloat(newPriceYuanStr) * 100);
        const newStock = parseInt(newStockStr);
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/edit/stock", body: { product_id: productId, sku_items: [ { sku_id: skuId, stock: newStock, price: newPriceFen } ] } }) });
            const result = await response.json();
            if (result.code === 0) alert("修改成功！"); else alert("修改失败：" + result.msg);
        } catch (error) { alert("请求出错：" + error.message); }
    }

    async function publishProduct(productId, btn) {
        const userName = userNameInput.value.trim();
        if (!userName) return alert("请先填写闲鱼会员名！");
        if (!confirm(`确定将商品 ${productId} 上架？`)) return;
        btn.innerText = "上架中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/publish", body: { product_id: parseInt(productId), user_name: [userName] } }) });
            const result = await response.json();
            if (result.code === 0) { alert("上架指令发送成功！稍后刷新查看"); loadProducts(); } else { alert("上架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { btn.innerText = "上架"; btn.disabled = false; }
    }

    async function downShelfProduct(productId, btn) {
        if (!confirm(`确定将商品 ${productId} 下架？`)) return;
        btn.innerText = "下架中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/downShelf", body: { product_id: parseInt(productId) } }) });
            const result = await response.json();
            if (result.code === 0) { alert("下架指令发送成功！稍后刷新查看"); loadProducts(); } else { alert("下架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { btn.innerText = "下架"; btn.disabled = false; }
    }

    async function loadOrders(pageNo = 1) {
        currentOrderPage = pageNo;
        orderStatusMsg.innerText = "正在加载订单列表...";
        orderTableBody.innerHTML = "";
        orderPageInfo.innerText = `第 ${currentOrderPage} 页`;
        const bodyParams = { page_no: currentOrderPage, page_size: orderPageSize };
        if (orderStatusFilter.value) bodyParams.order_status = parseInt(orderStatusFilter.value);
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/order/list", body: bodyParams }) });
            const result = await response.json();
            if (result.code === 0) {
                const orders = result.data.list || [];
                if (orders.length === 0) orderStatusMsg.innerText = "暂无订单。";
                else {
                    orderStatusMsg.innerText = `成功加载 ${orders.length} 条订单。`;
                    orders.forEach(order => {
                        const goods = order.goods || {};
                        const priceInYuan = (order.total_amount / 100).toFixed(2); 
                        const statusText = orderStatusMap[order.order_status] || `未知`;
                        const timeStr = order.create_time ? new Date(order.create_time * 1000).toLocaleString('zh-CN') : '未知时间';
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td data-label="订单号">${order.order_no}</td>
                            <td data-label="买家">${order.buyer_nick}</td>
                            <td data-label="商品">${goods.title || '未知'}<br><small style="color:#666;">${goods.sku_text || ''}</small></td>
                            <td data-label="金额"><b>${priceInYuan} 元</b></td>
                            <td data-label="状态"><span class="status-badge status-${order.order_status}">${statusText}</span></td>
                            <td data-label="下单时间">${timeStr}</td>
                            <td data-label="操作" style="justify-content: flex-start;">
                                <button class="btn-edit" style="background: #ffc107; color:#333; padding:6px 10px; font-size:12px; width:auto;" onclick="alert('改价开发中')">改价</button>
                            </td>
                        `;
                        orderTableBody.appendChild(tr);
                    });
                }
                orderPrevBtn.disabled = (currentOrderPage <= 1);
                orderNextBtn.disabled = (orders.length < orderPageSize); 
            } else { orderStatusMsg.innerText = "加载失败：" + result.msg; }
        } catch (error) { orderStatusMsg.innerText = "请求出错：" + error.message; }
    }

    function changeOrderPage(delta) {
        const newPage = currentOrderPage + delta;
        if (newPage < 1) return;
        loadOrders(newPage);
    }
    orderStatusFilter.addEventListener('change', () => { loadOrders(1); });
    loadProducts();
</script>
</body>
</html>
