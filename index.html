<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 综合管理助手</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 8px; 
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            background-attachment: fixed;
            margin: 0; color: #1c1c1e;
        }

        /* ================= 🔒 密码验证层 ================= */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 24px; padding: 30px 20px;
            width: 85%; max-width: 350px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .login-box h2 { margin-top: 0; color: #1c1c1e; font-size: 22px; margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 14px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px;
            font-size: 16px; outline: none; text-align: center; letter-spacing: 2px; margin-bottom: 15px;
            background: #fff;
        }
        .login-box button {
            width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; margin-bottom: 10px;
            background: #007bff; color: white; border: none; font-weight: bold;
        }
        .login-box .error-msg { color: #dc3545; font-size: 13px; margin: 0; font-weight: bold; }

        /* ================= 主界面容器 ================= */
        .container { 
            max-width: 1200px; margin: 0 auto; background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 16px; 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); padding: 10px;
            display: none; 
        }
        h1 { color: #1c1c1e; text-align: center; margin-bottom: 12px; font-size: 18px; font-weight: 800; }

        .logout-btn { text-align: right; margin-bottom: 5px; }
        .logout-btn button { width: auto; padding: 6px 12px; font-size: 12px; background: #6c757d; margin-bottom: 0; }

        .entry-links { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .entry-links a { 
            text-align: center; text-decoration: none; padding: 12px; border-radius: 12px; 
            color: #fff; font-weight: bold; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .entry-order { background: linear-gradient(135deg, #17a2b8, #0f6674); }
        .entry-kami { background: linear-gradient(135deg, #6f42c1, #462688); }

        .top-bar { display: flex; flex-direction: row; align-items: center; gap: 8px; margin-bottom: 10px; background: rgba(255, 255, 255, 0.5); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.6); }
        .top-bar label { display: none; }
        .top-bar input { padding: 8px 12px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.9); border-radius: 8px; font-size: 16px; outline: none; width: 100%; }
        
        button { 
            padding: 10px 14px; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; 
            background: #007bff; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2); transition: 0.2s; width: 100%; margin-bottom: 8px;
        }
        button:active { transform: scale(0.98); }
        .btn-publish { background: #17a2b8; }
        .btn-down { background: #dc3545; }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-save { background: #28a745; padding: 6px 10px; font-size: 12px; width: auto; margin-bottom: 0; }
        
        /* ================= 📱 手机端卡片化布局 ================= */
        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        
        tr { 
            display: flex; flex-wrap: wrap; 
            background: #fff; border-radius: 12px; 
            margin-bottom: 8px; padding: 12px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); 
        }
        
        td { 
            display: flex; align-items: center; 
            padding: 2px 0; border: none; 
            font-size: 12px; text-align: left; color: #1c1c1e; 
            flex: 0 0 auto; margin-right: 12px; 
        }
        td::before { content: attr(data-label); font-weight: normal; color: #888; margin-right: 4px; flex-shrink: 0; }
        
        td[data-label="标题"], td[data-label="商品ID"], td[data-label="操作"] { 
            flex: 0 0 100%; width: 100%; margin-right: 0;
        }
        
        td[data-label="标题"] { font-size: 14px; font-weight: bold; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid #f0f0f0; }
        td[data-label="标题"]::before { display: none; }
        td[data-label="商品ID"] { font-size: 10px; color: #aaa; padding-bottom: 2px; }
        td[data-label="商品ID"]::before { font-size: 10px; }
        
        td[data-label="价格"]::before { content: "价:"; }
        td[data-label="库存"]::before { content: "存:"; }
        td[data-label="状态"]::before { display: none; }
        
        td[data-label="操作"] { 
            margin-top: 8px; padding-top: 8px; 
            border-top: 1px dashed #e5e5e5; 
            justify-content: flex-start; gap: 6px; flex-wrap: wrap;
        }
        td[data-label="操作"]::before { display: none; }
        td[data-label="操作"] button { padding: 6px 10px; font-size: 12px; margin: 0; box-shadow: none; border-radius: 6px; width: auto; }
        
        /* SKU 展开行 */
        tr.sku-row {
            display: flex; flex-wrap: wrap;
            background: #f8f9fa; border-radius: 8px;
            margin-top: -4px; margin-bottom: 8px;
            margin-left: 10px; 
            padding: 8px 10px;
            box-shadow: none;
            border: 1px solid #e9ecef; border-left: 3px solid #007bff;
        }
        tr.sku-row td { font-size: 12px; padding: 2px 0; margin-right: 8px; }
        tr.sku-row td::before { width: auto; margin-right: 4px; }
        
        tr.sku-row td[data-label="SKU_ID"] { font-size: 10px; color: #999; width: 100%; margin-bottom: 2px; }
        tr.sku-row td[data-label="SKU_ID"]::before { display: none; }
        tr.sku-row td[data-label="规格"] { font-weight: bold; width: 100%; margin-bottom: 4px; }
        tr.sku-row td[data-label="规格"]::before { display: none; }
        
        tr.sku-row td[data-label="价格"], tr.sku-row td[data-label="库存"] { margin-right: 8px; }
        tr.sku-row .input-box { width: 55px; padding: 4px; font-size: 12px; text-align: center; margin: 0 2px; border: 1px solid #ccc; border-radius: 4px; }
        
        tr.sku-row td[data-label="操作"] { width: 100%; margin-top: 4px; padding-top: 4px; border-top: none; justify-content: flex-end; }
        
        /* 状态标签 */
        .badge-on { background: #28a745; color: white; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-off { background: #dc3545; color: white; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-sold { background: #6c757d; color: white; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-unknown { background: #ffc107; color: #333; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }

        .status-msg { margin-top: 8px; color: #333; font-weight: bold; font-size: 12px; }

        /* ================= 📝 手机端弹窗样式优化 ================= */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); justify-content: center; align-items: flex-end; z-index: 1000; }
        
        .modal-content { 
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(30px); 
            border-radius: 20px 20px 0 0; 
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom)) 15px; /* 底部安全区适配 */
            width: 100%; max-height: 90vh; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* iOS 滑动更顺滑 */
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); animation: slideUp 0.3s ease-out; 
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-content h2 { margin-top: 0; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px; font-size: 18px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #333; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 10px; border: 1px solid rgba(0,0,0,0.1); 
            background: rgba(255,255,255,0.8); border-radius: 10px; 
            font-size: 16px; /* 16px 防止 iOS 键盘弹起时自动放大页面 */
            outline: none; box-sizing: border-box; 
        }
        .form-group textarea { height: 100px; resize: vertical; }
        
        .modal-footer { text-align: right; margin-top: 15px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }
        .modal-footer button { width: auto; padding: 10px 20px; margin-bottom: 0; font-size: 14px; }

        /* SKU 编辑区手机端优化 */
        .sku-edit-section { margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 12px; }
        .sku-edit-section h3 { font-size: 14px; margin-bottom: 10px; color: #007bff; }
        .sku-edit-item { background: #f8f9fa; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 3px solid #17a2b8; }
        .sku-edit-item .sku-title { font-weight: bold; font-size: 13px; margin-bottom: 8px; color: #333; }
        
        /* 关键修复：输入框并排布局，防止撑破屏幕 */
        .sku-edit-item .sku-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
        .sku-edit-item .sku-inputs input { 
            flex: 1; 
            min-width: 0; /* 防止内容溢出撑破 flex 容器 */
            width: 50%; 
            padding: 8px; 
            font-size: 16px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }

        /* ================= 💻 电脑端专属优化 ================= */
        @media (min-width: 768px) {
            body { padding: 12px; }
            .container { padding: 15px; border-radius: 20px; }
            h1 { font-size: 20px; margin-bottom: 10px; }
            
            .entry-links { flex-direction: row; gap: 10px; margin-bottom: 15px; }
            .entry-links a { padding: 14px; font-size: 15px; border-radius: 14px; }

            .top-bar { flex-direction: row; align-items: center; flex-wrap: wrap; padding: 12px; }
            .top-bar label { display: block; white-space: nowrap; }
            .top-bar input { flex: 1; min-width: 150px; width: auto; padding: 10px; font-size: 16px; border-radius: 10px; }
            .top-bar button { width: auto; margin-bottom: 0; padding: 12px 18px; font-size: 14px; }
            
            .table-wrapper { overflow-x: auto; }
            table { display: table !important; width: 100%; background: rgba(255, 255, 255, 0.8); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-collapse: collapse; }
            thead { display: table-header-group !important; background: rgba(0,0,0,0.03); }
            thead tr { display: table-row !important; background: none !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; }
            thead th { display: table-cell !important; padding: 12px !important; text-align: left; font-weight: bold; color: #333; border-bottom: 1px solid rgba(0,0,0,0.1); }
            
            tbody tr { display: table-row !important; background: transparent !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; border-bottom: 1px solid rgba(0,0,0,0.05) !important; }
            tbody tr:hover { background: rgba(255, 255, 255, 0.5) !important; }
            tbody td { display: table-cell !important; padding: 12px !important; text-align: left; border: none !important; vertical-align: middle; flex: none !important; width: auto !important; margin: 0 !important; font-size: 13px; }
            tbody td::before { display: none !important; }
            
            tbody td[data-label="标题"], tbody td[data-label="商品ID"], tbody td[data-label="操作"] {
                width: auto !important; margin: 0 !important; border: none !important; padding: 12px !important;
            }
            tbody td[data-label="标题"] { font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.05) !important; }
            
            td[data-label="操作"] { display: table-cell !important; }
            td[data-label="操作"] button { width: auto; margin: 0 5px 5px 0 !important; padding: 6px 10px !important; font-size: 12px !important; }

            /* SKU 展开行彻底重置 */
            tr.sku-row { 
                display: table-row !important; 
                background: #fafafa !important; 
                border-radius: 0 !important; 
                margin: 0 !important; 
                box-shadow: none !important; 
                border: none !important; 
                border-left: none !important;
            }
            tr.sku-row td { 
                display: table-cell !important; 
                padding: 12px !important; 
                font-size: 13px !important; 
                width: auto !important; 
                margin: 0 !important; 
                border-bottom: 1px solid rgba(0,0,0,0.05) !important;
            }
            tr.sku-row td[data-label="SKU_ID"], tr.sku-row td[data-label="规格"] { 
                font-weight: normal !important; 
                font-size: 13px !important; 
                color: #1c1c1e !important; 
            }
            tr.sku-row .input-box { 
                width: 80px !important; 
                padding: 6px !important; 
                font-size: 14px !important; 
                border-radius: 8px !important; 
            }
            tr.sku-row td[data-label="操作"] { 
                justify-content: flex-start !important; 
                width: auto !important; 
                margin: 0 !important; 
                padding: 12px !important; 
                border-top: none !important; 
            }

            /* 电脑端弹窗居中 */
            .modal-overlay { align-items: center; }
            .modal-content { 
                border-radius: 24px; width: 90%; max-width: 600px; 
                margin: auto; max-height: 85vh; animation: fadeIn 0.2s; 
                padding: 20px; /* 电脑端恢复内边距 */
            }
            @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
            .sku-edit-item .sku-inputs input { font-size: 15px; } /* 电脑端字体可以稍微缩小一点 */
        }
    </style>
</head>
<body>

<!-- 🔒 密码验证层 -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h2>🔒 系统访问验证</h2>
        <input type="password" id="pwdInput" placeholder="请输入访问密码" onkeydown="if(event.key==='Enter') checkPwd()">
        <button onclick="checkPwd()">进入系统</button>
        <p id="pwdError" class="error-msg"></p>
    </div>
</div>

<!-- 主界面 -->
<div class="container" id="mainContainer">
    <div class="logout-btn"><button onclick="logout()">退出登录</button></div>
    <h1>闲管家 · 综合管理助手</h1>

    <div class="entry-links">
        <a href="orders.html" class="entry-order">📋 独立订单页</a>
        <a href="kami.html" class="entry-kami">🎫 卡密管理页</a>
    </div>

    <!-- 商品管理 -->
    <div id="product-page">
        <div class="top-bar">
            <label>🏪 闲鱼会员名：</label>
            <input type="text" id="userNameInput" value="叶刘军" placeholder="请输入闲鱼会员名">
        </div>
        <button onclick="loadProducts()">刷新商品列表</button>
        <div id="productStatusMsg" class="status-msg">正在加载商品列表...</div>

        <div class="table-wrapper">
            <table id="productTable">
                <thead><tr><th>商品ID</th><th>标题</th><th>状态</th><th>价格(元)</th><th>库存</th><th>操作</th></tr></thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 📝 编辑商品弹窗 -->
<div id="editProductModal" class="modal-overlay">
    <div class="modal-content">
        <h2>✏️ 编辑商品信息</h2>
        <input type="hidden" id="editProductId">
        <div class="form-group">
            <label>商品标题 <span style="color: red;">*</span></label>
            <input type="text" id="editTitle" placeholder="请输入商品标题">
        </div>
        <div class="form-group">
            <label>商品价格 (元) <span style="color: red;">*</span></label>
            <input type="number" step="0.01" id="editPrice" placeholder="例如：99.90">
        </div>
        <div class="form-group">
            <label>商品总库存 <span style="color: red;">*</span></label>
            <input type="number" id="editStock" placeholder="请输入总库存数量">
        </div>
        <div class="form-group">
            <label>商品描述 <span style="color: red;">*</span></label>
            <textarea id="editContent" placeholder="请输入商品描述，支持换行..."></textarea>
        </div>

        <!-- SKU 编辑区域（动态生成） -->
        <div id="editSkuContainer" class="sku-edit-section" style="display: none;">
            <h3>📦 多规格 SKU 列表（可单独修改价格和库存）</h3>
            <div id="skuListWrapper"></div>
        </div>

        <div class="modal-footer">
            <button style="background: #6c757d;" onclick="closeEditProductModal()">取消</button>
            <button style="background: #28a745;" onclick="submitEditProduct()">保存修改</button>
        </div>
    </div>
</div>

<script>
    // ================= 🔒 密码验证逻辑 =================
    const APP_PASSWORD = "shinia299."; // 注意末尾有个点

    function checkPwd() {
        const inputPwd = document.getElementById('pwdInput').value;
        if (inputPwd === APP_PASSWORD) {
            localStorage.setItem('saved_pwd', APP_PASSWORD);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            loadProducts();
        } else {
            document.getElementById('pwdError').innerText = "密码错误，请重试！";
            document.getElementById('pwdInput').value = "";
        }
    }

    function logout() {
        if (!confirm("确定要退出登录吗？（下次打开需重新输入密码）")) return;
        localStorage.removeItem('saved_pwd');
        location.reload();
    }

    window.onload = function() {
        if (localStorage.getItem('saved_pwd') === APP_PASSWORD) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            loadProducts();
        }
    };

    // ================= 原有逻辑 =================
    const WORKER_URL = "https://xian-guanjia-worker.1113630283.workers.dev";
    const productTableBody = document.getElementById('productTableBody');
    const productStatusMsg = document.getElementById('productStatusMsg');
    const userNameInput = document.getElementById('userNameInput');
    let currentProductData = []; 

    async function loadProducts() {
        productStatusMsg.innerText = "正在加载商品列表...";
        productTableBody.innerHTML = "";
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/list", body: { page: 1, page_size: 10 } }) });
            const result = await response.json();
            if (result.code === 0) {
                productStatusMsg.innerText = "加载成功！点击【编辑】可修改商品信息和SKU。";
                
                currentProductData = result.data.list || []; 

                currentProductData.sort((a, b) => {
                    const aWeight = (a.product_status === 22) ? 0 : 1;
                    const bWeight = (b.product_status === 22) ? 0 : 1;
                    return aWeight - bWeight; 
                });

                currentProductData.forEach(product => {
                    let statusBadge = `<span class="badge-unknown">未知(${product.product_status || '无'})</span>`;
                    if (product.product_status === 22) statusBadge = `<span class="badge-on">✅ 已上架</span>`;
                    else if (product.product_status === 31) statusBadge = `<span class="badge-off">⛔ 已下架</span>`;
                    else if (product.product_status === 23) statusBadge = `<span class="badge-sold">🏷️ 已售出</span>`;
                    const priceYuan = product.price ? (product.price / 100).toFixed(2) : '-';
                    const stock = product.stock !== undefined ? product.stock : '-';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td data-label="商品ID">${product.product_id}</td>
                        <td data-label="标题"><b>${product.title || '无标题'}</b></td>
                        <td data-label="状态">${statusBadge}</td>
                        <td data-label="价格">${priceYuan} 元</td>
                        <td data-label="库存">${stock}</td>
                        <td data-label="操作" style="justify-content: flex-start; gap: 5px;">
                            <button class="btn-edit" onclick="openEditProductModal(${product.product_id})" style="padding:6px 10px; font-size:12px; width:auto;">编辑</button>
                            <button onclick="toggleSkuList(${product.product_id}, this)" data-expanded="false" style="padding:6px 10px; font-size:12px; width:auto;">展开规格</button>
                            <button class="btn-publish" onclick="publishProduct(${product.product_id}, this)" style="padding:6px 10px; font-size:12px; width:auto;">上架</button>
                            <button class="btn-down" onclick="downShelfProduct(${product.product_id}, this)" style="padding:6px 10px; font-size:12px; width:auto;">下架</button>
                        </td>
                    `;
                    productTableBody.appendChild(tr);
                });
            } else { productStatusMsg.innerText = "加载失败：" + result.msg; }
        } catch (error) { productStatusMsg.innerText = "请求出错：" + error.message; }
    }

    // ================= 📝 编辑商品逻辑（含SKU） =================

    // 打开编辑弹窗
    async function openEditProductModal(productId) {
        const userName = userNameInput.value.trim();
        if (!userName) return alert("请先填写顶部的【闲鱼会员名】，否则无法编辑！");

        const product = currentProductData.find(p => p.product_id === productId);
        document.getElementById('editProductId').value = productId;
        document.getElementById('editTitle').value = product ? (product.title || '') : '';
        document.getElementById('editPrice').value = product && product.price ? (product.price / 100).toFixed(2) : '';
        document.getElementById('editStock').value = product && product.stock !== undefined ? product.stock : '';
        document.getElementById('editContent').value = ''; 

        // 隐藏并清空 SKU 区域
        document.getElementById('editSkuContainer').style.display = 'none';
        document.getElementById('skuListWrapper').innerHTML = '正在加载规格信息...';

        // 显示弹窗
        document.getElementById('editProductModal').style.display = 'flex';

        // 调用详情接口获取完整信息（描述 + SKU 列表）
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } }) });
            const result = await response.json();
            if (result.code === 0 && result.data) {
                // 回显商品描述
                let content = result.data.content; 
                if (!content && result.data.publish_shop && result.data.publish_shop.length > 0) {
                    content = result.data.publish_shop[0].content; 
                }
                if (content) document.getElementById('editContent').value = content;

                // 渲染 SKU 列表
                if (result.data.sku_items && result.data.sku_items.length > 0) {
                    document.getElementById('editSkuContainer').style.display = 'block';
                    let skuHtml = '';
                    result.data.sku_items.forEach(sku => {
                        const priceYuan = (sku.price / 100).toFixed(2);
                        skuHtml += `
                            <div class="sku-edit-item" data-sku-text="${sku.sku_text}">
                                <div class="sku-title">🏷️ ${sku.sku_text}</div>
                                <div class="sku-inputs">
                                    <input type="number" step="0.01" class="sku-price-input" data-sku-id="${sku.sku_id}" value="${priceYuan}" placeholder="价格(元)">
                                    <input type="number" class="sku-stock-input" data-sku-id="${sku.sku_id}" value="${sku.stock}" placeholder="库存">
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('skuListWrapper').innerHTML = skuHtml;
                } else {
                    document.getElementById('editSkuContainer').style.display = 'none';
                }
            }
        } catch (error) {
            console.log("获取商品详情失败：", error);
            document.getElementById('skuListWrapper').innerHTML = '<span style="color:red;">加载规格失败</span>';
        }
    }

    // 关闭编辑弹窗
    function closeEditProductModal() {
        document.getElementById('editProductModal').style.display = 'none';
    }

    // 提交编辑（包含商品信息和 SKU）
    async function submitEditProduct() {
        const productId = parseInt(document.getElementById('editProductId').value);
        const title = document.getElementById('editTitle').value.trim();
        const priceYuan = document.getElementById('editPrice').value;
        const stock = parseInt(document.getElementById('editStock').value);
        const content = document.getElementById('editContent').value.trim();
        const userName = userNameInput.value.trim();

        if (!title || !priceYuan || isNaN(stock) || !content) {
            return alert("请完整填写所有必填项！");
        }
        if (!userName) return alert("请先填写顶部的【闲鱼会员名】！");

        const priceFen = Math.round(parseFloat(priceYuan) * 100); 

        // 收集 SKU 数据
        const skuItems = [];
        const skuContainer = document.getElementById('skuListWrapper');
        if (document.getElementById('editSkuContainer').style.display !== 'none') {
            const skuItemsDom = skuContainer.querySelectorAll('.sku-edit-item');
            skuItemsDom.forEach(item => {
                const skuText = item.getAttribute('data-sku-text');
                const skuPrice = Math.round(parseFloat(item.querySelector('.sku-price-input').value) * 100);
                const skuStock = parseInt(item.querySelector('.sku-stock-input').value);
                skuItems.push({
                    sku_text: skuText,
                    price: skuPrice,
                    stock: skuStock
                });
            });
        }

        // 构造请求体
        const requestBody = {
            product_id: productId,
            price: priceFen,
            stock: stock,
            publish_shop: [
                {
                    user_name: userName,
                    title: title,
                    content: content
                }
            ]
        };

        // 如果有 SKU，附加到请求体
        if (skuItems.length > 0) {
            requestBody.sku_items = skuItems;
        }

        try {
            // 统一使用 /api/open/product/edit 接口
            const response = await fetch(WORKER_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path: "/api/open/product/edit", body: requestBody }) 
            });
            const result = await response.json();
            
            if (result.code === 0) {
                alert("商品和 SKU 修改成功！");
                closeEditProductModal();
                loadProducts(); 
            } else {
                alert("修改失败：" + result.msg);
            }
        } catch (error) {
            alert("请求出错：" + error.message);
        }
    }

    // ================= 原有逻辑继续 =================

    async function toggleSkuList(productId, btn) {
        const mainRow = btn.closest('tr');
        if (btn.dataset.expanded === 'true') {
            let nextRow = mainRow.nextElementSibling;
            while (nextRow && nextRow.classList.contains('sku-row')) { let rowToDelete = nextRow; nextRow = nextRow.nextElementSibling; rowToDelete.remove(); }
            btn.innerText = "展开规格"; btn.dataset.expanded = "false"; return; 
        }
        document.querySelectorAll('.sku-row').forEach(row => row.remove());
        document.querySelectorAll('#productTableBody button').forEach(otherBtn => {
            if (otherBtn.dataset.expanded === 'true') { otherBtn.innerText = "展开规格"; otherBtn.dataset.expanded = "false"; }
        });
        btn.innerText = "加载中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } }) });
            const result = await response.json();
            if (result.code === 0 && result.data.sku_items) {
                let lastInsertedRow = mainRow; 
                result.data.sku_items.forEach(sku => {
                    const skuTr = document.createElement('tr');
                    skuTr.className = 'sku-row';
                    const priceInYuan = (sku.price / 100).toFixed(2); 
                    skuTr.innerHTML = `
                        <td data-label="SKU_ID">└─ ${sku.sku_id}</td>
                        <td data-label="规格" data-sku-text="${sku.sku_text}">${sku.sku_text}</td>
                        <td data-label="价格"><input type="number" step="0.01" class="input-box" id="price_${sku.sku_id}" value="${priceInYuan}"> 元</td>
                        <td data-label="库存"><input type="number" class="input-box" id="stock_${sku.sku_id}" value="${sku.stock}"> 件</td>
                        <td data-label="操作"><button class="btn-save" onclick="updateSkuData(${productId}, ${sku.sku_id})">保存</button></td>
                    `;
                    lastInsertedRow.parentNode.insertBefore(skuTr, lastInsertedRow.nextSibling);
                    lastInsertedRow = skuTr; 
                });
                btn.innerText = "收起规格"; btn.disabled = false; btn.dataset.expanded = "true"; 
            } else { alert("获取规格失败：" + (result.msg || "未知错误")); btn.innerText = "重试"; btn.disabled = false; }
        } catch (error) { alert("网络错误：" + error.message); btn.innerText = "重试"; btn.disabled = false; }
    }

    async function updateSkuData(productId, skuId) {
        const stockInput = document.getElementById(`stock_${skuId}`);
        const priceInput = document.getElementById(`price_${skuId}`);
        const newStockStr = stockInput.value;
        const newPriceYuanStr = priceInput.value;
        if (newStockStr === '' || newPriceYuanStr === '') return alert("请输入价格和库存");
        
        const newPriceFen = Math.round(parseFloat(newPriceYuanStr) * 100);
        const newStock = parseInt(newStockStr);
        
        const skuText = priceInput.closest('tr').querySelector('td[data-label="规格"]').getAttribute('data-sku-text');
        if (!skuText) return alert("无法获取SKU规格信息，请刷新重试");

        const requestBody = {
            product_id: productId,
            sku_items: [{
                sku_text: skuText,
                price: newPriceFen,
                stock: newStock
            }]
        };

        try {
            const response = await fetch(WORKER_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path: "/api/open/product/edit", body: requestBody }) 
            });
            const result = await response.json();
            if (result.code === 0) alert("SKU 修改成功！"); 
            else alert("修改失败：" + result.msg);
        } catch (error) {
            alert("请求出错：" + error.message);
        }
    }

    async function publishProduct(productId, btn) {
        const userName = userNameInput.value.trim();
        if (!userName) return alert("请先填写闲鱼会员名！");
        if (!confirm(`确定将商品 ${productId} 上架？`)) return;
        btn.innerText = "上架中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/publish", body: { product_id: parseInt(productId), user_name: [userName] } }) });
            const result = await response.json();
            if (result.code === 0) { alert("上架指令发送成功！稍后刷新查看"); loadProducts(); } else { alert("上架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { btn.innerText = "上架"; btn.disabled = false; }
    }

    async function downShelfProduct(productId, btn) {
        if (!confirm(`确定将商品 ${productId} 下架？`)) return;
        btn.innerText = "下架中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/downShelf", body: { product_id: parseInt(productId) } }) });
            const result = await response.json();
            if (result.code === 0) { alert("下架指令发送成功！稍后刷新查看"); loadProducts(); } else { alert("下架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { btn.innerText = "下架"; btn.disabled = false; }
    }
</script>
</body>
