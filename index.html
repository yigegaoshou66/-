<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 综合管理助手</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-orange: #FF9500;
            --ios-gray: #8E8E93;
            
            --text-primary: #1c1c1e;
            --text-secondary: rgba(60, 60, 67, 0.6);
            --text-tertiary: rgba(60, 60, 67, 0.35);
            
            --glass-light: rgba(255, 255, 255, 0.55);
            --glass-light-strong: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-highlight: rgba(255, 255, 255, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { margin: 0; padding: 0; min-height: 100vh; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; 
            padding: 16px; 
            color: var(--text-primary); 
            -webkit-font-smoothing: antialiased;
            background: #F2F4F8;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -100px;
            z-index: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(255, 150, 150, 0.6) 0%, transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(120, 180, 255, 0.6) 0%, transparent 32%),
                radial-gradient(circle at 70% 60%, rgba(150, 230, 180, 0.5) 0%, transparent 33%),
                radial-gradient(circle at 20% 75%, rgba(255, 220, 130, 0.55) 0%, transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(200, 160, 240, 0.55) 0%, transparent 33%);
            filter: blur(70px);
            opacity: 0.9;
            animation: blobsMove 25s ease-in-out infinite alternate;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
        }
        @keyframes blobsMove {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(1.05); }
        }

        .container { 
            position: relative;
            z-index: 1;
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }

        .top-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px; 
            gap: 12px;
        }
        .store-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 14px 20px;
            border-radius: 22px;
            background: var(--glass-light);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.5),
                0 4px 16px rgba(0, 0, 0, 0.05);
            overflow-x: auto; white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        .store-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .store-name { font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }

        .logout-btn button { 
            width: auto; padding: 14px 20px; font-size: 14px; font-weight: 600;
            background: var(--glass-light-strong);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            color: var(--ios-blue);
            border: 1px solid var(--glass-border); 
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.5),
                0 4px 12px rgba(0, 0, 0, 0.06);
            transition: all 0.15s;
            margin-bottom: 0;
            white-space: nowrap;
        }
        .logout-btn button:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.9); }

        .entry-links { display: flex; gap: 10px; margin-bottom: 16px; }
        .entry-links a { 
            flex: 1; text-align: center; text-decoration: none; padding: 18px 8px; 
            border-radius: 22px; 
            color: var(--text-primary); font-weight: 600; font-size: 14px; 
            background: var(--glass-light);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.5),
                0 4px 16px rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .entry-links a::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
        }
        .entry-links a:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.75); }
        .entry-order { color: #007AFF; }
        .entry-after { color: #FF9500; }
        .entry-kami { color: #6F42C1; }

        .top-bar { margin-bottom: 20px; }
        .top-bar button { 
            width: 100%; padding: 18px; font-size: 16px; font-weight: 600;
            background: linear-gradient(180deg, rgba(10, 132, 255, 0.95) 0%, rgba(0, 100, 220, 0.95) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1),
                0 8px 24px rgba(10, 132, 255, 0.3);
            transition: all 0.15s;
            letter-spacing: -0.2px;
            position: relative;
            overflow: hidden;
            margin-bottom: 0;
        }
        .top-bar button::before {
            content: "";
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
        }
        .top-bar button:active { transform: scale(0.98); }

        button { 
            padding: 10px 16px; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; 
            background: var(--ios-blue); 
            transition: transform 0.05s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.05s, box-shadow 0.05s; 
            width: 100%; margin-bottom: 10px;
        }
        button:active { transform: scale(0.92); opacity: 0.85; filter: brightness(0.9); }
        
        .btn-edit { background: var(--ios-orange); color: #fff; }
        .btn-save { background: var(--ios-green); width: auto; margin-bottom: 0; }
        
        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        
        tr { 
            display: flex; flex-wrap: wrap; 
            background: var(--glass-light);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 26px; 
            margin-bottom: 14px; padding: 20px; 
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.5),
                0 6px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        tr::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
            z-index: 2;
        }
        tr:active { background: rgba(255, 255, 255, 0.7); }
        
        td { 
            display: flex; align-items: center; 
            padding: 0; border: none; 
            font-size: 13px; text-align: left; color: var(--text-primary); 
            flex: 0 0 auto; margin-right: 12px; 
            position: relative;
            z-index: 1;
        }
        td::before { content: attr(data-label); font-weight: 500; color: var(--text-secondary); margin-right: 4px; flex-shrink: 0; }
        
        td[data-label="标题"], td[data-label="状态 / 操作"] { 
            flex: 0 0 100%; width: 100%; margin-right: 0;
        }
        
        td[data-label="标题"] { 
            padding-bottom: 8px; margin-bottom: 6px; 
            border-bottom: 1px solid rgba(60,60,67,0.08); 
            display: block; 
        }
        td[data-label="标题"]::before { display: none; }
        
        .product-title-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
        }
        .product-thumb {
            width: 64px; 
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            background: #f0f0f0;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .product-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .product-title-text {
            font-size: 15px; 
            font-weight: 700; 
            line-height: 1.35; 
            margin-bottom: 4px;
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden;
        }
        .product-id-text {
            font-size: 11px; 
            color: var(--text-tertiary); 
            font-family: monospace;
        }

        td[data-label="价格"]::before { content: "价:"; color: var(--text-secondary); }
        td[data-label="库存"]::before { content: "库:"; color: var(--text-secondary); }
        
        td[data-label="状态 / 操作"] { 
            margin-top: 12px; padding-top: 14px; 
            border-top: 1px solid rgba(60,60,67,0.08); 
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-start;
        }
        td[data-label="状态 / 操作"]::before { display: none; }
        td[data-label="状态 / 操作"] button { padding: 10px 16px; font-size: 13px; margin: 0; border-radius: 100px; width: auto; font-weight: 600; }
        
        tr.sku-row {
            display: flex; flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 20px;
            margin-top: -8px; margin-bottom: 14px;
            margin-left: 10px; 
            padding: 14px; 
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--ios-blue);
            box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 12px rgba(0,0,0,0.04);
        }
        tr.sku-row td { font-size: 13px; padding: 0; margin-right: 0; border: none; }
        tr.sku-row td[data-label="SKU_ID"] { width: 100%; flex: 0 0 100%; font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; }
        tr.sku-row td[data-label="SKU_ID"]::before { display: none; }
        tr.sku-row td[data-label="规格"] { width: 100%; flex: 0 0 100%; font-weight: 600; margin-bottom: 8px; }
        tr.sku-row td[data-label="规格"]::before { display: none; }
        
        tr.sku-row td[data-label="价格"], 
        tr.sku-row td[data-label="库存"] { 
            flex: 1 1 0; 
            width: 0;
            display: flex; 
            align-items: center; 
            margin-right: 4px; 
            min-width: 0; 
        }
        tr.sku-row td[data-label="价格"]::before { content: "价"; margin-right: 2px; font-size: 12px; color: var(--text-secondary); }
        tr.sku-row td[data-label="库存"]::before { content: "库"; margin-right: 2px; font-size: 12px; color: var(--text-secondary); }
        
        tr.sku-row td[data-label="操作"] { 
            flex: 0 0 auto; 
            display: flex; 
            align-items: center; 
            justify-content: flex-end; 
            width: auto !important; 
            margin-top: 0 !important; 
            padding-top: 0 !important; 
            border-top: none !important; 
            margin-left: 2px;
        }
        
        tr.sku-row .input-box { 
            flex: 1; 
            width: 100%;
            min-width: 25px;
            padding: 6px 2px; 
            font-size: 13px; 
            text-align: center; 
            margin: 0; 
            border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 8px; 
            outline: none; 
            transition: all 0.2s;
            background: #fff;
        }
        tr.sku-row .input-box:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 2px rgba(0,122,255,0.15); }
        
        tr.sku-row td[data-label="操作"] .btn-save {
            padding: 6px 12px !important;
            font-size: 12px !important;
            white-space: nowrap;
            border-radius: 100px !important;
            margin: 0 !important;
        }

        .status-btn {
            display: inline-flex !important; align-items: center; justify-content: center;
            padding: 10px 16px !important; border-radius: 100px !important;
            font-size: 13px !important; font-weight: 600 !important;
            cursor: pointer !important; border: 1px solid rgba(255,255,255,0.5) !important;
            transition: transform 0.1s, opacity 0.1s, filter 0.1s !important;
        }
        .status-btn:active { transform: scale(0.9) !important; opacity: 0.75 !important; }
        .status-btn-on { background: var(--ios-green) !important; color: #fff !important; }
        .status-btn-off { background: var(--ios-red) !important; color: #fff !important; }
        .status-btn-sold { background: var(--ios-gray) !important; color: #fff !important; }
        .status-btn-unknown { background: var(--ios-orange) !important; color: #fff !important; }

        .status-msg { margin-top: 12px; color: var(--text-secondary); font-weight: 600; font-size: 13px; text-align: center; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-content { 
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 28px 28px 0 0; 
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
            width: 100%; max-height: 90vh; 
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            border: 1px solid var(--glass-border);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,1);
            animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-content h2 { margin-top: 0; border-bottom: 1px solid rgba(60,60,67,0.08); padding-bottom: 12px; font-size: 18px; font-weight: 700; }

        /* ===== 弹窗头部（标题 + 编辑按钮） ===== */
        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(60,60,67,0.08);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }
        .modal-header-row h2 {
            margin: 0;
            padding: 0;
            border: none;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 18px;
            font-weight: 700;
        }
        .modal-edit-btn {
            width: auto !important;
            margin: 0 !important;
            padding: 9px 18px !important;
            border-radius: 100px !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            background: var(--ios-orange) !important;
            color: #fff !important;
            border: 1px solid rgba(255,255,255,0.5) !important;
            flex-shrink: 0;
            box-shadow: 0 2px 10px rgba(255,149,0,0.35);
        }
        .modal-edit-btn:active { transform: scale(0.94) !important; opacity: 0.85 !important; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary); }
        .form-group input[type="text"], .form-group input[type="number"], .form-group textarea { 
            width: 100%; padding: 14px; border: 1px solid rgba(0,0,0,0.08); 
            background: rgba(255,255,255,0.7); border-radius: 14px; 
            font-size: 16px; outline: none; box-sizing: border-box; transition: all 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--ios-blue); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }
        .form-group textarea { height: 110px; resize: vertical; }
        
        .modal-footer { text-align: right; margin-top: 20px; border-top: 1px solid rgba(60,60,67,0.08); padding-top: 16px; display: flex; gap: 12px; justify-content: flex-end; }
        .modal-footer button { width: auto; padding: 12px 24px; margin-bottom: 0; font-size: 14px; border-radius: 100px; }

        .sku-edit-section { margin-top: 20px; border-top: 1px dashed rgba(60,60,67,0.15); padding-top: 16px; }
        .sku-edit-section h3 { font-size: 14px; margin-bottom: 12px; color: var(--ios-blue); }
        .sku-edit-item { background: rgba(255,255,255,0.6); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--glass-border); border-left: 4px solid var(--ios-blue); }
        .sku-edit-item .sku-title { font-weight: 600; font-size: 13px; margin-bottom: 10px; color: var(--text-primary); }
        .sku-edit-item .sku-inputs { display: flex; gap: 10px; flex-wrap: wrap; }
        .sku-edit-item .sku-inputs input { 
            flex: 1; min-width: 0; width: 50%; padding: 12px; font-size: 16px; 
            border: 1px solid rgba(0,0,0,0.1); border-radius: 10px; 
            box-sizing: border-box; outline: none; transition: all 0.2s; background: #fff;
        }
        .sku-edit-item .sku-inputs input:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }

        .image-preview-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.03);
            border: 1px dashed rgba(0,0,0,0.15);
            border-radius: 12px;
            min-height: 70px;
            align-content: flex-start;
        }
        .image-preview-item {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.08);
            background: #fff;
            flex-shrink: 0;
        }
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-item .delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            line-height: 1;
            font-weight: bold;
        }

        /* ===== 查看属性内容样式 ===== */
        .viewer-section {
            margin-bottom: 22px;
        }
        .viewer-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--ios-blue);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .viewer-section-title::before {
            content: "";
            width: 3px;
            height: 14px;
            background: var(--ios-blue);
            border-radius: 2px;
        }
        .viewer-content-box {
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(60,60,67,0.08);
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 260px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .viewer-content-box.empty {
            color: var(--text-tertiary);
            text-align: center;
            padding: 24px;
        }

        /* 基础信息网格 */
        .viewer-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .viewer-info-item {
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(60,60,67,0.08);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .viewer-info-item span { font-size: 11px; color: var(--text-secondary); }
        .viewer-info-item b { font-size: 14px; word-break: break-word; color: var(--text-primary); }
        .viewer-info-item b.price { color: var(--ios-orange); }
        .viewer-info-item b.stock { color: var(--ios-green); }

        .viewer-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .viewer-thumb {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            background: #f0f0f0;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .viewer-thumb:hover { transform: scale(1.04); box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
        .viewer-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .viewer-thumb .index-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 600;
        }
        .viewer-sku-list {
            display: flex;

<div id="imageZoomOverlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.92); z-index: 2000; justify-content: center; align-items: center; cursor: zoom-out;" onclick="closeZoom()">
    <img id="zoomedImage" src="" style="max-width: 95%; max-height: 95%; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,0.8); border-radius: 6px;">

<script>
    const WORKER_URL = "https://api.1113630283.online";
    let isNavigating = false;
    
    let currentProductData = []; 
    const productDetailCache = {}; 
    const skuCache = {}; 

    const MAX_CONCURRENT = 3;
    let activeRequests = 0;
    
    async function fetchWithControl(url, options, timeout = 8000, isBackground = false) {
        if (!isBackground && activeRequests >= MAX_CONCURRENT) {
            throw new Error('当前请求过多，请稍后重试（正在处理其他操作）');
        }
        if (!isBackground) activeRequests++;
        
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        
        try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (error) {
            clearTimeout(id);
            if (error.name === 'AbortError') {
                throw new Error('请求超时（超过' + (timeout/1000) + '秒），请检查网络或稍后再试');
            }
            throw error;
        } finally {
            if (!isBackground) activeRequests--;
        }
    }

    document.addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        const link = e.target.closest('.entry-links a, .back-btn');

        if (!btn && !link) return;

        if (link) {
            if (isNavigating) { e.stopImmediatePropagation(); e.preventDefault(); return; }
            isNavigating = true;
            link.style.pointerEvents = 'none';
            link.style.opacity = '0.5';
            link.style.transform = 'scale(0.9)';
            link.style.transition = 'all 0.1s ease'; 
            setTimeout(() => {
                isNavigating = false;
                link.style.pointerEvents = '';
                link.style.opacity = '';
                link.style.transform = '';
            }, 2000);
            return;
        }

        if (btn) {
            if (btn.disabled) return;
            if (btn.classList.contains('no-global-loading')) return;
            if (btn.closest('#imageZoomOverlay') || btn.closest('#productModal')) return;
            if (!btn.dataset.originalText) {
                btn.dataset.originalText = btn.innerText;
            }
            btn.disabled = true;
            btn.classList.add('btn-loading');
        }
    }, true);

    function restoreButton(btn) {
        if (btn && btn.classList.contains('btn-loading')) {
            btn.disabled = false;
            btn.innerText = btn.dataset.originalText || '刷新';
            btn.classList.remove('btn-loading');
            delete btn.dataset.originalText;
        }
    }

    /* ================= 弹窗状态 ================= */
    let modalProductId = null;      // 当前弹窗商品
    let modalDetailData = null;     // 当前弹窗详情数据
    let modalMode = 'view';         // 'view' | 'edit'
    let modalHeaderTitle = '商品属性';
    let isSaving = false;           // 防重复提交

    let editFormDirty = false;

    // 编辑区任意输入 → 标记为脏（事件委托）
    document.getElementById('editModeBody').addEventListener('input', function() {
        editFormDirty = true;
    });

    /* ======= 点击遮罩空白区域：智能处理 ======= */
    document.getElementById('productModal').addEventListener('click', function(e) {
        // 只有直接点击遮罩层本身（而不是它内部的 .modal-content）才触发
        if (e.target === this) {
            handleModalCloseAttempt();
        }
    });

    // 点击表格空白处收起 SKU 行（弹窗内点击不触发）
    document.addEventListener('click', function(e) {
        if (e.target.closest('.modal-content')) return;
        if (!e.target.closest('.sku-row') && !e.target.closest('button[onclick^="toggleSkuList"]')) {
            const expandedRows = document.querySelectorAll('.sku-row');
            if (expandedRows.length > 0) {
                expandedRows.forEach(row => row.remove());
                document.querySelectorAll('#productTableBody button[data-expanded="true"]').forEach(btn => {
                    btn.innerText = '展开规格';
                    btn.setAttribute('data-expanded', 'false');
                    restoreButton(btn);
                });
            }
        }
    });

    const productTableBody = document.getElementById('productTableBody');
    const productStatusMsg = document.getElementById('productStatusMsg');
    const userNameDisplay = document.getElementById('userNameDisplay');

    /* ================= 预加载其他页面数据 ================= */
    async function preloadOtherPages() {
        console.log("开始后台静默预加载其他页面数据...");
        
        try {
            if (!sessionStorage.getItem('preload_orders')) {
                const response = await fetchWithControl(WORKER_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ path: "/api/open/order/list", body: { page_no: 1, page_size: 20 } }) 
                }, 10000, true);
                const result = await response.json();
                if (result.code === 0) {
                    sessionStorage.setItem('preload_orders', JSON.stringify(result.data));
                    console.log("订单页面预加载成功");
                }
            }
        } catch (e) { console.log("订单页面预加载失败", e); }

        try {
            if (!sessionStorage.getItem('preload_shouhou')) {
                const response = await fetchWithControl(WORKER_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ path: "/api/open/trade/refund/list", body: { page_no: 1, page_size: 20 } }) 
                }, 10000, true);
                const result = await response.json();
                if (result.code === 0) {
                    sessionStorage.setItem('preload_shouhou', JSON.stringify(result.data));
                    console.log("售后页面预加载成功");
                }
            }
        } catch (e) { console.log("售后页面预加载失败", e); }

        try {
            if (!sessionStorage.getItem('preload_kami')) {
                const response = await fetchWithControl(WORKER_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ path: "/api/open/kami/kind/list", body: { page_no: 1, page_size: 20 } }) 
                }, 10000, true);
                const result = await response.json();
                if (result.code === 0) {
                    sessionStorage.setItem('preload_kami', JSON.stringify(result.data));
                    console.log("卡密页面预加载成功");
                }
            }
        } catch (e) { console.log("卡密页面预加载失败", e); }

        console.log("所有页面预加载完成！");
    }

    /* ================= 图片预览（编辑区） ================= */
    function renderImagePreview() {
        const imagesText = document.getElementById('editImages').value;
        const container = document.getElementById('imagePreviewContainer');
        container.innerHTML = '';
        const images = imagesText.split('\n').map(line => line.trim()).filter(url => url !== '');
        if (images.length === 0) {
            container.innerHTML = '<div style="color: #aaa; font-size: 12px; line-height: 50px; text-align: center; width: 100%;">暂无图片</div>';
            return;
        }
        images.forEach((url, index) => {
            let fullUrl = url;
            if (!url.startsWith('http')) fullUrl = 'https://img.alicdn.com/' + url;
            const div = document.createElement('div');
            div.className = 'image-preview-item';
            div.innerHTML = `
                <img src="${fullUrl}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiNjY2NjY2MiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB4PSIzIiB5PSIzIiB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHJ4PSIyIiByeT0iMiI+PC9yZWN0PjxjaXJjbGUgY3g9IjguNSIgY3k9IjguNSIgcj0iMS41Ij48L2NpcmNsZT48cG9seWxpbmUgcG9pbnRzPSIyMSAxNSAxNiAxMCA1IDIxIj48L3BvbHlsaW5lPjwvc3ZnPg=='">
                <div class="delete-btn" onclick="removeImage(${index})">×</div>
            `;
            container.appendChild(div);
        });
    }

    window.removeImage = function(index) {
        const textarea = document.getElementById('editImages');
        const images = textarea.value.split('\n').map(line => line.trim()).filter(url => url !== '');
        images.splice(index, 1);
        textarea.value = images.join('\n');
        renderImagePreview();
        editFormDirty = true;
    }

    document.getElementById('editImages').addEventListener('input', function() {
        renderImagePreview();
        editFormDirty = true;
    });

    /* ================= 商品列表渲染 ================= */
    function renderProductRow(product, isUpdate = false) {
        const priceYuan = product.price ? (product.price / 100).toFixed(2) : '-';
        const stock = product.stock !== undefined ? product.stock : '-';
        
        let imgUrl = '';
        if (productDetailCache[product.product_id]) {
            const detailData = productDetailCache[product.product_id];
            if (detailData.publish_shop && detailData.publish_shop[0] && detailData.publish_shop[0].images && detailData.publish_shop[0].images.length > 0) {
                imgUrl = detailData.publish_shop[0].images[0];
            }
        }
        if (!imgUrl) {
            if (product.images && product.images.length > 0) imgUrl = product.images[0];
            else if (product.image) imgUrl = product.image;
            else if (product.publish_shop && product.publish_shop[0] && product.publish_shop[0].images) imgUrl = product.publish_shop[0].images[0];
        }
        
        if (imgUrl && !imgUrl.startsWith('http')) imgUrl = 'https://img.alicdn.com/' + imgUrl;

        let statusActionBtn = '';

    async function loadProducts() {
        productStatusMsg.innerText = "正在加载商品列表...";
        productTableBody.innerHTML = "";
        const refreshBtn = document.querySelector('.top-bar button');
        try {
            const response = await fetchWithControl(WORKER_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path: "/api/open/product/list", body: { page: 1, page_size: 10 } }) 
            });
            const result = await response.json();
            if (result.code === 0) {
                productStatusMsg.innerText = "加载成功！";
                currentProductData = result.data.list || []; 
                
                Object.keys(productDetailCache).forEach(k => delete productDetailCache[k]);
                Object.keys(skuCache).forEach(k => delete skuCache[k]);

                currentProductData.sort((a, b) => {
                    const aWeight = (a.product_status === 22) ? 0 : 1;
                    const bWeight = (b.product_status === 22) ? 0 : 1;
                    return aWeight - bWeight; 
                });

                currentProductData.forEach(product => renderProductRow(product));
                prefetchProductDetails(currentProductData);
                
                setTimeout(preloadOtherPages, 3000);
                
            } else { productStatusMsg.innerText = "加载失败：" + result.msg; }
        } catch (error) { 
            productStatusMsg.innerText = "请求出错：" + error.message; 
            alert(error.message);
        } finally {
            if (refreshBtn) restoreButton(refreshBtn);
        }
    }

    async function prefetchProductDetails(products) {
        if (products.length === 0) return;
        const sortedProducts = [...products].sort((a, b) => {
            const aWeight = (a.product_status === 22) ? 0 : 1;
            const bWeight = (b.product_status === 22) ? 0 : 1;
            return aWeight - bWeight;
        });
        const prefetchLimit = 3;
        const chunks = [];
        for (let i = 0; i < sortedProducts.length; i += prefetchLimit) {
            chunks.push(sortedProducts.slice(i, i + prefetchLimit));
        }
        for (let chunk of chunks) {
            await Promise.all(chunk.map(async (product) => {
                if (!productDetailCache[product.product_id]) {
                    try {
                        const response = await fetchWithControl(WORKER_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: product.product_id } })
                        }, 10000, true);
                        const result = await response.json();
                        if (result.code === 0 && result.data) {
                            productDetailCache[product.product_id] = result.data;
                            if (result.data.sku_items) {
                                skuCache[product.product_id] = result.data.sku_items;
                            }
                            const productForRow = currentProductData.find(p => p.product_id === product.product_id);
                            if (productForRow) renderProductRow(productForRow, true);
                        }
                    } catch (e) {
                        console.log(`静默预加载商品 ${product.product_id} 失败:`, e);
                    }
                }
            }));
            await new Promise(r => setTimeout(r, 100));
        }
    }

    function setModalMode(mode) {
        modalMode = mode;
        const isEdit = (mode === 'edit');
        document.getElementById('viewModeBody').style.display = isEdit ? 'none' : 'block';
        document.getElementById('editModeBody').style.display = isEdit ? 'block' : 'none';
        document.getElementById('viewModeFooter').style.display = isEdit ? 'none' : 'flex';
        document.getElementById('editModeFooter').style.display = isEdit ? 'flex' : 'none';
        document.getElementById('modalEditToggleBtn').style.display = isEdit ? 'none' : 'inline-block';
        document.getElementById('productModalTitle').innerText = isEdit ? '编辑商品信息' : modalHeaderTitle;
    }

    window.switchToEditMode = function() {
        editFormDirty = false;
        setModalMode('edit');
    }

    /* ======== 取消按钮（底部） ======== */
    window.cancelEditMode = function() {
        if (isSaving) return;
        if (editFormDirty) {
            if (!confirm('放弃当前未保存的修改并返回查看模式？')) return;
        }
        // 用缓存数据重新渲染编辑表单，清空脏状态
        if (modalProductId !== null && modalDetailData) {
            renderEditForm(modalProductId, modalDetailData);
        }
        editFormDirty = false;

    }

    /* ======== 关闭按钮 / ESC 键入口 ======== */
    window.closeProductModal = function() {
        if (modalMode === 'edit' && editFormDirty) {
            handleModalCloseAttempt();
        } else {
            forceCloseProductModal();
        }
    }

    /* ======== 核心：关闭尝试（含未保存检查） ======== */
    async function handleModalCloseAttempt() {
        if (isSaving) return;

        // 非编辑模式，或没有改动，直接关闭
        if (modalMode !== 'edit' || !editFormDirty) {
            forceCloseProductModal();
            return;
        }

        // 有未保存修改 → 询问是否保存
        const wantSave = confirm(
            '检测到未保存的修改\n\n' +
            '点击【确定】保存并关闭\n' +
            '点击【取消】放弃修改并关闭'
        );

        if (wantSave) {
            isSaving = true;
            const ok = await saveProductFromModal(true);
            isSaving = false;
            if (ok) {
                forceCloseProductModal();
            }
            // 保存失败保持弹窗打开，让用户修改
        } else {
            // 用户选放弃，再确认一次防止误触
            if (confirm('确定放弃修改并关闭吗？')) {
                forceCloseProductModal();
            }
            // 选“取消”则留在编辑模式继续改
        }
    }

    function forceCloseProductModal() {
        document.getElementById('productModal').style.display = 'none';
        modalProductId = null;
        modalDetailData = null;
        editFormDirty = false;
        setModalMode('view');
    }

    /* ================= 打开弹窗 ================= */
    async function openProductModal(productId, btn, startEdit = false) {
        const originalText = btn ? btn.innerText : '';
        if (btn) { btn.disabled = true; btn.innerText = '加载中...'; }

        try {
            let detailData = productDetailCache[productId];
            if (!detailData) {
                const response = await fetchWithControl(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } })
                });
                const result = await response.json();
                if (result.code === 0 && result.data) {
                    detailData = result.data;
                    productDetailCache[productId] = detailData;
                    if (detailData.sku_items) skuCache[productId] = detailData.sku_items;
                } else {
                    throw new Error(result.msg || '获取详情失败');
                }
            }

            modalProductId = productId;
            modalDetailData = detailData;

            renderViewMode(productId, detailData);
            renderEditForm(productId, detailData);
            editFormDirty = false;

            document.getElementById('productModal').style.display = 'flex';
            setModalMode(startEdit ? 'edit' : 'view');

        } catch (error) {
            alert('获取商品属性失败：' + error.message);
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.classList.remove('btn-loading');
                btn.innerText = originalText || '查看属性';
                delete btn.dataset.originalText;
            }
        }
    }

    /* ================= 底部“保存修改”按钮 ================= */
    async function submitEditProduct(btn) {
        if (isSaving) return;
        if (btn) { btn.disabled = true; btn.innerText = '保存中...'; }
        isSaving = true;
        const ok = await saveProductFromModal(false);
        isSaving = false;
        if (btn) { btn.disabled = false; btn.innerText = '保存修改'; }
    }

    /* ================= 核心保存逻辑 =================
       返回 true 表示保存成功；false 表示失败（已弹窗提示）
       silentSuccess: true 时不弹成功提示
    ================================================== */
    async function saveProductFromModal(silentSuccess) {
        const productId = parseInt(document.getElementById('editProductId').value);
        const title = document.getElementById('editTitle').value.trim();
        const priceYuan = document.getElementById('editPrice').value;
        const stock = parseInt(document.getElementById('editStock').value);
        const content = document.getElementById('editContent').value.trim();
        const imagesText = document.getElementById('editImages').value.trim();
        const userName = userNameDisplay.textContent.trim(); 

        const images = imagesText.split('\n').map(line => line.trim()).filter(url => url !== '');

        if (!title || !priceYuan || isNaN(stock) || !content) {
            alert("请完整填写所有必填项！");
            return false;
        }
        if (!userName) { alert("找不到当前店铺名称，请刷新页面！"); return false; }
        if (images.length === 0) { alert("商品图片至少需要保留1张！"); return false; }
        if (images.length > 9) { alert("商品图片最多只能传9张！"); return false; }

        const priceFen = Math.round(parseFloat(priceYuan) * 100); 
        const skuItems = [];
        const skuContainer = document.getElementById('skuListWrapper');
        if (document.getElementById('editSkuContainer').style.display !== 'none') {
            let skuValid = true;
            skuContainer.querySelectorAll('.sku-edit-item').forEach(item => {
                const pv = parseFloat(item.querySelector('.sku-price-input').value);
                const sv = parseInt(item.querySelector('.sku-stock-input').value);
                if (isNaN(pv) || isNaN(sv)) { skuValid = false; }
                skuItems.push({ 
                    sku_text: item.getAttribute('data-sku-text'), 
                    price: Math.round(pv * 100), 
                    stock: sv 
                });
            });
            if (!skuValid) { alert("SKU 的价格或库存填写有误，请检查！"); return false; }
        }

        const requestBody = {
            product_id: productId,
            price: priceFen,
            stock: stock,
            publish_shop: [{ user_name: userName, title: title, content: content, images: images }]
        };
        if (skuItems.length > 0) requestBody.sku_items = skuItems;

        try {
            const response = await fetchWithControl(WORKER_URL, { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path: "/api/open/product/edit", body: requestBody }) 
            });
            const result = await response.json();
            if (result.code === 0) {
                // 同步本地数据
                const product = currentProductData.find(p => p.product_id === productId);
                if (product) {
                    product.title = title;
                    product.price = priceFen;
                    product.stock = stock;
                }
                if (!productDetailCache[productId]) productDetailCache[productId] = {};
                const d = productDetailCache[productId];
                d.content = content;
                if (!d.publish_shop) d.publish_shop = [{}];
                if (!d.publish_shop[0]) d.publish_shop[0] = {};
                d.publish_shop[0].title = title;
                d.publish_shop[0].content = content;
                d.publish_shop[0].images = images;
                if (skuItems.length > 0) {
                    d.sku_items = skuItems;
                    skuCache[productId] = skuItems;
                }

                if (product) renderProductRow(product, true);

                // 刷新弹窗内容并切回查看
                modalDetailData = d;
                renderViewMode(productId, d);
                editFormDirty = false;
                setModalMode('view');

                if (!silentSuccess) alert("商品和 SKU 修改成功！");
                return true;
            } else {
                alert("修改失败：" + result.msg);
                return false;
            }
        } catch (error) {
            alert("请求出错：" + error.message);
            return false;
        }
    }

    /* ================= 表格内 SKU 展开 ================= */
    async function toggleSkuList(event, productId, btn) {
        if (event) event.stopPropagation();
        btn.classList.remove('btn-loading');
        btn.disabled = false;
        const mainRow = btn.closest('tr');
        const isExpanded = btn.getAttribute('data-expanded') === 'true';

        let nextRow = mainRow.nextElementSibling;
        while (nextRow && nextRow.classList.contains('sku-row')) { let rowToDelete = nextRow; nextRow = nextRow.nextElementSibling; rowToDelete.remove(); }
        btn.innerText = "展开规格"; btn.setAttribute('data-expanded', 'false');
        if (isExpanded) { restoreButton(btn); return; }

        document.querySelectorAll('#productTableBody button[data-expanded="true"]').forEach(otherBtn => {
            if (otherBtn !== btn) { otherBtn.innerText = "展开规格"; otherBtn.setAttribute('data-expanded', 'false'); restoreButton(otherBtn); }
        });
        document.querySelectorAll('.sku-row').forEach(row => row.remove());

        if (skuCache[productId]) {
            renderSkuRows(mainRow, skuCache[productId], productId);
            btn.innerText = "收起规格"; btn.setAttribute('data-expanded', 'true'); restoreButton(btn); return;
        }

        btn.innerText = "加载中..."; btn.disabled = true; btn.classList.add('btn-loading');
        try {
            const response = await fetchWithControl(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } }) });
            const result = await response.json();
            if (result.code === 0 && result.data.sku_items) {
                skuCache[productId] = result.data.sku_items; productDetailCache[productId] = result.data;
                renderSkuRows(mainRow, result.data.sku_items, productId);
                btn.innerText = "收起规格"; btn.setAttribute('data-expanded', 'true');
            } else { alert("该商品暂无规格数据"); }
        } catch (error) { alert("获取规格失败：" + error.message); } finally {
            btn.disabled = false; btn.classList.remove('btn-loading'); delete btn.dataset.originalText;
            if (btn.getAttribute('data-expanded') !== 'true') { btn.innerText = "展开规格"; }
        }
    }

    function renderSkuRows(mainRow, skuItems, productId) {
        const fragment = document.createDocumentFragment();
        skuItems.forEach(sku => {
            const skuTr = document.createElement('tr'); skuTr.className = 'sku-row';
            skuTr.innerHTML = `
                <td data-label="SKU_ID">└─ ${sku.sku_id}</td>
                <td data-label="规格" data-sku-text="${sku.sku_text}">${sku.sku_text}</td>
                <td data-label="价格"><input type="number" step="0.01" class="input-box" id="price_${sku.sku_id}" value="${(sku.price / 100).toFixed(2)}"></td>
                <td data-label="库存"><input type="number" class="input-box" id="stock_${sku.sku_id}" value="${sku.stock}"></td>
                <td data-label="操作"><button class="btn-save" onclick="updateSkuData(${productId}, ${sku.sku_id}, this)">保存</button></td>
            `;
            fragment.appendChild(skuTr);
        });
        mainRow.parentNode.insertBefore(fragment, mainRow.nextSibling);
    }

    async function updateSkuData(productId, skuId, saveBtn) {
        const stockInput = document.getElementById(`stock_${skuId}`); const priceInput = document.getElementById(`price_${skuId}`);
        const newStockStr = stockInput.value; const newPriceYuanStr = priceInput.value;
        if (newStockStr === '' || newPriceYuanStr === '') { restoreButton(saveBtn); return alert("请输入价格和库存"); }
        const newPriceFen = Math.round(parseFloat(newPriceYuanStr) * 100); const newStock = parseInt(newStockStr);
        if(saveBtn) { saveBtn.disabled = true; saveBtn.innerText = "保存中..."; }
        try {
            let skuItems = skuCache[productId];
            if (!skuItems) {
                const detailResponse = await fetchWithControl(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } }) });
                const detailResult = await detailResponse.json();
                if (detailResult.code !== 0 || !detailResult.data.sku_items) throw new Error("获取原规格失败");
                skuItems = detailResult.data.sku_items; skuCache[productId] = skuItems;
            }
            const updatedSkuItems = skuItems.map(sku => sku.sku_id === skuId ? { ...sku, price: newPriceFen, stock: newStock } : sku);
            skuCache[productId] = updatedSkuItems; if (productDetailCache[productId]) productDetailCache[productId].sku_items = updatedSkuItems;
            const response = await fetchWithControl(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/edit", body: { product_id: productId, sku_items: updatedSkuItems.map(s => ({ sku_text: s.sku_text, price: s.price, stock: s.stock })) } }) });
            const result = await response.json();
            if (result.code === 0) { alert("SKU 修改成功！"); } else { alert("修改失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { if(saveBtn) restoreButton(saveBtn); }
    }

    /* ================= 上下架 ================= */
    async function publishProduct(productId, btn) {
        const userName = userNameDisplay.textContent.trim();
        if (!userName) { restoreButton(btn); return alert("找不到当前店铺名称！"); }
        if (!confirm(`确定将商品 ${productId} 上架？`)) { restoreButton(btn); return; }
        btn.innerText = "上架中..."; btn.disabled = true;
        try {
            const response = await fetchWithControl(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/publish", body: { product_id: parseInt(productId), user_name: [userName] } }) });
            const result = await response.json();
            if (result.code === 0) { alert("上架指令发送成功！"); sessionStorage.removeItem('preload_orders'); loadProducts(); } else { alert("上架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { restoreButton(btn); }
    }

    async function downShelfProduct(productId, btn) {
        if (!confirm(`确定将商品 ${productId} 下架？`)) { restoreButton(btn); return; }
        btn.innerText = "下架中..."; btn.disabled = true;
        try {
            const response = await fetchWithControl(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/downShelf", body: { product_id: parseInt(productId) } }) });
            const result = await response.json();
            if (result.code === 0) { alert("下架指令发送成功！"); sessionStorage.removeItem('preload_orders'); loadProducts(); } else { alert("下架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { restoreButton(btn); }
    }

    /* ================= 图片放大 ================= */
    function zoomImage(url) {
        document.getElementById('zoomedImage').src = url;
        document.getElementById('imageZoomOverlay').style.display = 'flex';
    }

    function closeZoom() {
        document.getElementById('imageZoomOverlay').style.display = 'none';
        document.getElementById('zoomedImage').src = '';
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const zoomOverlay = document.getElementById('imageZoomOverlay');
            if (zoomOverlay.style.display === 'flex') { closeZoom(); return; }
            const modal = document.getElementById('productModal');
            if (modal.style.display === 'flex') { closeProductModal(); return; }
        }
    });

    loadProducts();
</script>
