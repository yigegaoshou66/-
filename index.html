<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闲管家手机助手</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f9f9f9; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #0070f3; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:active { background: #005bb5; }
        button:disabled { background: #999; cursor: not-allowed; }
        .result { margin-top: 16px; padding: 12px; background: #fff; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; border: 1px solid #ddd; }
        .error-text { color: #d32f2f; }
    </style>
</head>
<body>
    <h2>闲管家 · 手机助手</h2>
    
    <label>接口路径</label>
    <input id="path" value="/api/open/shop/query" placeholder="/api/open/...">
    
    <label>请求体（JSON）</label>
    <textarea id="body" rows="6" placeholder='留空则默认发送 {}，也可填入 {"product_id":"...","stock":10}'></textarea>
    
    <button id="sendBtn" onclick="send()">发送请求</button>
    <div class="result" id="result"></div>

    <script>
        // ⚠️ 这里填你部署出来的真实 Worker 地址
        const WORKER_URL = 'https://xian-guanjia-worker.1113630283.workers.dev'; 

        async function send() {
            const resultEl = document.getElementById('result');
            const sendBtn = document.getElementById('sendBtn');
            
            resultEl.className = ''; 
            resultEl.textContent = '请求中...';
            sendBtn.disabled = true; 
            sendBtn.textContent = '发送中...';

            const bodyText = document.getElementById('body').value.trim(); 
            let body = {};
            if (bodyText) {
                try {
                    body = JSON.parse(bodyText);
                } catch (e) {
                    resultEl.className = 'error-text';
                    resultEl.textContent = '❌ 请求体 JSON 格式有误！\n请全选删除输入框内容，直接留空发送。';
                    sendBtn.disabled = false;
                    sendBtn.textContent = '发送请求';
                    return; 
                }
            }

            try {
                const resp = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        path: document.getElementById('path').value.trim(), 
                        body: body 
                    }),
                });
                
                const text = await resp.text(); // 先获取原始文本！
                
                try {
                    const data = JSON.parse(text);
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } catch (jsonErr) {
                    resultEl.className = 'error-text';
                    resultEl.textContent = '⚠️ 后端返回了非JSON内容（大概率是签名错误或权限不足）：\n\n' + text;
                }
            } catch (e) {
                resultEl.className = 'error-text';
                resultEl.textContent = '网络请求失败: ' + e.message;
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送请求';
            }
        }
    </script>
</body>
</html>
