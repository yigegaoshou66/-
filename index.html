<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 综合管理助手</title>
    <style>
        /* 全局基础样式 - 液态玻璃背景 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 15px; 
            /* 加深了一点渐变，让玻璃效果更明显 */
            background: linear-gradient(135deg, #b3a1e0 0%, #6aa8e0 100%);
            background-attachment: fixed;
            margin: 0; 
            color: #1c1c1e;
        }
        /* 液态玻璃容器 */
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.55); 
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px; 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); 
            padding: 20px;
        }
        h1 { color: #1c1c1e; text-align: center; margin-bottom: 20px; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }

        /* 🟢 顶层入口链接区 - 改为实色背景 + 白字，绝对清晰 */
        .entry-links { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .entry-links a { 
            text-decoration: none; padding: 12px 22px; border-radius: 20px; 
            color: #ffffff; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: 0.3s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .entry-links a:hover { transform: translateY(-2px); }
        .entry-order { background: linear-gradient(135deg, #17a2b8, #138496); }
        .entry-kami { background: linear-gradient(135deg, #6f42c1, #5a32a3); }

        /* 导航栏样式 - 玻璃胶囊 */
        .nav-tabs { display: flex; gap: 8px; background: rgba(255, 255, 255, 0.4); padding: 6px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.6); }
        .nav-tabs button { 
            flex: 1; background: none; border: none; color: #555; font-size: 14px; font-weight: bold; padding: 10px; cursor: pointer; 
            border-radius: 12px; transition: 0.3s;
        }
        .nav-tabs button.active { 
            color: #007bff; background: #ffffff; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; background: rgba(255, 255, 255, 0.4); padding: 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.6); }
        .top-bar label { font-weight: bold; color: #333; font-size: 13px; }
        .top-bar input, .top-bar select { padding: 8px 12px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.85); border-radius: 10px; font-size: 13px; outline: none; color: #333; }
        
        /* 按钮 - 玻璃胶囊 */
        button { 
            padding: 10px 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s;
            background: rgba(0, 122, 255, 0.9); backdrop-filter: blur(10px); box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
        }
        button:hover { transform: scale(1.02); background: rgba(0, 122, 255, 1); }
        .btn-publish { background: rgba(23, 162, 184, 0.9); box-shadow: 0 4px 12px rgba(23, 162, 184, 0.25); }
        .btn-down { background: rgba(220, 53, 69, 0.9); box-shadow: 0 4px 12px rgba(220, 53, 69, 0.25); }
        .btn-save { background: rgba(40, 167, 69, 0.9); font-size: 12px; padding: 6px 12px; }
        
        /* 表格容器 */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 16px; background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.6); padding: 4px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        /* 🟢 加深了表格内文字的颜色 */
        th, td { padding: 12px 10px; text-align: left; font-size: 13px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); color: #1c1c1e; font-weight: 500; }
        th { background: rgba(255, 255, 255, 0.7); font-weight: 700; color: #222; white-space: nowrap; }
        tr:last-child td { border-bottom: none; }
        .input-box { width: 60px; padding: 6px; border: 1px solid rgba(0,0,0,0.1); background: #fff; border-radius: 6px; margin-right: 5px; color: #333; }
        .status-msg { margin-top: 10px; color: #333; font-weight: bold; font-size: 13px; }
        
        /* 商品状态标签样式 */
        .badge-on { background-color: #28a745; color: white; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; display: inline-block; box-shadow: 0 2px 6px rgba(40,167,69,0.3); }
        .badge-off { background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; display: inline-block; box-shadow: 0 2px 6px rgba(220,53,69,0.3); }
        .badge-sold { background-color: #6c757d; color: white; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; display: inline-block; box-shadow: 0 2px 6px rgba(108,117,125,0.3); }
        .badge-unknown { background-color: #ffc107; color: #333; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; display: inline-block; box-shadow: 0 2px 6px rgba(255,193,7,0.3); }

        /* 订单状态颜色 */
        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-11 { background-color: #fff3cd; color: #856404; }
        .status-12 { background-color: #cce5ff; color: #004085; }
        .status-21 { background-color: #d4edda; color: #155724; }
        .status-22 { background-color: #d1ecf1; color: #0c5460; }
        .status-23, .status-24 { background-color: #f8d7da; color: #721c24; }
        
        /* 分页 */
        .pagination { margin-top: 15px; text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .page-btn { background: rgba(108, 117, 125, 0.9); padding: 6px 12px; font-size: 12px; border-radius: 8px; }

        /* 🟢 移动端专属优化 */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; border-radius: 20px; }
            h1 { font-size: 20px; }
            .entry-links { flex-direction: column; }
            .entry-links a { text-align: center; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .top-bar input, .top-bar select { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>闲管家 · 综合管理助手</h1>

    <!-- 独立页面的跳转入口 -->
    <div class="entry-links">
        <a href="orders.html" class="entry-order">📋 独立订单页</a>
        <a href="kami.html" class="entry-kami">🎫 卡密管理页</a>
    </div>

    <!-- 导航栏 -->
    <div class="nav-tabs">
        <button id="tab-product" class="active" onclick="switchTab('product')">📦 商品管理</button>
        <button id="tab-order" onclick="switchTab('order')">📋 订单管理</button>
    </div>

    <!-- ==================== 商品管理页面 ==================== -->
    <div id="product-page">
        <div class="top-bar">
            <label>🏪 闲鱼会员名：</label>
            <input type="text" id="userNameInput" value="叶刘军" placeholder="请输入闲鱼会员名">
            <span style="font-size: 11px; color: #555;">（上架必填，请填账号）</span>
        </div>
        <button onclick="loadProducts()" style="margin-bottom: 15px;">刷新商品列表</button>
        <div id="productStatusMsg" class="status-msg">正在加载商品列表...</div>

        <div class="table-wrapper">
            <table id="productTable">
                <thead>
                    <tr><th>商品ID</th><th>商品标题</th><th>状态</th><th>价格(元)</th><th>库存</th><th>操作</th></tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ==================== 订单管理页面 ==================== -->
    <div id="order-page" style="display: none;">
        <div class="top-bar">
            <label>📦 订单状态：</label>
            <select id="orderStatusFilter">
                <option value="">全部订单</option>
                <option value="11">待付款</option>
                <option value="12">待发货</option>
                <option value="21">已发货</option>
                <option value="22">已完成</option>
                <option value="23">已退款</option>
                <option value="24">已关闭</option>
            </select>
            <button onclick="loadOrders(1)">刷新</button>
        </div>
        <div id="orderStatusMsg" class="status-msg">正在加载订单列表...</div>

        <div class="table-wrapper">
            <table id="orderTable">
                <thead>
                    <tr><th>订单号</th><th>买家</th><th>商品/规格</th><th>金额(元)</th><th>状态</th><th>下单时间</th><th>操作</th></tr>
                </thead>
                <tbody id="orderTableBody"></tbody>
            </table>
        </div>

        <div class="pagination">
            <span id="orderPageInfo" style="font-size: 12px; color:#333;"></span>
            <button class="page-btn" id="orderPrevBtn" onclick="changeOrderPage(-1)">上一页</button>
            <button class="page-btn" id="orderNextBtn" onclick="changeOrderPage(1)">下一页</button>
        </div>
    </div>
</div>

<script>
    // ================= 全局配置 =================
    const WORKER_URL = "https://xian-guanjia-worker.1113630283.workers.dev";
    // ============================================

    const productTableBody = document.getElementById('productTableBody');
    const productStatusMsg = document.getElementById('productStatusMsg');
    const userNameInput = document.getElementById('userNameInput');
    
    const orderTableBody = document.getElementById('orderTableBody');
    const orderStatusMsg = document.getElementById('orderStatusMsg');
    const orderStatusFilter = document.getElementById('orderStatusFilter');
    const orderPageInfo = document.getElementById('orderPageInfo');
    const orderPrevBtn = document.getElementById('orderPrevBtn');
    const orderNextBtn = document.getElementById('orderNextBtn');

    let currentOrderPage = 1;
    const orderPageSize = 20;
    const orderStatusMap = { 11: "待付款", 12: "待发货", 21: "已发货", 22: "已完成", 23: "已退款", 24: "已关闭" };

    function switchTab(tabName) {
        document.getElementById('tab-product').classList.remove('active');
        document.getElementById('tab-order').classList.remove('active');
        document.getElementById('product-page').style.display = 'none';
        document.getElementById('order-page').style.display = 'none';

        if (tabName === 'product') {
            document.getElementById('tab-product').classList.add('active');
            document.getElementById('product-page').style.display = 'block';
        } else {
            document.getElementById('tab-order').classList.add('active');
            document.getElementById('order-page').style.display = 'block';
            loadOrders(1); 
        }
    }

    async function loadProducts() {
        productStatusMsg.innerText = "正在加载商品列表...";
        productTableBody.innerHTML = "";
        const requestData = { path: "/api/open/product/list", body: { page: 1, page_size: 10 } };

        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestData) });
            const result = await response.json();
            if (result.code === 0) {
                productStatusMsg.innerText = "加载成功！点击【展开规格】修改价格和库存。";
                result.data.list.forEach(product => {
                    let statusBadge = `<span class="badge-unknown">未知(${product.product_status || '无'})</span>`;
                    if (product.product_status === 22) statusBadge = `<span class="badge-on">✅ 已上架</span>`;
                    else if (product.product_status === 31) statusBadge = `<span class="badge-off">⛔ 已下架</span>`;
                    else if (product.product_status === 23) statusBadge = `<span class="badge-sold">🏷️ 已售出</span>`;

                    const priceYuan = product.price ? (product.price / 100).toFixed(2) : '-';
                    const stock = product.stock !== undefined ? product.stock : '-';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${product.product_id}</td>
                        <td><b>${product.title || '无标题'}</b></td>
                        <td>${statusBadge}</td>
                        <td>${priceYuan}</td>
                        <td>${stock}</td>
                        <td>
                            <button onclick="toggleSkuList(${product.product_id}, this)" data-expanded="false" style="padding:6px 10px; font-size:12px;">展开规格</button>
                            <button class="btn-publish" onclick="publishProduct(${product.product_id}, this)" style="padding:6px 10px; font-size:12px;">上架</button>
                            <button class="btn-down" onclick="downShelfProduct(${product.product_id}, this)" style="padding:6px 10px; font-size:12px;">下架</button>
                        </td>
                    `;
                    productTableBody.appendChild(tr);
                });
            } else { productStatusMsg.innerText = "加载失败：" + result.msg; }
        } catch (error) { productStatusMsg.innerText = "请求出错：" + error.message; }
    }

    async function toggleSkuList(productId, btn) {
        const mainRow = btn.closest('tr');
        if (btn.dataset.expanded === 'true') {
            let nextRow = mainRow.nextElementSibling;
            while (nextRow && nextRow.classList.contains('sku-row')) { let rowToDelete = nextRow; nextRow = nextRow.nextElementSibling; rowToDelete.remove(); }
            btn.innerText = "展开规格"; btn.dataset.expanded = "false"; return; 
        }
        document.querySelectorAll('.sku-row').forEach(row => row.remove());
        document.querySelectorAll('#productTableBody button').forEach(otherBtn => {
            if (otherBtn.dataset.expanded === 'true') { otherBtn.innerText = "展开规格"; otherBtn.dataset.expanded = "false"; }
        });
        btn.innerText = "加载中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/detail", body: { product_id: productId } }) });
            const result = await response.json();
            if (result.code === 0 && result.data.sku_items) {
                let lastInsertedRow = mainRow; 
                result.data.sku_items.forEach(sku => {
                    const skuTr = document.createElement('tr');
                    skuTr.className = 'sku-row';
                    const priceInYuan = (sku.price / 100).toFixed(2); 
                    skuTr.innerHTML = `
                        <td>└─ ${sku.sku_id}</td>
                        <td>${sku.sku_text}</td>
                        <td>-</td>
                        <td><input type="number" step="0.01" class="input-box" id="price_${sku.sku_id}" value="${priceInYuan}"> 元</td>
                        <td><input type="number" class="input-box" id="stock_${sku.sku_id}" value="${sku.stock}"> 件</td>
                        <td><button class="btn-save" onclick="updateSkuData(${productId}, ${sku.sku_id})">保存</button></td>
                    `;
                    lastInsertedRow.parentNode.insertBefore(skuTr, lastInsertedRow.nextSibling);
                    lastInsertedRow = skuTr; 
                });
                btn.innerText = "收起规格"; btn.disabled = false; btn.dataset.expanded = "true"; 
            } else { alert("获取规格失败：" + (result.msg || "未知错误")); btn.innerText = "重试"; btn.disabled = false; }
        } catch (error) { alert("网络错误：" + error.message); btn.innerText = "重试"; btn.disabled = false; }
    }

    async function updateSkuData(productId, skuId) {
        const newStockStr = document.getElementById(`stock_${skuId}`).value;
        const newPriceYuanStr = document.getElementById(`price_${skuId}`).value;
        if (newStockStr === '' || newPriceYuanStr === '') return alert("请输入价格和库存");
        const newPriceFen = Math.round(parseFloat(newPriceYuanStr) * 100);
        const newStock = parseInt(newStockStr);
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/edit/stock", body: { product_id: productId, sku_items: [ { sku_id: skuId, stock: newStock, price: newPriceFen } ] } }) });
            const result = await response.json();
            if (result.code === 0) alert("价格和库存修改成功！"); else alert("修改失败：" + result.msg);
        } catch (error) { alert("请求出错：" + error.message); }
    }

    async function publishProduct(productId, btn) {
        const userName = userNameInput.value.trim();
        if (!userName) return alert("请先在上方填写你的闲鱼会员名！");
        if (!confirm(`确定将商品 ${productId} 上架到店铺【${userName}】？`)) return;
        btn.innerText = "上架中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/publish", body: { product_id: parseInt(productId), user_name: [userName] } }) });
            const result = await response.json();
            if (result.code === 0) { alert("上架指令发送成功！\n\n⚠️注意：异步同步，请稍等1-5分钟刷新查看。"); loadProducts(); } 
            else { alert("上架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { btn.innerText = "上架"; btn.disabled = false; }
    }

    async function downShelfProduct(productId, btn) {
        if (!confirm(`确定将商品 ${productId} 下架吗？`)) return;
        btn.innerText = "下架中..."; btn.disabled = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/product/downShelf", body: { product_id: parseInt(productId) } }) });
            const result = await response.json();
            if (result.code === 0) { alert("下架指令发送成功！\n\n⚠️注意：异步同步，请稍等1-5分钟刷新查看。"); loadProducts(); } 
            else { alert("下架失败：" + result.msg); }
        } catch (error) { alert("请求出错：" + error.message); } finally { btn.innerText = "下架"; btn.disabled = false; }
    }

    async function loadOrders(pageNo = 1) {
        currentOrderPage = pageNo;
        orderStatusMsg.innerText = "正在加载订单列表...";
        orderTableBody.innerHTML = "";
        orderPageInfo.innerText = `第 ${currentOrderPage} 页`;
        const bodyParams = { page_no: currentOrderPage, page_size: orderPageSize };
        const selectedStatus = orderStatusFilter.value;
        if (selectedStatus) bodyParams.order_status = parseInt(selectedStatus);
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/order/list", body: bodyParams }) });
            const result = await response.json();
            if (result.code === 0) {
                const orders = result.data.list || [];
                if (orders.length === 0) orderStatusMsg.innerText = "暂无订单数据。";
                else {
                    orderStatusMsg.innerText = `成功加载 ${orders.length} 条订单。`;
                    orders.forEach(order => {
                        const tr = document.createElement('tr');
                        const goods = order.goods || {};
                        const priceInYuan = (order.total_amount / 100).toFixed(2); 
                        const statusText = orderStatusMap[order.order_status] || `未知`;
                        const timeStr = order.create_time ? new Date(order.create_time * 1000).toLocaleString('zh-CN') : '未知时间';
                        tr.innerHTML = `
                            <td>${order.order_no}</td>
                            <td>${order.buyer_nick}</td>
                            <td><div>${goods.title || '未知商品'}</div><div style="font-size:11px; color:#555;">${goods.sku_text || ''}</div></td>
                            <td><b>${priceInYuan} 元</b></td>
                            <td><span class="status-badge status-${order.order_status}">${statusText}</span></td>
                            <td>${timeStr}</td>
                            <td><button class="btn-edit" style="background: rgba(255,193,7,0.9); color:#333; padding:6px 10px; font-size:12px;" onclick="alert('改价功能开发中')">改价</button></td>
                        `;
                        orderTableBody.appendChild(tr);
                    });
                }
                orderPrevBtn.disabled = (currentOrderPage <= 1);
                orderNextBtn.disabled = (orders.length < orderPageSize); 
            } else { orderStatusMsg.innerText = "加载失败：" + result.msg; }
        } catch (error) { orderStatusMsg.innerText = "请求出错：" + error.message; }
    }

    function changeOrderPage(delta) {
        const newPage = currentOrderPage + delta;
        if (newPage < 1) return;
        loadOrders(newPage);
    }

    orderStatusFilter.addEventListener('change', () => { loadOrders(1); });
    loadProducts();
</script>
</body>
</html>
