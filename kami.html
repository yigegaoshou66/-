<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 卡密管理</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%); background-attachment: fixed; margin: 0; color: #1c1c1e; }
        .container { max-width: 1100px; margin: 0 auto; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 20px; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15); padding: 15px; }
        h1 { color: #1c1c1e; text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 15px; }

        .nav-tabs { display: flex; background: rgba(255, 255, 255, 0.5); padding: 5px; border-radius: 14px; margin-bottom: 15px; }
        .nav-tabs button { flex: 1; background: none; border: none; color: #555; font-size: 14px; font-weight: bold; padding: 10px; border-radius: 10px; }
        .nav-tabs button.active { color: #007bff; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        .top-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.4); padding: 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.6); }
        .top-bar label { font-weight: bold; color: #333; font-size: 13px; }
        .top-bar input, .top-bar select { padding: 10px; border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.9); border-radius: 10px; font-size: 16px; outline: none; width: 100%; }
        
        button { padding: 12px 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; background: #007bff; box-shadow: 0 4px 12px rgba(0,122,255,0.2); transition: 0.2s; width: 100%; margin-bottom: 10px; }
        button:active { transform: scale(0.98); }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-delete { background: #dc3545; }
        .btn-stock { background: #17a2b8; }
        .btn-info { background: #6f42c1; }
        .btn-save { background: #28a745; padding: 10px 12px; font-size: 13px; width: auto; margin-bottom: 0; }

        /* 表格卡片化 */
        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        tr { display: block; background: rgba(255,255,255,0.8); border-radius: 16px; margin-bottom: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.9); }
        td { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px dashed rgba(0,0,0,0.05); font-size: 13px; text-align: right; color: #1c1c1e; }
        td:last-child { border-bottom: none; padding-bottom: 0; }
        td::before { content: attr(data-label); font-weight: bold; color: #666; text-align: left; margin-right: 10px; flex-shrink: 0; }

        .status-msg { margin-top: 10px; color: #333; font-weight: bold; font-size: 13px; }

        /* 弹窗手机全屏适配 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-content { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(30px); border-radius: 24px 24px 0 0; padding: 20px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-content h2 { margin-top: 0; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px; font-size: 20px; }
        .form-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.8); border-radius: 12px; font-size: 16px; outline: none; }
        .form-group textarea { height: 150px; resize: vertical; }
        .checkbox-group { display: flex; align-items: center; gap: 15px; margin-top: 5px; }
        .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; }
        .modal-footer { text-align: right; margin-top: 20px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }
        .modal-footer button { width: auto; padding: 12px 24px; margin-bottom: 0; }
        
        .info-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .info-item { background: rgba(255,255,255,0.6); padding: 12px; border-radius: 12px; border-left: 4px solid #007bff; }
        .info-item .label { font-size: 11px; color: #888; }
        .info-item .value { font-size: 15px; font-weight: bold; margin-top: 4px; color: #333; word-break: break-all; }
        
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .page-btn { background: #6c757d; padding: 8px 12px; font-size: 12px; width: auto; margin-bottom: 0; }

        /* ================= 💻 电脑端专属优化 ================= */
        @media (min-width: 768px) {
            /* 顶部工具栏 */
            .top-bar { flex-direction: row; align-items: center; flex-wrap: wrap; }
            .top-bar label { white-space: nowrap; }
            .top-bar input, .top-bar select { flex: 1; min-width: 120px; width: auto; }
            .top-bar button { width: auto; margin-bottom: 0; }
            
            /* 表格还原 */
            .table-wrapper { overflow-x: auto; }
            table { display: table; width: 100%; background: rgba(255, 255, 255, 0.8); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
            thead { display: table-header-group; background: rgba(0,0,0,0.03); }
            thead tr { display: table-row; background: none; border: none; box-shadow: none; margin: 0; padding: 0; border-radius: 0; }
            thead th { display: table-cell; padding: 12px; text-align: left; font-weight: bold; color: #333; border-bottom: 1px solid rgba(0,0,0,0.1); }
            tbody tr { display: table-row; background: transparent; border: none; box-shadow: none; margin: 0; padding: 0; border-radius: 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
            tbody tr:hover { background: rgba(255, 255, 255, 0.5); }
            tbody td { display: table-cell; padding: 12px; text-align: left; border: none; vertical-align: middle; }
            tbody td::before { display: none; }
            td[data-label="操作"] { display: table-cell; }
            td[data-label="操作"] button { width: auto; margin: 0 5px 5px 0; }

            /* 弹窗居中 */
            .modal-overlay { align-items: center; }
            .modal-content { border-radius: 24px; width: 90%; max-width: 600px; margin: auto; max-height: 85vh; animation: fadeIn 0.2s; }
            @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
            
            /* 表单横向排列 */
            .form-row { flex-direction: row; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>闲管家 · 卡密管理</h1>
    <div class="nav-tabs">
        <button id="tab-kind" class="active" onclick="switchTab('kind')">🎫 卡种</button>
        <button id="tab-category" onclick="switchTab('category')">📂 卡密分类</button>
    </div>

    <!-- 卡种页面 -->
    <div id="kind-page">
        <div class="top-bar">
            <label>卡种名称：</label>
            <input type="text" id="kindNameFilter" placeholder="模糊搜索">
            <label>类型：</label>
            <select id="kindTypeFilter"><option value="">全部</option><option value="1">唯一卡</option><option value="2">图片</option></select>
            <label>分类ID：</label>
            <input type="number" id="kindCategoryFilter" placeholder="ID">
            <button onclick="loadKinds(1)">搜索</button>
            <button onclick="loadKinds(1)">刷新</button>
        </div>
        <div id="kindStatusMsg" class="status-msg">正在加载卡种列表...</div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>卡种ID</th><th>名称</th><th>分类</th><th>库存</th><th>成本</th><th>操作</th></tr></thead>
                <tbody id="kindTableBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <span id="kindPageInfo" style="font-size: 12px; color:#333;"></span>
            <div>
                <button class="page-btn" id="kindPrevBtn" onclick="changeKindPage(-1)">上一页</button>
                <button class="page-btn" id="kindNextBtn" onclick="changeKindPage(1)">下一页</button>
            </div>
        </div>
    </div>

    <!-- 卡密分类页面 -->
    <div id="category-page" style="display: none;">
        <div class="top-bar">
            <button onclick="loadCategories()">刷新分类列表</button>
            <button class="btn-save" onclick="openCategoryModal()">+ 新建分类</button>
        </div>
        <div id="categoryStatusMsg" class="status-msg">正在加载卡密分类...</div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>分类ID</th><th>名称</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody id="categoryTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 弹窗 -->
<div id="categoryModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 450px;">
        <h2 id="categoryModalTitle">新建卡密分类</h2>
        <div class="form-group"><label>分类名称 <span style="color: red;">*</span> (最多20字)</label><input type="text" id="editCategoryName" maxlength="20"></div>
        <div class="form-group"><label>备注 <span style="color: red;">*</span> (最多50字)</label><textarea id="editCategoryRemark" maxlength="50" style="height: 80px;"></textarea></div>
        <div class="modal-footer">
            <button style="background: #6c757d;" onclick="closeCategoryModal()">取消</button>
            <button style="background: #28a745;" onclick="submitCategory()">保存</button>
        </div>
    </div>
</div>

<div id="kindModal" class="modal-overlay">
    <div class="modal-content">
        <h2>编辑卡种</h2>
        <input type="hidden" id="editKindId">
        <div class="form-row">
            <div class="form-group"><label>卡种名称 <span style="color: red;">*</span></label><input type="text" id="editKindName"></div>
            <div class="form-group"><label>卡种别名 (可选)</label><input type="text" id="editKindAlias"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>分类 ID</label><input type="number" id="editKindCategory"></div>
            <div class="form-group"><label>成本单价 (元)</label><input type="number" step="0.01" id="editKindCost"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>卡号类型</label><select id="editKindCardType"><option value="1">文本</option><option value="2">二维码</option><option value="3">条形码</option><option value="4">图片链接</option><option value="5">相册链接</option></select></div>
            <div class="form-group"><label>密码类型</label><select id="editKindPwdType"><option value="1">文本</option><option value="2">二维码</option><option value="3">条形码</option></select></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>卡号前缀</label><input type="text" id="editKindCardPrefix"></div>
            <div class="form-group"><label>密码前缀</label><input type="text" id="editKindPwdPrefix"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>分隔符</label><select id="editKindSeparator"><option value="0">无</option><option value="1">逗号</option><option value="2">空格</option><option value="3">|</option><option value="4">换行</option></select></div>
            <div class="form-group"><label>预警阈值</label><input type="number" id="editKindStockWarning"></div>
            <div class="form-group"><label>排序值</label><input type="number" id="editKindSort"></div>
        </div>
        <div class="modal-footer">
            <button style="background: #6c757d;" onclick="closeKindModal()">取消</button>
            <button style="background: #28a745;" onclick="submitKindEdit()">保存</button>
        </div>
    </div>
</div>

<div id="kindInfoModal" class="modal-overlay">
    <div class="modal-content">
        <h2>📊 卡种详情</h2>
        <div id="kindInfoContent" class="info-grid"></div>
        <div class="modal-footer"><button style="background: #6c757d;" onclick="closeKindInfoModal()">关闭</button></div>
    </div>
</div>

<div id="stockModal" class="modal-overlay">
    <div class="modal-content">
        <h2>添加卡密库存</h2>
        <div class="form-group"><label>卡种名称</label><input type="text" id="addStockKindName" readonly style="background: rgba(0,0,0,0.05);"></div>
        <div class="form-group" style="margin-top: 10px;">
            <label>选项设置</label>
            <div class="checkbox-group">
                <label><input type="checkbox" id="addStockCover"> 覆盖已存在卡密</label>
                <label><input type="checkbox" id="addStockPriority" checked> 优先出售</label>
            </div>
        </div>
        <div class="form-group" style="margin-top: 10px;">
            <label>卡密内容 <span style="color: red;">*</span>（每行一条链接，无需填卡号）</label>
            <textarea id="addStockCards" placeholder="粘贴链接..."></textarea>
        </div>
        <div class="modal-footer">
            <button style="background: #6c757d;" onclick="closeStockModal()">取消</button>
            <button style="background: #28a745;" onclick="submitAddStock()">提交添加</button>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://xian-guanjia-worker.1113630283.workers.dev";
    let currentCategoryData = [];
    let currentKindData = [];
    let currentKindPage = 1;
    const kindPageSize = 20;

    function switchTab(tabName) {
        document.getElementById('tab-kind').classList.remove('active');
        document.getElementById('tab-category').classList.remove('active');
        document.getElementById('kind-page').style.display = 'none';
        document.getElementById('category-page').style.display = 'none';
        if (tabName === 'kind') { document.getElementById('tab-kind').classList.add('active'); document.getElementById('kind-page').style.display = 'block'; loadKinds(1); }
        else { document.getElementById('tab-category').classList.add('active'); document.getElementById('category-page').style.display = 'block'; loadCategories(); }
    }

    async function loadKinds(pageNo = 1) {
        currentKindPage = pageNo;
        document.getElementById('kindStatusMsg').innerText = "正在加载卡种列表...";
        document.getElementById('kindTableBody').innerHTML = "";
        document.getElementById('kindPageInfo').innerText = `第 ${currentKindPage} 页`;
        const bodyParams = { page_no: currentKindPage, page_size: kindPageSize };
        if (document.getElementById('kindNameFilter').value) bodyParams.kind_name = document.getElementById('kindNameFilter').value;
        if (document.getElementById('kindTypeFilter').value) bodyParams.kind_type = parseInt(document.getElementById('kindTypeFilter').value);
        if (document.getElementById('kindCategoryFilter').value) bodyParams.kind_category = parseInt(document.getElementById('kindCategoryFilter').value);
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/kami/kind/list", body: bodyParams }) });
            const result = await response.json();
            if (result.code === 0) {
                const kinds = result.data.list || [];
                currentKindData = kinds;
                document.getElementById('kindStatusMsg').innerText = `成功加载 ${kinds.length} 个卡种。`;
                kinds.forEach(kind => {
                    const costYuan = kind.cost ? (parseFloat(kind.cost) / 100).toFixed(2) : '0.00';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td data-label="卡种ID">${kind.kind_id}</td>
                        <td data-label="名称">${kind.kind_name}</td>
                        <td data-label="分类">${kind.kind_category_name || '-'}</td>
                        <td data-label="库存">${kind.stock}</td>
                        <td data-label="成本">${costYuan} 元</td>
                        <td data-label="操作" style="justify-content: flex-start; gap: 5px; flex-wrap: wrap;">
                            <button class="btn-info" onclick="openKindInfoModal(${kind.kind_id})" style="padding:8px 12px; font-size:12px; width:auto; margin:0;">详情</button>
                            <button class="btn-stock" onclick="openAddStockModal(${kind.kind_id})" style="padding:8px 12px; font-size:12px; width:auto; margin:0;">添加</button>
                            <button class="btn-edit" onclick="editKind(${kind.kind_id})" style="padding:8px 12px; font-size:12px; width:auto; margin:0;">编辑</button>
                            <button class="btn-delete" onclick="deleteKind(${kind.kind_id})" style="padding:8px 12px; font-size:12px; width:auto; margin:0;">删除</button>
                        </td>
                    `;
                    document.getElementById('kindTableBody').appendChild(tr);
                });
                document.getElementById('kindPrevBtn').disabled = (currentKindPage <= 1);
                document.getElementById('kindNextBtn').disabled = (kinds.length < kindPageSize);
            } else { document.getElementById('kindStatusMsg').innerText = "加载失败：" + result.msg; }
        } catch (error) { document.getElementById('kindStatusMsg').innerText = "请求出错：" + error.message; }
    }

    function changeKindPage(delta) { const newPage = currentKindPage + delta; if (newPage < 1) return; loadKinds(newPage); }

    async function openKindInfoModal(kindId) {
        document.getElementById('kindInfoContent').innerHTML = '加载中...';
        document.getElementById('kindInfoModal').style.display = 'flex';
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/kami/kind/info", body: { kind_id: kindId } }) });
            const result = await response.json();
            if (result.code === 0) {
                const d = result.data;
                document.getElementById('kindInfoContent').innerHTML = `
                    <div class="info-item"><div class="label">卡种名称</div><div class="value">${d.kind_name}</div></div>
                    <div class="info-item"><div class="label">别名</div><div class="value">${d.kind_alias || '-'}</div></div>
                    <div class="info-item"><div class="label">总库存</div><div class="value" style="color: #0056b3;">${d.total_stock}</div></div>
                    <div class="info-item"><div class="label">未售库存</div><div class="value" style="color: #28a745;">${d.stock}</div></div>
                    <div class="info-item"><div class="label">已售数量</div><div class="value" style="color: #dc3545;">${d.sold}</div></div>
                    <div class="info-item"><div class="label">平均成本</div><div class="value">${d.avg_cost} 元</div></div>
                    <div class="info-item"><div class="label">未售总成本</div><div class="value">${d.total_cost} 元</div></div>
                    <div class="info-item"><div class="label">预警阈值</div><div class="value">${d.stock_warning}</div></div>
                `;
            } else { document.getElementById('kindInfoContent').innerHTML = `<div style="color:red;">失败：${result.msg}</div>`; }
        } catch (error) { document.getElementById('kindInfoContent').innerHTML = `<div style="color:red;">出错：${error.message}</div>`; }
    }
    function closeKindInfoModal() { document.getElementById('kindInfoModal').style.display = 'none'; }

    function editKind(kindId) {
        const kind = currentKindData.find(k => k.kind_id === kindId);
        if (!kind) return alert("找不到数据");
        document.getElementById('editKindId').value = kind.kind_id;
        document.getElementById('editKindName').value = kind.kind_name || '';
        document.getElementById('editKindAlias').value = kind.kind_alias || '';
        document.getElementById('editKindCategory').value = kind.kind_category || '';
        document.getElementById('editKindCardType').value = kind.card_type || 1;
        document.getElementById('editKindPwdType').value = kind.pwd_type || 1;
        document.getElementById('editKindCardPrefix').value = kind.card_prefix || '';
        document.getElementById('editKindPwdPrefix').value = kind.pwd_prefix || '';
        document.getElementById('editKindSeparator').value = kind.separator || 0;
        document.getElementById('editKindStockWarning').value = kind.stock_warning || 0;
        document.getElementById('editKindSort').value = kind.sort || 0;
        document.getElementById('editKindCost').value = kind.cost ? (parseFloat(kind.cost) / 100).toFixed(2) : '0.00';
        document.getElementById('kindModal').style.display = 'flex';
    }
    function closeKindModal() { document.getElementById('kindModal').style.display = 'none'; }

    async function submitKindEdit() {
        const kindId = document.getElementById('editKindId').value;
        const bodyData = { kind_id: parseInt(kindId), kind_name: document.getElementById('editKindName').value.trim(), card_type: parseInt(document.getElementById('editKindCardType').value) };
        const costYuan = document.getElementById('editKindCost').value;
        if (document.getElementById('editKindAlias').value) bodyData.kind_alias = document.getElementById('editKindAlias').value.trim();
        if (document.getElementById('editKindCategory').value) bodyData.kind_category = parseInt(document.getElementById('editKindCategory').value);
        if (document.getElementById('editKindPwdType').value) bodyData.pwd_type = parseInt(document.getElementById('editKindPwdType').value);
        if (document.getElementById('editKindCardPrefix').value) bodyData.card_prefix = document.getElementById('editKindCardPrefix').value.trim();
        if (document.getElementById('editKindPwdPrefix').value) bodyData.pwd_prefix = document.getElementById('editKindPwdPrefix').value.trim();
        if (document.getElementById('editKindStockWarning').value) bodyData.stock_warning = parseInt(document.getElementById('editKindStockWarning').value);
        if (costYuan) bodyData.cost = Math.round(parseFloat(costYuan) * 100);
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/kami/kind/edit", body: bodyData }) });
            const result = await response.json();
            if (result.code === 0) { alert("修改成功！"); closeKindModal(); loadKinds(currentKindPage); } else { alert("失败：" + result.msg); }
        } catch (error) { alert("出错：" + error.message); }
    }

    async function deleteKind(kindId) {
        if (!confirm(`⚠️ 警告：确定删除卡种 ${kindId} 吗？这会删除所有卡密！`)) return;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/kami/kind/delete", body: { kind_id: [kindId] } }) });
            const result = await response.json();
            if (result.code === 0) { alert("删除成功！"); loadKinds(currentKindPage); } else { alert("失败：" + result.msg); }
        } catch (error) { alert("出错：" + error.message); }
    }

    function openAddStockModal(kindId) {
        const kind = currentKindData.find(k => k.kind_id === kindId);
        if (!kind) return alert("找不到数据");
        document.getElementById('addStockKindName').value = kind.kind_name;
        document.getElementById('addStockCards').value = '';
        document.getElementById('stockModal').style.display = 'flex';
    }
    function closeStockModal() { document.getElementById('stockModal').style.display = 'none'; }

    async function submitAddStock() {
        const kindId = currentKindData.find(k => k.kind_name === document.getElementById('addStockKindName').value)?.kind_id;
        if (!kindId) return alert("找不到卡种ID");
        const cardsText = document.getElementById('addStockCards').value.trim();
        if (!cardsText) return alert("请输入卡密内容");
        const cards = cardsText.split('\n').filter(l => l.trim()).map(l => ({ card_no: "", card_pwd: l.trim() }));
        if (cards.length === 0) return alert("请输入有效内容");
        const requestData = { path: "/api/open/kami/storage/create", body: { kind_id: parseInt(kindId), cost: 0, is_cover: document.getElementById('addStockCover').checked, is_repeat: true, is_priority: document.getElementById('addStockPriority').checked, cards: cards } };
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestData) });
            const result = await response.json();
            if (result.code === 0) { alert("添加成功！"); closeStockModal(); loadKinds(currentKindPage); } else { alert("失败：" + result.msg); }
        } catch (error) { alert("出错：" + error.message); }
    }

    async function loadCategories() {
        document.getElementById('categoryStatusMsg').innerText = "正在加载卡密分类...";
        document.getElementById('categoryTableBody').innerHTML = "";
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/kami/category/list", body: {} }) });
            const result = await response.json();
            if (result.code === 0) {
                const categories = result.data.list || [];
                currentCategoryData = categories;
                document.getElementById('categoryStatusMsg').innerText = `成功加载 ${categories.length} 个分类。`;
                categories.forEach(cat => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td data-label="分类ID">${cat.category_id}</td>
                        <td data-label="名称">${cat.category_name}</td>
                        <td data-label="备注">${cat.remark || '-'}</td>
                        <td data-label="创建时间">${cat.create_time || '-'}</td>
                        <td data-label="操作" style="justify-content: flex-start; gap: 5px;">
                            <button class="btn-edit" onclick="editCategory(${cat.category_id})" style="padding:8px 12px; font-size:12px; width:auto; margin:0;">编辑</button>
                            <button class="btn-delete" onclick="deleteCategory(${cat.category_id})" style="padding:8px 12px; font-size:12px; width:auto; margin:0;">删除</button>
                        </td>
                    `;
                    document.getElementById('categoryTableBody').appendChild(tr);
                });
            } else { document.getElementById('categoryStatusMsg').innerText = "加载失败：" + result.msg; }
        } catch (error) { document.getElementById('categoryStatusMsg').innerText = "出错：" + error.message; }
    }

    function openCategoryModal() {
        document.getElementById('categoryModalTitle').innerText = "新建卡密分类";
        document.getElementById('editCategoryName').value = '';
        document.getElementById('editCategoryRemark').value = '';
        document.getElementById('categoryModal').style.display = 'flex';
    }
    function editCategory(id) {
        const cat = currentCategoryData.find(c => c.category_id === id);
        if (!cat) return alert("找不到数据");
        document.getElementById('categoryModalTitle').innerText = "编辑卡密分类";
        document.getElementById('editCategoryName').value = cat.category_name;
        document.getElementById('editCategoryRemark').value = cat.remark || '';
        document.getElementById('categoryModal').style.display = 'flex';
    }
    function closeCategoryModal() { document.getElementById('categoryModal').style.display = 'none'; }

    async function submitCategory() {
        const name = document.getElementById('editCategoryName').value.trim();
        const remark = document.getElementById('editCategoryRemark').value.trim();
        if (!name || !remark) return alert("请填写完整信息");
        const isEdit = document.getElementById('categoryModalTitle').innerText.includes("编辑");
        const catId = isEdit ? currentCategoryData.find(c => c.category_name === name)?.category_id : null;
        const requestData = { path: isEdit ? "/api/open/kami/category/edit" : "/api/open/kami/category/create", body: isEdit ? { category_id: parseInt(catId), category_name: name, remark: remark } : { category_name: name, remark: remark } };
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestData) });
            const result = await response.json();
            if (result.code === 0) { alert("操作成功！"); closeCategoryModal(); loadCategories(); } else { alert("失败：" + result.msg); }
        } catch (error) { alert("出错：" + error.message); }
    }

    async function deleteCategory(id) {
        if (!confirm(`确定删除分类 ${id} 吗？`)) return;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/kami/category/delete", body: { category_id: [id] } }) });
            const result = await response.json();
            if (result.code === 0) { alert("删除成功！"); loadCategories(); } else { alert("失败：" + result.msg); }
        } catch (error) { alert("出错：" + error.message); }
    }

    loadKinds(1);
</script>
</body>
</html>
