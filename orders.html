<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 订单管理助手</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-orange: #FF9500;
            --ios-gray: #8E8E93;
            --text-primary: #1c1c1e;
            --text-secondary: rgba(60, 60, 67, 0.6);
            --text-tertiary: rgba(60, 60, 67, 0.35);
            --glass-light: rgba(255, 255, 255, 0.55);
            --glass-light-strong: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-highlight: rgba(255, 255, 255, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; min-height: 100vh; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; 
            padding: 16px; 
            color: var(--text-primary); 
            -webkit-font-smoothing: antialiased;
            background: #F2F4F8;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            inset: -100px;
            z-index: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(255, 150, 150, 0.6) 0%, transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(120, 180, 255, 0.6) 0%, transparent 32%),
                radial-gradient(circle at 70% 60%, rgba(150, 230, 180, 0.5) 0%, transparent 33%),
                radial-gradient(circle at 20% 75%, rgba(255, 220, 130, 0.55) 0%, transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(200, 160, 240, 0.55) 0%, transparent 33%);
            filter: blur(70px);
            opacity: 0.9;
            animation: blobsMove 25s ease-in-out infinite alternate;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
        }
        @keyframes blobsMove {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(1.05); }
        }

        .container { 
            position: relative;
            z-index: 1;
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }

        .page-header { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; z-index: 10; }
        .page-header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.5px; }
        .back-btn { 
            position: absolute; left: 0; top: 50%; transform: translateY(-50%); 
            text-decoration: none; 
            background: var(--glass-light-strong);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            color: var(--ios-blue); 
            padding: 10px 16px; border-radius: 100px; font-size: 13px; font-weight: 600; 
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 12px rgba(0,0,0,0.06);
            transition: 0.15s; white-space: nowrap; 
            cursor: pointer;
        }
        .back-btn:active { transform: translateY(-50%) scale(0.92); }

        /* ===================== 紧凑统计横条 ===================== */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: var(--glass-light);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 16px rgba(0,0,0,0.05);
            padding: 12px 16px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .stats-bar::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
        }
        .stats-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }
        .stats-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stats-value-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .stats-amount {
            font-size: 24px;
            font-weight: 800;
            color: var(--ios-green);
            letter-spacing: -0.8px;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }
        .stats-count {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .stats-right {
            flex-shrink: 0;
        }
        .stats-date-input {
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.95);
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 600;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            width: 130px;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
        }
        .stats-date-input:focus {
            border-color: var(--ios-blue);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
        }
        /* ============================================================== */

        .top-bar { 
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; 
            padding: 14px 18px; 
            background: var(--glass-light);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 22px; border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 16px rgba(0,0,0,0.05);
            position: relative;
            z-index: 100;
        }
        .top-bar label { font-weight: 600; color: var(--text-secondary); font-size: 13px; display: none; }
        
        .custom-select-wrapper {
            position: relative;
            flex: 1;
            min-width: 120px;
            width: 100%;
        }
        .custom-select-trigger {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            font-size: 15px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .custom-select-trigger:focus, .custom-select-trigger.active {
            border-color: var(--ios-blue);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
        }
        .custom-select-trigger::after {
            content: "▼";
            font-size: 10px;
            color: var(--text-secondary);
            transition: transform 0.2s;
        }
        .custom-select-trigger.active::after {
            transform: rotate(180deg);
        }
        .custom-options {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 999;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            padding: 6px;
        }
        .custom-options.open {
            display: block;
            animation: slideDownFade 0.2s ease-out;
        }
        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-option {
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            transition: background 0.1s;
            margin-bottom: 2px;
        }
        .custom-option:last-child { margin-bottom: 0; }
        .custom-option:hover {
            background: rgba(0, 122, 255, 0.1);
        }
        .custom-option.selected {
            background: var(--ios-blue);
            color: white;
        }

        button { 
            padding: 10px 16px; color: white; border: none; border-radius: 100px; cursor: pointer; 
            font-size: 14px; font-weight: 600; background: var(--ios-blue); 
            box-shadow: 0 4px 12px rgba(0,122,255,0.2); 
            transition: transform 0.05s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.05s, box-shadow 0.05s; 
            width: 100%; margin-bottom: 10px; 
        }
        button:active { transform: scale(0.92); opacity: 0.85; filter: brightness(0.9); }
        button:disabled { background-color: #ccc; box-shadow: none; opacity: 0.6; }
        
        .page-btn { background: var(--glass-light-strong); color: var(--ios-blue); border: 1px solid var(--glass-border); padding: 10px 16px; font-size: 13px; width: auto; margin-bottom: 0; backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 2px 8px rgba(0,0,0,0.04); }
        .page-btn:disabled { opacity: 0.5; color: var(--text-secondary); border-color: transparent; background: rgba(0,0,0,0.05); box-shadow: none; }

        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        
        tr { 
            display: flex !important; 
            flex-wrap: wrap; 
            background: var(--glass-light);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 24px; 
            margin-bottom: 12px; 
            padding: 18px; 
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                0 6px 20px rgba(0,0,0,0.06);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        tr::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
            z-index: 2;
        }
        
        td { 
            display: flex !important; 
            align-items: center; 
            padding: 2px 0; 
            border: none; 
            font-size: 13px; 
            color: var(--text-primary); 
            width: 50%;
            margin: 0 !important;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        td::before { 
            content: attr(data-label); 
            font-weight: 500; 
            color: var(--text-secondary); 
            margin-right: 6px; 
            flex-shrink: 0; 
        }
        
        td[data-label="订单号"], td[data-label="商品"], td[data-label="操作"] { 
            width: 100%; 
        }
        
        td[data-label="订单号"] { 
            font-size: 11px; 
            color: var(--text-tertiary); 
            padding-bottom: 6px; 
            border-bottom: 1px solid rgba(60,60,67,0.08); 
            margin-bottom: 8px !important; 
            font-family: monospace;
        }
        td[data-label="订单号"]::before { display: none; }
        
        td[data-label="商品"] { 
            font-size: 15px; 
            font-weight: 700; 
            line-height: 1.4; 
            padding-bottom: 10px; 
            margin-bottom: 8px !important; 
            border-bottom: 1px solid rgba(60,60,67,0.08);
            display: -webkit-box !important; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        td[data-label="商品"]::before { display: none; }
        td[data-label="商品"] small { display: none; } 
        
        td[data-label="买家"], td[data-label="时间"],
        td[data-label="金额"], td[data-label="状态"] {
            padding: 4px 0;
        }
        td[data-label="买家"]::before { content: "买家:"; }
        td[data-label="时间"]::before { content: "时间:"; }
        td[data-label="金额"]::before { content: "金额:"; }
        td[data-label="状态"]::before { content: "状态:"; }
        
        td[data-label="操作"] { 
            margin-top: 10px !important; 
            padding-top: 12px !important; 
            border-top: 1px solid rgba(60,60,67,0.08); 
            gap: 8px; 
        }
        td[data-label="操作"]::before { display: none; }
        td[data-label="操作"] button { 
            flex: 1; 
            padding: 10px 12px; 
            font-size: 13px; 
            margin: 0; 
            border-radius: 100px; 
        }
        
        .status-badge { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .status-11 { background: rgba(255,193,7,0.2); color: #856404; }
        .status-12 { background: rgba(0,123,255,0.15); color: #004085; }
        .status-21 { background: rgba(40,167,69,0.15); color: #155724; }
        .status-22 { background: rgba(23,162,184,0.15); color: #0c5460; }
        .status-23, .status-24 { background: rgba(220,53,69,0.15); color: #721c24; }

        .status-msg { margin-top: 12px; color: var(--text-secondary); font-weight: 600; font-size: 13px; text-align: center; }
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }

        @media (max-width: 768px) {
            button:active { transform: scale(0.9) !important; opacity: 0.7 !important; transition: transform 0.1s, opacity 0.1s; }
        }
        button:disabled { cursor: not-allowed !important; transform: none !important; opacity: 0.6 !important; }
        .btn-loading { pointer-events: none; opacity: 0.8; }
        .btn-loading::after {
            content: ""; display: inline-block; width: 14px; height: 14px;
            margin-left: 6px; vertical-align: middle; border: 2px solid currentColor;
            border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (min-width: 768px) {
            body { padding: 32px; }
            .container { padding: 0; max-width: 1200px; }

            .stats-bar { padding: 14px 22px; }
            .stats-amount { font-size: 28px; }
            .stats-date-input { width: 150px; font-size: 14px; }

            .top-bar { flex-direction: row; align-items: center; flex-wrap: wrap; padding: 18px; margin-bottom: 24px; }
            .top-bar label { display: block; white-space: nowrap; font-size: 14px; }
            .custom-select-wrapper { flex: 1; min-width: 200px; width: auto; }
            .top-bar button { width: auto; margin-bottom: 0; padding: 10px 24px; font-size: 14px; }

            .table-wrapper { 
                overflow-x: auto; 
                border-radius: 22px; 
                border: 1px solid var(--glass-border);
                background: var(--glass-light);
                backdrop-filter: blur(30px) saturate(180%);
                -webkit-backdrop-filter: blur(30px) saturate(180%);
                box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 16px rgba(0,0,0,0.05);
            }
            table { display: table !important; width: 100%; border-collapse: collapse; }
            thead { display: table-header-group !important; background: rgba(255, 255, 255, 0.4); }
            thead tr { display: table-row !important; background: none !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; }
            thead tr::before { display: none; }
            thead th { display: table-cell !important; padding: 18px !important; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid rgba(60,60,67,0.08); white-space: nowrap; font-size: 13px; }
            
            tbody tr { display: table-row !important; background: transparent !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; border-bottom: 1px solid rgba(60,60,67,0.06) !important; overflow: visible; }
            tbody tr::before { display: none; }
            tbody tr:hover { background: rgba(255, 255, 255, 0.4) !important; }
            tbody td { 
                display: table-cell !important; 
                padding: 18px !important; 
                text-align: left; 
                border: none !important; 
                vertical-align: middle; 
                width: auto !important; 
                margin: 0 !important; 
                font-size: 14px; 
                color: var(--text-primary) !important; 
            }
            tbody td::before { display: none !important; }
            
            tbody td[data-label="订单号"] { font-family: monospace; color: var(--text-tertiary) !important; font-size: 13px !important; white-space: nowrap; border-bottom: none !important; padding-bottom: 18px !important; margin-bottom: 0 !important; }
            tbody td[data-label="买家"] { white-space: nowrap; }
            tbody td[data-label="商品"] { min-width: 250px; white-space: normal; line-height: 1.5; display: table-cell !important; -webkit-line-clamp: unset; border-bottom: none !important; padding-bottom: 18px !important; margin-bottom: 0 !important; }
            tbody td[data-label="金额"] { white-space: nowrap; font-weight: 600; }
            tbody td[data-label="状态"] { white-space: nowrap; }
            tbody td[data-label="时间"] { white-space: nowrap; color: var(--text-secondary) !important; font-size: 13px !important; }
            
            tbody td[data-label="操作"] { white-space: nowrap; min-width: 130px; border-top: none !important; margin-top: 0 !important; padding-top: 18px !important; }
            tbody td[data-label="操作"] button { display: inline-block !important; width: auto !important; margin: 0 8px 0 0 !important; padding: 8px 18px !important; font-size: 13px !important; }
            tbody td[data-label="操作"] button:last-child { margin-right: 0 !important; }
            
            .page-btn { padding: 10px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <a href="index.html" class="back-btn" onclick="handleBack(event)">返回</a>
        <h1>闲管家 · 订单管理助手</h1>
    </div>

    <!-- ===================== 紧凑统计横条 ===================== -->
    <div class="stats-bar">
        <div class="stats-left">
            <div class="stats-label" id="statsLabel">今日销售额</div>
            <div class="stats-value-row">
                <span class="stats-amount" id="statsAmount">--</span>
                <span class="stats-count" id="statsCount">加载中...</span>
            </div>
        </div>
        <div class="stats-right">
            <input type="date" id="statsDatePicker" class="stats-date-input">
        </div>
    </div>
    <!-- ============================================================== -->

    <div class="top-bar">
        <label>状态筛选：</label>
        <div class="custom-select-wrapper" id="orderStatusWrapper">
            <div class="custom-select-trigger" id="orderStatusTrigger" data-value="">全部订单</div>
            <div class="custom-options" id="orderStatusOptions">
                <div class="custom-option selected" data-value="">全部订单</div>
                <div class="custom-option" data-value="11">待付款</div>
                <div class="custom-option" data-value="12">待发货</div>
                <div class="custom-option" data-value="21">已发货</div>
                <div class="custom-option" data-value="22">已完成</div>
                <div class="custom-option" data-value="23">已退款</div>
                <div class="custom-option" data-value="24">已关闭</div>
            </div>
        </div>
        <button onclick="refreshAll()">刷新订单</button>
    </div>

    <div id="statusMsg" class="status-msg">正在加载订单列表...</div>

    <div class="table-wrapper">
        <table id="orderTable">
            <thead>
                <tr>
                    <th>订单号</th><th>买家</th><th>商品</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination">
        <span id="pageInfo" style="font-size: 13px; color:var(--text-secondary); font-weight: 500;"></span>
        <div>
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://api.1113630283.online";
    let isRequesting = false;
    let currentStatusFilter = "";
    let isStatsLoading = false;
    let cachedDailyMap = null;    // 缓存的每日统计数据

    // ================= 浏览器原生返回 =================
    function handleBack(event) {
        event.preventDefault();
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = 'index.html';
        }
    }

    // ================= 日期工具 =================
    function formatDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    // ================= 自定义下拉框 =================
    function setupCustomSelect(triggerId, optionsId, onChange) {
        const trigger = document.getElementById(triggerId);
        const optionsContainer = document.getElementById(optionsId);
        const options = optionsContainer.querySelectorAll('.custom-option');

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.custom-options.open').forEach(el => {
                if (el !== optionsContainer) {
                    el.classList.remove('open');
                    el.previousElementSibling.classList.remove('active');
                }
            });
            optionsContainer.classList.toggle('open');
            trigger.classList.toggle('active');
        });

        options.forEach(opt => {
            opt.addEventListener('click', (e) => {
                e.stopPropagation();
                const value = opt.getAttribute('data-value');
                const text = opt.textContent;

                trigger.setAttribute('data-value', value);
                trigger.textContent = text;
                
                options.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');

                optionsContainer.classList.remove('open');
                trigger.classList.remove('active');

                if (onChange) onChange(value);
            });
        });
    }

    setupCustomSelect('orderStatusTrigger', 'orderStatusOptions', (value) => {
        currentStatusFilter = value;
        loadOrders(1);
    });

    document.addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        const link = e.target.closest('.back-btn');

        if (!btn && !link) return;

        if (link) {
            if (window._isNavigating) { e.stopImmediatePropagation(); e.preventDefault(); return; }
            window._isNavigating = true;
            link.style.pointerEvents = 'none';
            link.style.opacity = '0.5';
            link.style.transform = 'translateY(-50%) scale(0.9)';
            link.style.transition = 'all 0.1s ease';
            setTimeout(() => {
                window._isNavigating = false;
                link.style.pointerEvents = '';
                link.style.opacity = '';
                link.style.transform = 'translateY(-50%)';
            }, 2000);
            return;
        }

        if (btn) {
            if (btn.disabled) return;
            if (isRequesting) {
                e.stopImmediatePropagation();
                e.preventDefault();
                const originalText = btn.innerText;
                btn.innerText = '处理中...';
                btn.style.opacity = '0.5';
                setTimeout(() => { btn.innerText = originalText; btn.style.opacity = '1'; }, 500);
                return;
            }
            btn.dataset.originalText = btn.innerText;
            btn.innerText = '等待中...';
            btn.disabled = true;
            btn.classList.add('btn-loading');
            setTimeout(() => {
                if (!isRequesting && btn.classList.contains('btn-loading')) { restoreButton(btn); }
            }, 500);
        }
    }, true);

    function restoreButton(btn) {
        if (btn.classList.contains('btn-loading')) {
            btn.disabled = false;
            btn.innerText = btn.dataset.originalText || '刷新';
            btn.classList.remove('btn-loading');
            delete btn.dataset.originalText;
        }
    }

    let currentPage = 1;
    const pageSize = 20;
    const tableBody = document.getElementById('tableBody');
    const statusMsg = document.getElementById('statusMsg');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const statusMap = { 11: "待付款", 12: "待发货", 21: "已发货", 22: "已完成", 23: "已退款", 24: "已关闭" };

    // ================= 刷新全部 =================
    function refreshAll() {
        sessionStorage.removeItem('preload_orders');
        cachedDailyMap = null;   // 清空统计缓存，强制重新拉取
        loadOrders(1);
        loadDailyStats(true);
    }

    // ================= 订单列表加载 =================
    async function loadOrders(pageNo = 1) {
        currentPage = pageNo;
        tableBody.innerHTML = "";
        pageInfo.innerText = `第 ${currentPage} 页`;
        
        if (pageNo === 1 && !currentStatusFilter) {
            const cached = sessionStorage.getItem('preload_orders');
            if (cached) {
                try {
                    const data = JSON.parse(cached);
                    const orders = data.list || [];
                    if (orders.length > 0) {
                        statusMsg.innerText = "加载成功（页面数据已秒开）";
                        renderOrders(orders);
                        prevBtn.disabled = true;
                        nextBtn.disabled = (orders.length < pageSize);
                    }
                } catch (e) {
                    console.error("解析订单缓存失败", e);
                }
            } else {
                statusMsg.innerText = "正在加载订单列表...";
            }
        } else {
            statusMsg.innerText = "正在加载订单列表...";
        }
        
        const bodyParams = { page_no: currentPage, page_size: pageSize };
        if (currentStatusFilter) bodyParams.order_status = parseInt(currentStatusFilter);

        isRequesting = true;
        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/order/list", body: bodyParams }) });
            const result = await response.json();
            if (result.code === 0) {
                const orders = result.data.list || [];
                
                if (pageNo === 1 && !currentStatusFilter) {
                    sessionStorage.setItem('preload_orders', JSON.stringify(result.data));
                }

                if (orders.length === 0) {
                    statusMsg.innerText = "暂无订单数据。";
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#999; padding:40px;">暂无订单数据</td></tr>`;
                } else {
                    statusMsg.innerText = `成功加载 ${orders.length} 条订单。`;
                    renderOrders(orders);
                }
                prevBtn.disabled = (currentPage <= 1);
                nextBtn.disabled = (orders.length < pageSize); 
            } else statusMsg.innerText = "加载失败：" + result.msg;
        } catch (error) { statusMsg.innerText = "请求出错：" + error.message; }
        finally { isRequesting = false; }
    }

    function renderOrders(orders) {
        orders.forEach(order => {
            const goods = order.goods || {};
            const priceInYuan = (order.total_amount / 100).toFixed(2); 
            
            const timeStamp = order.create_time || order.order_time;
            let timeStr = '未知时间';
            if (timeStamp) {
                const date = new Date(timeStamp * 1000);
                timeStr = date.getFullYear() + '/' + String(date.getMonth() + 1).padStart(2, '0') + '/' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td data-label="订单号">${order.order_no}</td>
                <td data-label="商品">${goods.title || '未知'}</td>
                <td data-label="买家">${order.buyer_nick}</td>
                <td data-label="时间">${timeStr}</td>
                <td data-label="金额"><b>${priceInYuan} 元</b></td>
                <td data-label="状态"><span class="status-badge status-${order.order_status}">${statusMap[order.order_status] || '未知'}</span></td>
                <td data-label="操作" style="justify-content: flex-start;">
                    <button class="page-btn" style="background: var(--ios-orange); color:#fff;" onclick="alert('改价开发中')">改价</button>
                    <button class="page-btn" style="background: var(--ios-green); color:#fff;" onclick="alert('发货开发中')">发货</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    function changePage(delta) { 
        const newPage = currentPage + delta; 
        if (newPage < 1) return; 
        loadOrders(newPage); 
    }

    // ================= 每日销售额统计 =================
    async function loadDailyStats(forceRefresh = false) {
        if (isStatsLoading) return;
        
        // 如果已有缓存且不是强制刷新，直接渲染
        if (cachedDailyMap && !forceRefresh) {
            renderStatsBar();
            return;
        }
        
        isStatsLoading = true;

        const amountEl = document.getElementById('statsAmount');
        const countEl = document.getElementById('statsCount');
        amountEl.textContent = '--';
        countEl.textContent = '正在统计...';

        const allOrders = [];
        const maxPages = 15;
        const pageSizeStats = 20;
        const statsWindowDays = 7;

        const now = new Date();
        const sevenDaysAgo = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (statsWindowDays - 1));
        sevenDaysAgo.setHours(0, 0, 0, 0);
        const sevenDaysAgoTs = Math.floor(sevenDaysAgo.getTime() / 1000);

        // 逐页拉取
        for (let page = 1; page <= maxPages; page++) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: "/api/open/order/list", body: { page_no: page, page_size: pageSizeStats } })
                });
                const result = await response.json();
                if (result.code !== 0) break;

                const orders = result.data.list || [];
                if (orders.length === 0) break;

                let minTsInPage = Infinity;
                orders.forEach(order => {
                    const ts = order.create_time || order.order_time;
                    if (ts && ts < minTsInPage) minTsInPage = ts;
                    allOrders.push(order);
                });

                if (minTsInPage < sevenDaysAgoTs) break;
                if (orders.length < pageSizeStats) break;

                await new Promise(r => setTimeout(r, 50));
            } catch (e) {
                console.error('加载统计数据失败', e);
                break;
            }
        }

        // 按日期分组
        const dailyMap = {};
        allOrders.forEach(order => {
            // 排除已退款、已关闭
            if (order.order_status === 23 || order.order_status === 24) return;

            const ts = order.create_time || order.order_time;
            if (!ts) return;

            const tsMs = ts > 9999999999 ? ts : ts * 1000;
            const date = new Date(tsMs);
            const dateKey = formatDateKey(date);

            if (!dailyMap[dateKey]) {
                dailyMap[dateKey] = { amount: 0, count: 0 };
            }
            dailyMap[dateKey].amount += (order.total_amount || 0);
            dailyMap[dateKey].count += 1;
        });

        cachedDailyMap = dailyMap;
        isStatsLoading = false;

        renderStatsBar();
    }

    // 根据日期选择器渲染统计条
    function renderStatsBar() {
        const datePicker = document.getElementById('statsDatePicker');
        const labelEl = document.getElementById('statsLabel');
        const amountEl = document.getElementById('statsAmount');
        const countEl = document.getElementById('statsCount');

        const selectedDate = datePicker.value;
        if (!selectedDate) return;

        const todayKey = formatDateKey(new Date());
        const isToday = selectedDate === todayKey;

        // 标签
        if (isToday) {
            labelEl.textContent = '今日销售额';
        } else {
            const mmdd = selectedDate.substring(5).replace('-', '月') + '日';
            labelEl.textContent = mmdd + ' 销售额';
        }

        // 数值
        const data = (cachedDailyMap && cachedDailyMap[selectedDate]) || { amount: 0, count: 0 };
        amountEl.textContent = `¥${(data.amount / 100).toFixed(2)}`;
        countEl.textContent = `${data.count} 笔订单`;
    }

    // ================= 日期选择器初始化 =================
    function initDatePicker() {
        const picker = document.getElementById('statsDatePicker');
        const todayKey = formatDateKey(new Date());
        picker.value = todayKey;
        picker.max = todayKey;   // 不能选未来日期

        picker.addEventListener('change', () => {
            // 如果还没拉过数据，先拉一次
            if (!cachedDailyMap && !isStatsLoading) {
                loadDailyStats(true);
            } else {
                renderStatsBar();
            }
        });
    }

    // ================= 启动 =================
    initDatePicker();
    loadOrders(1);
    loadDailyStats();
</script>
</body>
