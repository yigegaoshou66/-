<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 订单管理助手</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%); background-attachment: fixed; margin: 0; color: #1c1c1e; }
        .container { max-width: 1200px; margin: 0 auto; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 20px; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15); padding: 15px; }
        h1 { color: #1c1c1e; text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 15px; }
        
        .top-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.4); padding: 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.6); }
        .top-bar label { font-weight: bold; color: #333; font-size: 13px; }
        .top-bar select { padding: 10px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.9); border-radius: 10px; font-size: 16px; outline: none; width: 100%; }
        
        button { padding: 12px 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; background: #007bff; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2); transition: 0.2s; width: 100%; margin-bottom: 10px; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #ccc; box-shadow: none; }
        .page-btn { background: #6c757d; padding: 10px 12px; font-size: 13px; width: auto; margin-bottom: 0; }

        /* 表格卡片化 */
        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        tr { display: block; background: rgba(255, 255, 255, 0.8); border-radius: 16px; margin-bottom: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.9); }
        td { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px dashed rgba(0,0,0,0.05); font-size: 13px; text-align: right; color: #1c1c1e; }
        td:last-child { border-bottom: none; padding-bottom: 0; }
        td::before { content: attr(data-label); font-weight: bold; color: #666; text-align: left; margin-right: 10px; flex-shrink: 0; }

        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .status-11 { background: #fff3cd; color: #856404; }
        .status-12 { background: #cce5ff; color: #004085; }
        .status-21 { background: #d4edda; color: #155724; }
        .status-22 { background: #d1ecf1; color: #0c5460; }
        .status-23, .status-24 { background: #f8d7da; color: #721c24; }
        .status-msg { margin-top: 10px; color: #333; font-weight: bold; font-size: 13px; }
        .item-info { font-size: 11px; color: #666; margin-top: 2px; }
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }

        /* ================= 💻 电脑端专属优化 ================= */
        @media (min-width: 768px) {
            .top-bar { flex-direction: row; align-items: center; }
            .top-bar label { white-space: nowrap; }
            .top-bar select { flex: 1; width: auto; }
            .top-bar button { width: auto; margin-bottom: 0; }
            
            .table-wrapper { overflow-x: auto; }
            table { display: table; width: 100%; background: rgba(255, 255, 255, 0.8); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
            thead { display: table-header-group; background: rgba(0,0,0,0.03); }
            thead tr { display: table-row; background: none; border: none; box-shadow: none; margin: 0; padding: 0; border-radius: 0; }
            thead th { display: table-cell; padding: 12px; text-align: left; font-weight: bold; color: #333; border-bottom: 1px solid rgba(0,0,0,0.1); }
            tbody tr { display: table-row; background: transparent; border: none; box-shadow: none; margin: 0; padding: 0; border-radius: 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
            tbody tr:hover { background: rgba(255, 255, 255, 0.5); }
            tbody td { display: table-cell; padding: 12px; text-align: left; border: none; vertical-align: middle; }
            tbody td::before { display: none; }
            td[data-label="操作"] { display: table-cell; }
            td[data-label="操作"] button { width: auto; margin: 0 5px 5px 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>闲管家 · 订单管理助手</h1>
    <div class="top-bar">
        <label>📦 状态筛选：</label>
        <select id="statusFilter">
            <option value="">全部订单</option><option value="11">待付款</option><option value="12">待发货</option><option value="21">已发货</option><option value="22">已完成</option><option value="23">已退款</option><option value="24">已关闭</option>
        </select>
        <button onclick="loadOrders(1)">刷新订单</button>
    </div>

    <div id="statusMsg" class="status-msg">正在加载订单列表...</div>

    <div class="table-wrapper">
        <table id="orderTable">
            <thead><tr><th>订单号</th><th>买家</th><th>商品</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination">
        <span id="pageInfo" style="font-size: 12px; color:#333;"></span>
        <div>
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://xian-guanjia-worker.1113630283.workers.dev";
    let currentPage = 1;
    const pageSize = 20; 
    const tableBody = document.getElementById('tableBody');
    const statusMsg = document.getElementById('statusMsg');
    const statusFilter = document.getElementById('statusFilter');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const statusMap = { 11: "待付款", 12: "待发货", 21: "已发货", 22: "已完成", 23: "已退款", 24: "已关闭" };

    async function loadOrders(pageNo = 1) {
        currentPage = pageNo;
        statusMsg.innerText = "正在加载订单列表...";
        tableBody.innerHTML = "";
        pageInfo.innerText = `第 ${currentPage} 页`;
        const bodyParams = { page_no: currentPage, page_size: pageSize };
        if (statusFilter.value) bodyParams.order_status = parseInt(statusFilter.value);

        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/order/list", body: bodyParams }) });
            const result = await response.json();
            if (result.code === 0) {
                const orders = result.data.list || [];
                if (orders.length === 0) statusMsg.innerText = "暂无订单数据。";
                else {
                    statusMsg.innerText = `成功加载 ${orders.length} 条订单。`;
                    orders.forEach(order => {
                        const goods = order.goods || {};
                        const priceInYuan = (order.total_amount / 100).toFixed(2); 
                        const timeStamp = order.create_time || order.order_time;
                        const timeStr = timeStamp ? new Date(timeStamp * 1000).toLocaleString('zh-CN') : '未知时间';
                        
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td data-label="订单号">${order.order_no}</td>
                            <td data-label="买家">${order.buyer_nick}</td>
                            <td data-label="商品">${goods.title || '未知'}<br><small style="color:#666;">${goods.sku_text || ''}</small></td>
                            <td data-label="金额"><b>${priceInYuan} 元</b></td>
                            <td data-label="状态"><span class="status-badge status-${order.order_status}">${statusMap[order.order_status] || '未知'}</span></td>
                            <td data-label="时间">${timeStr}</td>
                            <td data-label="操作" style="justify-content: flex-start;">
                                <button class="page-btn" style="background: #ffc107; color:#333; padding:6px 10px; font-size:12px; width:auto;" onclick="alert('改价开发中')">改价</button>
                                <button class="page-btn" style="background: #28a745; color:#fff; padding:6px 10px; font-size:12px; width:auto;" onclick="alert('发货开发中')">发货</button>
                            </td>
                        `;
                        tableBody.appendChild(tr);
                    });
                }
                prevBtn.disabled = (currentPage <= 1);
                nextBtn.disabled = (orders.length < pageSize); 
            } else statusMsg.innerText = "加载失败：" + result.msg;
        } catch (error) { statusMsg.innerText = "请求出错：" + error.message; }
    }

    function changePage(delta) { const newPage = currentPage + delta; if (newPage < 1) return; loadOrders(newPage); }
    statusFilter.addEventListener('change', () => { loadOrders(1); });
    loadOrders(1);
</script>
</body>
</html>
