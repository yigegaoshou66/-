<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 订单管理助手</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 8px; 
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            background-attachment: fixed; margin: 0; color: #1c1c1e;
        }
        .container { 
            max-width: 1200px; margin: 0 auto; 
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15); padding: 10px; 
        }
        h1 { color: #1c1c1e; text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 12px; }
        
        /* 顶部工具栏 */
        .top-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; background: rgba(255, 255, 255, 0.5); padding: 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.6); }
        .top-bar label { font-weight: bold; color: #333; font-size: 13px; display: none; } /* 手机端隐藏标签 */
        .top-bar select { padding: 8px 12px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.9); border-radius: 8px; font-size: 14px; outline: none; width: 100%; }
        
        button { padding: 10px 14px; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; background: #007bff; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2); transition: 0.2s; width: 100%; margin-bottom: 8px; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #ccc; box-shadow: none; }
        .page-btn { background: #6c757d; padding: 8px 12px; font-size: 12px; width: auto; margin-bottom: 0; }

        /* ================= 📱 手机端卡片化布局（紧凑） ================= */
        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        
        tr { 
            display: flex; flex-wrap: wrap; 
            background: #fff; border-radius: 12px; 
            margin-bottom: 8px; padding: 12px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); 
        }
        
        td { 
            display: flex; align-items: center; 
            padding: 2px 0; border: none; 
            font-size: 12px; text-align: left; color: #1c1c1e; 
            flex: 0 0 auto; margin-right: 12px; 
        }
        td::before { content: attr(data-label); font-weight: normal; color: #888; margin-right: 4px; flex-shrink: 0; }
        
        td[data-label="订单号"], td[data-label="商品"], td[data-label="操作"] { 
            flex: 0 0 100%; width: 100%; margin-right: 0;
        }
        
        td[data-label="订单号"] { font-size: 10px; color: #aaa; padding-bottom: 4px; border-bottom: 1px solid #f0f0f0; margin-bottom: 4px; }
        td[data-label="订单号"]::before { font-size: 10px; }
        
        td[data-label="商品"] { font-size: 13px; font-weight: bold; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px dashed #eee; }
        td[data-label="商品"]::before { display: none; }
        
        td[data-label="买家"], td[data-label="金额"], td[data-label="状态"], td[data-label="时间"] { width: calc(50% - 6px); margin-right: 0; }
        
        td[data-label="操作"] { 
            margin-top: 8px; padding-top: 8px; 
            border-top: 1px dashed #e5e5e5; 
            justify-content: flex-start; gap: 6px; flex-wrap: wrap;
        }
        td[data-label="操作"]::before { display: none; }
        td[data-label="操作"] button { padding: 6px 10px; font-size: 12px; margin: 0; box-shadow: none; border-radius: 6px; width: auto; }
        
        .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .status-11 { background: #fff3cd; color: #856404; }
        .status-12 { background: #cce5ff; color: #004085; }
        .status-21 { background: #d4edda; color: #155724; }
        .status-22 { background: #d1ecf1; color: #0c5460; }
        .status-23, .status-24 { background: #f8d7da; color: #721c24; }

        .status-msg { margin-top: 8px; color: #333; font-weight: bold; font-size: 12px; }
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }

        /* ================= 💻 电脑端专属优化（彻底还原标准表格） ================= */
        @media (min-width: 768px) {
            body { padding: 12px; }
            .container { padding: 15px; border-radius: 20px; }
            h1 { font-size: 20px; margin-bottom: 15px; }

            .top-bar { flex-direction: row; align-items: center; flex-wrap: wrap; padding: 12px; }
            .top-bar label { display: block; white-space: nowrap; }
            .top-bar select { flex: 1; min-width: 150px; width: auto; padding: 10px; font-size: 16px; }
            .top-bar button { width: auto; margin-bottom: 0; padding: 12px 18px; font-size: 14px; }

            .table-wrapper { overflow-x: auto; }
            table { display: table !important; width: 100%; background: rgba(255, 255, 255, 0.8); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-collapse: collapse; }
            thead { display: table-header-group !important; background: rgba(0,0,0,0.03); }
            thead tr { display: table-row !important; background: none !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; }
            thead th { display: table-cell !important; padding: 12px !important; text-align: left; font-weight: bold; color: #333; border-bottom: 1px solid rgba(0,0,0,0.1); }
            
            tbody tr { display: table-row !important; background: transparent !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; border-bottom: 1px solid rgba(0,0,0,0.05) !important; }
            tbody tr:hover { background: rgba(255, 255, 255, 0.5) !important; }
            tbody td { display: table-cell !important; padding: 12px !important; text-align: left; border: none !important; vertical-align: middle; flex: none !important; width: auto !important; margin: 0 !important; font-size: 13px; }
            tbody td::before { display: none !important; }
            
            tbody td[data-label="订单号"], tbody td[data-label="商品"], tbody td[data-label="操作"] {
                width: auto !important; margin: 0 !important; border: none !important; padding: 12px !important;
            }
            tbody td[data-label="订单号"] { font-size: 13px !important; color: #1c1c1e !important; border-bottom: none !important; }
            tbody td[data-label="商品"] { border-bottom: none !important; font-weight: normal !important; }
            
            td[data-label="操作"] { display: table-cell !important; }
            td[data-label="操作"] button { width: auto; margin: 0 5px 5px 0 !important; padding: 6px 10px !important; font-size: 12px !important; }
        }
    </style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <a href="index.html" class="back-btn">⬅ 返回</a>
    <h1>闲管家 · 订单管理助手</h1>
</div>
    
    <div class="top-bar">
        <label>📦 状态筛选：</label>
        <select id="statusFilter">
            <option value="">全部订单</option>
            <option value="11">待付款</option><option value="12">待发货</option><option value="21">已发货</option><option value="22">已完成</option><option value="23">已退款</option><option value="24">已关闭</option>
        </select>
        <button onclick="loadOrders(1)">刷新订单</button>
    </div>

    <div id="statusMsg" class="status-msg">正在加载订单列表...</div>

    <div class="table-wrapper">
        <table id="orderTable">
            <thead>
                <tr>
                    <th>订单号</th><th>买家</th><th>商品</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination">
        <span id="pageInfo" style="font-size: 12px; color:#333;"></span>
        <div>
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://api.1113630283.online";
    let currentPage = 1;
    const pageSize = 20; // 固定每页 20 条
    const tableBody = document.getElementById('tableBody');
    const statusMsg = document.getElementById('statusMsg');
    const statusFilter = document.getElementById('statusFilter');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const statusMap = { 11: "待付款", 12: "待发货", 21: "已发货", 22: "已完成", 23: "已退款", 24: "已关闭" };

    async function loadOrders(pageNo = 1) {
        currentPage = pageNo;
        statusMsg.innerText = "正在加载订单列表...";
        tableBody.innerHTML = "";
        pageInfo.innerText = `第 ${currentPage} 页`;
        
        const bodyParams = { page_no: currentPage, page_size: pageSize };
        if (statusFilter.value) bodyParams.order_status = parseInt(statusFilter.value);

        try {
            const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: "/api/open/order/list", body: bodyParams }) });
            const result = await response.json();
            if (result.code === 0) {
                const orders = result.data.list || [];
                if (orders.length === 0) {
                    statusMsg.innerText = "暂无订单数据。";
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#999; padding:20px;">暂无订单数据</td></tr>`;
                } else {
                    statusMsg.innerText = `成功加载 ${orders.length} 条订单。`;
                    renderOrders(orders);
                }
                prevBtn.disabled = (currentPage <= 1);
                nextBtn.disabled = (orders.length < pageSize); 
            } else statusMsg.innerText = "加载失败：" + result.msg;
        } catch (error) { statusMsg.innerText = "请求出错：" + error.message; }
    }

    function renderOrders(orders) {
        orders.forEach(order => {
            const goods = order.goods || {};
            const priceInYuan = (order.total_amount / 100).toFixed(2); 
            const timeStamp = order.create_time || order.order_time;
            const timeStr = timeStamp ? new Date(timeStamp * 1000).toLocaleString('zh-CN') : '未知时间';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td data-label="订单号">${order.order_no}</td>
                <td data-label="买家">${order.buyer_nick}</td>
                <td data-label="商品">${goods.title || '未知'}<br><small style="color:#666;">${goods.sku_text || ''}</small></td>
                <td data-label="金额"><b>${priceInYuan} 元</b></td>
                <td data-label="状态"><span class="status-badge status-${order.order_status}">${statusMap[order.order_status] || '未知'}</span></td>
                <td data-label="时间">${timeStr}</td>
                <td data-label="操作" style="justify-content: flex-start;">
                    <button class="page-btn" style="background: #ffc107; color:#333;" onclick="alert('改价开发中')">改价</button>
                    <button class="page-btn" style="background: #28a745; color:#fff;" onclick="alert('发货开发中')">发货</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    function changePage(delta) { 
        const newPage = currentPage + delta; 
        if (newPage < 1) return; 
        loadOrders(newPage); 
    }
    
    // 下拉框改变时重新加载
    statusFilter.addEventListener('change', () => { loadOrders(1); });
    
    // 初始化加载第一页
    loadOrders(1);
</script>
</body>
</html>
