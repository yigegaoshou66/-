<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲管家 · 实时订单推送</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-orange: #FF9500;
            --ios-gray: #8E8E93;
            --text-primary: #1c1c1e;
            --text-secondary: rgba(60, 60, 67, 0.6);
            --text-tertiary: rgba(60, 60, 67, 0.35);
            --glass-light: rgba(255, 255, 255, 0.55);
            --glass-light-strong: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-highlight: rgba(255, 255, 255, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; min-height: 100vh; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; 
            padding: 16px; 
            color: var(--text-primary); 
            -webkit-font-smoothing: antialiased;
            background: #F2F4F8;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            inset: -100px;
            z-index: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(255, 150, 150, 0.6) 0%, transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(120, 180, 255, 0.6) 0%, transparent 32%),
                radial-gradient(circle at 70% 60%, rgba(150, 230, 180, 0.5) 0%, transparent 33%),
                radial-gradient(circle at 20% 75%, rgba(255, 220, 130, 0.55) 0%, transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(200, 160, 240, 0.55) 0%, transparent 33%);
            filter: blur(70px);
            opacity: 0.9;
            animation: blobsMove 25s ease-in-out infinite alternate;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
        }
        @keyframes blobsMove {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(1.05); }
        }

        .container { 
            position: relative;
            z-index: 1;
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }

        .page-header { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; z-index: 10; }
        .page-header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.5px; }
        .back-btn { 
            position: absolute; left: 0; top: 50%; transform: translateY(-50%); 
            text-decoration: none; 
            background: var(--glass-light-strong);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            color: var(--ios-blue); 
            padding: 10px 16px; border-radius: 100px; font-size: 13px; font-weight: 600; 
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 12px rgba(0,0,0,0.06);
            transition: 0.15s; white-space: nowrap; 
            cursor: pointer;
        }
        .back-btn:active { transform: translateY(-50%) scale(0.92); }

        .top-bar { 
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; 
            padding: 14px 18px; 
            background: var(--glass-light);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 22px; border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 16px rgba(0,0,0,0.05);
            position: relative;
            z-index: 100;
        }
        
        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ios-green);
            padding: 6px 0;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--ios-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52,199,89, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(52,199,89, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52,199,89, 0); }
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
        button { 
            padding: 10px 16px; color: white; border: none; border-radius: 100px; cursor: pointer; 
            font-size: 14px; font-weight: 600; background: var(--ios-blue); 
            box-shadow: 0 4px 12px rgba(0,122,255,0.2); 
            transition: transform 0.05s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.05s; 
            flex: 1;
        }
        button:active { transform: scale(0.92); opacity: 0.85; filter: brightness(0.9); }
        button:disabled { background-color: #ccc; box-shadow: none; opacity: 0.6; cursor: not-allowed; }
        
        .table-wrapper { display: block; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        
        tr { 
            display: flex !important; 
            flex-wrap: wrap; 
            background: var(--glass-light);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 24px; 
            margin-bottom: 12px; 
            padding: 18px; 
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight),
                0 6px 20px rgba(0,0,0,0.06);
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: background 0.3s;
        }
        tr.new-order-flash {
            animation: flashGreen 1s ease-out;
        }
        @keyframes flashGreen {
            0% { background: rgba(52,199,89, 0.3); }
            100% { background: var(--glass-light); }
        }
        tr::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
            z-index: 2;
        }
        
        td { 
            display: flex !important; 
            align-items: center; 
            padding: 2px 0; 
            border: none; 
            font-size: 13px; 
            color: var(--text-primary); 
            width: 50%;
            margin: 0 !important;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        td::before { 
            content: attr(data-label); 
            font-weight: 500; 
            color: var(--text-secondary); 
            margin-right: 6px; 
            flex-shrink: 0; 
        }
        
        td[data-label="订单号"], td[data-label="商品"], td[data-label="操作"] { 
            width: 100%; 
        }
        
        td[data-label="订单号"] { 
            font-size: 11px; 
            color: var(--text-tertiary); 
            padding-bottom: 6px; 
            border-bottom: 1px solid rgba(60,60,67,0.08); 
            margin-bottom: 8px !important; 
            font-family: monospace;
        }
        td[data-label="订单号"]::before { display: none; }
        
        td[data-label="商品"] { 
            font-size: 15px; 
            font-weight: 700; 
            line-height: 1.4; 
            padding-bottom: 10px; 
            margin-bottom: 8px !important; 
            border-bottom: 1px solid rgba(60,60,67,0.08);
            display: -webkit-box !important; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
            text-overflow: ellipsis;
            color: var(--text-tertiary);
        }
        td[data-label="商品"]::before { display: none; }
        
        td[data-label="买家"]::before { content: "买家:"; }
        td[data-label="时间"]::before { content: "时间:"; }
        td[data-label="金额"]::before { content: "金额:"; }
        td[data-label="状态"]::before { content: "状态:"; }
        
        td[data-label="操作"] { 
            margin-top: 10px !important; 
            padding-top: 12px !important; 
            border-top: 1px solid rgba(60,60,67,0.08); 
            gap: 8px; 
            display: flex;
        }
        td[data-label="操作"]::before { display: none; }
        td[data-label="操作"] button { 
            flex: 1; 
            padding: 10px 12px; 
            font-size: 13px; 
            margin: 0; 
            border-radius: 100px; 
        }
        
        .status-badge { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .status-11 { background: rgba(255,193,7,0.2); color: #856404; }
        .status-12 { background: rgba(0,123,255,0.15); color: #004085; }
        .status-21 { background: rgba(40,167,69,0.15); color: #155724; }
        .status-22 { background: rgba(23,162,184,0.15); color: #0c5460; }
        .status-23, .status-24 { background: rgba(220,53,69,0.15); color: #721c24; }

        .status-msg { margin-top: 12px; color: var(--text-secondary); font-weight: 600; font-size: 13px; text-align: center; }

        @media (max-width: 768px) {
            button:active { transform: scale(0.9) !important; opacity: 0.7 !important; }
        }
        button:disabled { cursor: not-allowed !important; transform: none !important; opacity: 0.6 !important; }

        @media (min-width: 768px) {
            body { padding: 32px; }
            .container { padding: 0; max-width: 1200px; }

            .top-bar { flex-direction: row; align-items: center; justify-content: space-between; padding: 18px; margin-bottom: 24px; }
            .live-indicator { justify-content: flex-start; padding: 0; }
            .btn-group { width: auto; gap: 12px; }
            .btn-group button { flex: none; padding: 10px 24px; font-size: 14px; }

            .table-wrapper { 
                overflow-x: auto; 
                border-radius: 22px; 
                border: 1px solid var(--glass-border);
                background: var(--glass-light);
                backdrop-filter: blur(30px) saturate(180%);
                -webkit-backdrop-filter: blur(30px) saturate(180%);
                box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 16px rgba(0,0,0,0.05);
            }
            table { display: table !important; width: 100%; border-collapse: collapse; }
            thead { display: table-header-group !important; background: rgba(255, 255, 255, 0.4); }
            thead tr { display: table-row !important; background: none !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; }
            thead tr::before { display: none; }
            thead th { display: table-cell !important; padding: 18px !important; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid rgba(60,60,67,0.08); white-space: nowrap; font-size: 13px; }
            
            tbody tr { display: table-row !important; background: transparent !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; border-bottom: 1px solid rgba(60,60,67,0.06) !important; overflow: visible; }
            tbody tr::before { display: none; }
            tbody tr:hover { background: rgba(255, 255, 255, 0.4) !important; }
            tbody td { 
                display: table-cell !important; 
                padding: 18px !important; 
                text-align: left; 
                border: none !important; 
                vertical-align: middle; 
                width: auto !important; 
                margin: 0 !important; 
                font-size: 14px; 
                color: var(--text-primary) !important; 
            }
            tbody td::before { display: none !important; }
            
            tbody td[data-label="订单号"] { font-family: monospace; color: var(--text-tertiary) !important; font-size: 13px !important; white-space: nowrap; border-bottom: none !important; padding-bottom: 18px !important; margin-bottom: 0 !important; }
            tbody td[data-label="买家"] { white-space: nowrap; }
            tbody td[data-label="商品"] { min-width: 250px; white-space: normal; line-height: 1.5; display: table-cell !important; -webkit-line-clamp: unset; border-bottom: none !important; padding-bottom: 18px !important; margin-bottom: 0 !important; color: var(--text-primary); }
            tbody td[data-label="金额"] { white-space: nowrap; font-weight: 600; }
            tbody td[data-label="状态"] { white-space: nowrap; }
            tbody td[data-label="时间"] { white-space: nowrap; color: var(--text-secondary) !important; font-size: 13px !important; }
            
            tbody td[data-label="操作"] { white-space: nowrap; min-width: 130px; border-top: none !important; margin-top: 0 !important; padding-top: 18px !important; }
            tbody td[data-label="操作"] button { display: inline-block !important; width: auto !important; margin: 0 8px 0 0 !important; padding: 8px 18px !important; font-size: 13px !important; }
            tbody td[data-label="操作"] button:last-child { margin-right: 0 !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <a href="index.html" class="back-btn" onclick="handleBack(event)">返回</a>
        <h1>闲管家 · 实时订单推送</h1>
    </div>

    <div class="top-bar">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span id="liveText">实时监听中... (每10秒自动更新)</span>
        </div>
        <div class="btn-group">
            <button id="refreshBtn" onclick="manualRefresh()">手动刷新</button>
        </div>
    </div>

    <div id="statusMsg" class="status-msg">正在加载实时订单...</div>

    <div class="table-wrapper">
        <table id="orderTable">
            <thead>
                <tr>
                    <th>订单号</th><th>买家</th><th>商品</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const WORKER_URL = "https://api.1113630283.online";
    const tableBody = document.getElementById('tableBody');
    const statusMsg = document.getElementById('statusMsg');
    const liveText = document.getElementById('liveText');
    
    // 订单状态映射（根据你文档里的枚举值）
    const statusMap = { 
        11: "待付款", 
        12: "待发货", 
        21: "已发货", 
        22: "已完成", 
        23: "已退款", 
        24: "已关闭" 
    };
    
    // 记录上一次渲染的订单号，用于实现“新订单闪绿光”效果
    let lastOrderNos = new Set();
    let pollTimer = null;

    // ================= 浏览器原生返回 =================
    function handleBack(event) {
        event.preventDefault();
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = 'index.html';
        }
    }

    // ================= 手动刷新 =================
    async function manualRefresh() {
        const btn = document.getElementById('refreshBtn');
        if (btn.disabled) return;
        btn.disabled = true;
        btn.textContent = '刷新中...';
        await fetchAndRenderOrders(true);
        btn.disabled = false;
        btn.textContent = '手动刷新';
    }

    // ================= 自动轮询获取订单 =================
    async function fetchAndRenderOrders(isManual = false) {
        try {
            // 请求 Worker 新增的 /api/orders 接口
            const response = await fetch(`${WORKER_URL}/api/orders`, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const orders = await response.json();
            
            if (Array.isArray(orders)) {
                if (orders.length === 0) {
                    statusMsg.innerText = "暂无订单推送数据。等待新订单中...";
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#999; padding:40px;">暂无订单数据</td></tr>`;
                } else {
                    statusMsg.innerText = `已接收 ${orders.length} 条推送订单。`;
                    renderOrders(orders, isManual);
                }
            } else {
                statusMsg.innerText = "返回数据格式异常。";
            }
        } catch (error) {
            console.error('获取订单失败:', error);
            statusMsg.innerText = "获取实时订单出错，正在重试...";
        }
    }

    // ================= 渲染订单 =================
    function renderOrders(orders, isManual) {
        // 计算是否有新订单产生
        const currentOrderNos = new Set(orders.map(o => o.order_no));
        const hasNewOrder = [...currentOrderNos].some(no => !lastOrderNos.has(no)) && lastOrderNos.size > 0;
        
        tableBody.innerHTML = "";
        
        orders.forEach(order => {
            // 兼容处理：KV 中的数据可能缺少 goods 和 buyer_nick，这里做容错
            const title = order.goods?.title || order.title || '（商品信息未同步）';
            const buyerNick = order.buyer_nick || order.user_name || '未知买家';
            const priceInYuan = order.total_amount ? (order.total_amount / 100).toFixed(2) : '未知';
            
            // 使用 modify_time（Webhook 的更新字段）或 fallback 到 create_time
            const timeStamp = order.modify_time || order.create_time || order.order_time;
            let timeStr = '未知时间';
            if (timeStamp) {
                const date = new Date(timeStamp * 1000);
                timeStr = date.getFullYear() + '/' + String(date.getMonth() + 1).padStart(2, '0') + '/' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
            }

            const isNew = hasNewOrder && !lastOrderNos.has(order.order_no);

            const tr = document.createElement('tr');
            if (isNew) {
                tr.className = 'new-order-flash';
            }

            tr.innerHTML = `
                <td data-label="订单号">${order.order_no}</td>
                <td data-label="商品" style="color: var(--text-tertiary);">${title}</td>
                <td data-label="买家">${buyerNick}</td>
                <td data-label="时间">${timeStr}</td>
                <td data-label="金额"><b>${priceInYuan} 元</b></td>
                <td data-label="状态"><span class="status-badge status-${order.order_status}">${statusMap[order.order_status] || '未知('+order.order_status+')'}</span></td>
                <td data-label="操作" style="justify-content: flex-start;">
                    <button class="page-btn" style="background: var(--ios-orange); color:#fff;" onclick="alert('改价开发中')">改价</button>
                    <button class="page-btn" style="background: var(--ios-green); color:#fff;" onclick="alert('发货开发中')">发货</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });

        // 更新历史订单号记录
        lastOrderNos = currentOrderNos;
    }

    // ================= 启动实时监听 =================
    function startListening() {
        // 首次立即加载
        fetchAndRenderOrders();
        
        // 每 10 秒轮询一次
        pollTimer = setInterval(() => {
            // 如果页面被切到后台，暂停轮询以节省资源
            if (document.hidden) {
                liveText.innerText = "页面已挂起，暂停轮询...";
                return;
            }
            liveText.innerText = "实时监听中... (每10秒自动更新)";
            fetchAndRenderOrders();
        }, 10000);
    }

    // 页面隐藏和显示时改变状态文字
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            fetchAndRenderOrders();
        }
    });

    // 启动
    startListening();
</script>
</body>
</html>
